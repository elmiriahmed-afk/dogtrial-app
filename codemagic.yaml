workflows:
  ios-workflow:
    name: DogTrial iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dogtrial_asc_admin
    environment:
      groups:
        - code_signing
      vars:
        BUNDLE_ID: "dog.dogtrial.app"
        APP_ID: "6813073155"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (first run only)
        script: |
          test -d ios || npx cap add ios
      - name: Restrict app to iPhone only (no iPad support)
        script: |
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g; s/TARGETED_DEVICE_FAMILY = 2;/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Apply custom app icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          SRC="store-assets/app-icon-1024.png"
          if [ -d "$ICONSET" ] && [ -f "$SRC" ]; then
            python3 - "$ICONSET" "$SRC" <<'PYEOF'
          import json, os, subprocess, sys
          iconset, src = sys.argv[1], sys.argv[2]
          with open(os.path.join(iconset, "Contents.json")) as f:
              data = json.load(f)
          for image in data.get("images", []):
              filename = image.get("filename")
              if not filename:
                  continue
              w, _, h = image.get("size", "1024x1024").partition("x")
              scale = float(image.get("scale", "1x").rstrip("x"))
              px = str(int(round(float(w) * scale)))
              dest = os.path.join(iconset, filename)
              subprocess.run(["sips", "-z", px, px, src, "--out", dest], check=True)
              print("wrote " + dest + " " + px + "x" + px)
          PYEOF
          else
            echo "AppIcon.appiconset not found at $ICONSET or $SRC missing — skipping icon replacement"
          fi
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set unique build number
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          NEW_BUILD=$((BUILD_NUMBER + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Set iOS build number to $NEW_BUILD"
      - name: Declare export compliance (no custom encryption)
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up keychain to be used for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: DogTrial Android
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      android_signing:
        - dogtrial_keystore
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "dog.dogtrial.app"
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android release
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  android-open-testing-workflow:
    name: DogTrial Android (Open testing)
    max_build_duration: 60
    environment:
      android_signing:
        - dogtrial_keystore
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "dog.dogtrial.app"
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android release
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta

  android-closed-testing-workflow:
    name: DogTrial Android (Closed testing)
    max_build_duration: 60
    environment:
      android_signing:
        - dogtrial_keystore
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "dog.dogtrial.app"
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android release
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: true

      durationMinutes: result.durationMinutes,
      completionSnapshot: completionSnapshot || null,
      localDate: day,
      ts: now,
      dayOfTrial: tripDay(),
      read: false,
      acknowledged: false
    };
    state.dogMoments.unshift(moment);
    if (state.dogMoments.length > 80) state.dogMoments.length = 80;
    activeMomentBubble = moment;
    momentBubbleExpanded = false;
    save();
  }

  function tickHome(now){
    var last = state.lastTick;
    var deltaHours = (now-last)/HOUR;
    if (deltaHours <= 0) return;
    // Sniffing is a plain welcome card for the day's first session — never a
    // notification, never an incident, never saved to the notification
    // center. Tracking when it was last shown here (not inside a render
    // function) keeps the render side a pure read of this flag.
    var today = tripDay();
    if (state.sniffingCardDay !== today){
      state.sniffingCardDay = today;
      state.sniffingCardShownAt = now;
    }
    // Rolling 7-day wellness history for the Health tab's bar chart — one snapshot
    // per trip day, oldest dropped once there are more than 7.
    if (state.wellnessHistoryDay !== today){
      state.wellnessHistoryDay = today;
      state.wellnessHistory = (state.wellnessHistory || []).concat([{ day: today, score: Math.round(wellnessScore()), ts: now }]);
      if (state.wellnessHistory.length > 7) state.wellnessHistory = state.wellnessHistory.slice(-7);
    }
    var stageBefore = stageOf(state.dogDays);
    applyHomeDecay(deltaHours, stageBefore);
    state.dogDays += deltaHours*DOGDAYS_PER_HOUR;
    state.lastTick = now;
    var stageAfter = stageOf(state.dogDays);
    if (stageAfter !== stageBefore){
      log(state.name + " is now " + STAGE_LABEL[stageAfter].toLowerCase() + ".");
    }
    if (!canWalkOutside(state.dogDays) && state.bladder <= 0 && (now - (state.lastHomeAccidentAt||0)) > 0.75*HOUR){
      state.houseTraining = clamp(state.houseTraining - 3);
      state.lastHomeAccidentAt = now;
      state.accidentsCount = (state.accidentsCount||0) + 1;
      bumpOwnerLoad(8);
      log(state.name + " had an accident on the floor — before real walks start, puppies need a bathroom trip after almost every nap, meal, or play session. " + accidentGuidance(stageAfter));
      fireDogMomentById("missed_bathroom_signal", now);
    }
    maybePositiveMoment(deltaHours);
    checkPhaseTransition();
    bumpOwnerLoad(-deltaHours*0.5); // calm, uneventful time settles the load back down
    maybeTriggerDogMoment(now);
    save();
  }

  function computeTolerance(breed, stage, housing){
    return breed.tolerance * TOLERANCE_MULT[stage] * housing.toleranceMult;
  }

  // Difficulty comes from breed x home x life together, not from the breed alone —
  // the same husky can be an easy or a rough fit depending on the other two.
  function lifeFitMessage(breed, housing, stage, hoursAway){
    var tolerance = computeTolerance(breed, stage, housing);
    if (!isFinite(tolerance)) return "Pick a starting age above to see how this combination fits.";
    if (hoursAway <= tolerance) return breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone at this age — your typical day should fit.";
    var excess = hoursAway - tolerance;
    if (excess <= 2) return "This combination may create some challenges — " + breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone, a bit less than your typical day.";
    return "This combination may create significant challenges around exercise and alone time — " + breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone, well under your typical " + hoursAway + "h day.";
  }

  function housingRiskNote(housing){
    if (housing.id === "garden") return "there's a yard to burn energy in, so it's a lower-risk kind of alone";
    if (housing.id === "cage") return "no property is at risk, but this is exactly where crate time turns into anxiety and depression";
    return "confined with nothing to do — this is where boredom-chewing starts";
  }

  function resolveAway(now){
    var away = state.away;
    var actualHours = (now - away.leaveStart)/HOUR;
    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    applyHomeDecay(actualHours, stage); // baseline physiological need regardless of tolerance
    state.dogDays += actualHours*DOGDAYS_PER_HOUR;
    checkPhaseTransition();

    var tolerance = computeTolerance(breed, stage, housing);
    var excess = Math.max(0, actualHours - tolerance);
    var incidents = [];
    var houseTrained = state.houseTraining >= 70;
    var avgTraining = avgTrainingProgress();
    var wellTrained = avgTraining >= 60;
    if (excess > 0){
      var rolls = Math.min(4, Math.max(1, Math.ceil(excess/1.5) - (wellTrained?1:0) + housing.rollAdjust));
      var pool = housing.confinement
        ? CONFINEMENT_INCIDENTS.slice()
        : breed.incidents.filter(function(inc){ return !(houseTrained && inc.type==="accident"); });
      for (var i=0;i<rolls && pool.length>0;i++){
        var idx = Math.floor(Math.random()*pool.length);
        var inc = pool.splice(idx,1)[0];
        incidents.push(inc);
        state.bond = clamp(state.bond + inc.bond);
        state.health = clamp(state.health + inc.health);
        state.houseTraining = clamp(state.houseTraining + inc.house);
      }
    }

    // Crate time beyond a welfare-safe cap costs extra, regardless of how many incidents rolled —
    // this is the "depression" risk, distinct from the physical-damage risk of a free-roam apartment.
    var crateCap = 4 * TOLERANCE_MULT[stage];
    var crateOverage = 0;
    if (housing.confinement && actualHours > crateCap){
      crateOverage = actualHours - crateCap;
      state.bond = clamp(state.bond - crateOverage*1.5);
      state.health = clamp(state.health - crateOverage*1);
    }

    state.lastTick = now;
    state.away = null;
    state.totalHoursAway = (state.totalHoursAway||0) + actualHours;
    state.accidentsCount = (state.accidentsCount||0) + incidents.filter(function(inc){ return inc.type==="accident"; }).length;
    if (!state.awaySessions) state.awaySessions = [];
    state.awaySessions.push({ hours: actualHours, ts: now });
    if (state.awaySessions.length > 60) state.awaySessions.shift();
    if (!state.incidentTally) state.incidentTally = {};
    incidents.forEach(function(inc){ state.incidentTally[inc.type] = (state.incidentTally[inc.type]||0) + 1; });
    bumpOwnerLoad(5 + incidents.length*3 + (crateOverage>0 ? 5 : 0));

    // Build a real timeline instead of a lump-sum summary: each incident is logged with
    // the timestamp it actually happened at, spread across the window past tolerance —
    // action (leaving) -> state (restless) -> delay -> consequence (incident), not a score.
    var toleranceMs = tolerance*HOUR;
    var timeline = [{ ts: away.leaveStart, text: "Left for work — said back in " + away.declaredHours + "h." }];
    if (excess > 0){
      var restlessTs = away.leaveStart + toleranceMs;
      var restlessText = state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.";
      if (!away.awayAlerted) logAt(restlessTs, restlessText);
      timeline.push({ ts: restlessTs, text: restlessText });
    }
    if (incidents.length > 0){
      var windowMs = Math.max(1, now - (away.leaveStart + toleranceMs));
      incidents.forEach(function(inc, i){
        var ts = away.leaveStart + toleranceMs + windowMs * ((i+1) / (incidents.length+1));
        var text = state.name + " " + inc.text + ".";
        text = inc.type === "accident" ? text + " " + accidentGuidance(stage) : noteWithWhy(text, inc.type);
        logAt(ts, text);
        timeline.push({ ts: ts, text: text });
      });
    }
    if (crateOverage > 0){
      var crateText = state.name + " spent " + fmtHours(crateOverage) + " past the recommended crate-time limit.";
      log(crateText);
      timeline.push({ ts: now, text: crateText });
    }
    var homeText = (incidents.length===0 && crateOverage===0)
      ? state.name + " handled " + fmtHours(actualHours) + " alone just fine."
      : "You're home. " + state.name + " is excited to see you.";
    log(homeText);
    timeline.push({ ts: now, text: homeText });
    fireDogMomentById("new_visitor", now);
    // The only place a photo incident can be evaluated: the absence has just
    // actually ended, exactly once, from the snapshot frozen at departure.
    maybeEvaluateAbsenceIncident(away, now, actualHours*60);
    save();

    return { actualHours: actualHours, declaredHours: away.declaredHours, tolerance: tolerance, incidents: incidents,
      houseTrained: houseTrained, wellTrained: wellTrained, hadRisk: excess>0, housing: housing, crateOverage: crateOverage,
      timeline: timeline };
  }

  function checkNotify(){
    if (!state || !state.settings.notifications || !("Notification" in window) || Notification.permission !== "granted") return;
    var checks = [["hunger","is pacing by the food bowl, waiting"],["bladder","is circling by the door and whining"],["energy","is bouncing off the walls with pent-up energy"]];
    checks.forEach(function(pair){
      var key = pair[0];
      if (state[key] < 20 && Date.now() - (state.lastNotified[key]||0) > 2*HOUR){
        try { new Notification("The 30-Day Dog", { body: state.name + " " + pair[1] + ".", tag: "need-"+key }); } catch(e){}
        state.lastNotified[key] = Date.now();
        save();
      }
    });
  }

  // Ported near-verbatim from the notifications conception pack's
  // reference/decision.mjs (pure functions, framework-free). quietAt treats
  // equal start/end as "disabled", per the pack's own policy.json.
  function quietAt(now, zone, start, end){
    if (start === end) return false;
    var parts = {};
    new Intl.DateTimeFormat('en-GB', {timeZone:zone, hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date(now)).forEach(function(p){ parts[p.type] = p.value; });
    var m = Number(parts.hour)*60 + Number(parts.minute);
    var mins = function(s){ return Number(s.slice(0,2))*60 + Number(s.slice(3)); };
    var a = mins(start), b = mins(end);
    return a < b ? (m >= a && m < b) : (m >= a || m < b);
  }

  // REMINDER_CATEGORY_LABEL / REMINDER_ACTION_ICON map the imported catalog's
  // category/action strings to this app's i18n keys and icon set.
  var REMINDER_CATEGORY_LABEL = { daily: "reminders_category_daily", activity: "reminders_category_activity", care: "reminders_category_care" };
  var REMINDER_ACTION_ICON = { open_walk:"paw", open_meal:"bowl", open_training:"cap", open_rest:"moon", open_appointment:"calendar", open_cleanup:"droplet" };
  // Only these three actions map to something the app can actually do right
  // now (walk flow, feed quiz, training practice) — the rest of the catalog's
  // actions are informational-only in this phase, per the plan.
  var REMINDER_ACTIONABLE = { open_walk:true, open_meal:true, open_training:true };

  // Picks the catalog templates that apply to one breed+stage+mode, preferring
  // a breed-specific template over a shared "all" one when both would fire for
  // the same (stage, action, trigger) — the pack requires never activating a
  // generic and a specific message for the same occurrence.
  function selectReminderTemplates(breedId, stage, mode){
    var lookupStage = stage === "senior" ? "adult" : stage;
    var matches = (typeof NOTIFICATION_CATALOG !== "undefined" ? NOTIFICATION_CATALOG : []).filter(function(t){
      return (t.stage === lookupStage || t.stage === "all") && (t.breed_id === breedId || t.breed_id === "all") &&
        t.supported_modes.indexOf(mode) !== -1 && t.body_by_mode && t.body_by_mode[mode];
    });
    var byKey = {};
    matches.forEach(function(t){
      // Dedup by (action, trigger) rather than (stage, action, trigger) so a
      // stage:"all" generic template still collides correctly with a
      // stage-specific breed template covering the same occurrence.
      var key = t.action + "|" + t.trigger;
      var existing = byKey[key];
      var tIsGeneric = t.stage === "all" || t.breed_id === "all";
      var existingIsGeneric = existing && (existing.stage === "all" || existing.breed_id === "all");
      if (!existing || (existingIsGeneric && !tIsGeneric)) byKey[key] = t;
    });
    return Object.keys(byKey).map(function(k){ return byKey[k]; }).sort(function(a,b){ return b.priority - a.priority; });
  }

  // Maps a template's action to whether the underlying care need is actually
  // due right now, using the same thresholds the rest of the app already uses
  // (TRAIN_READY_THRESHOLD via trainingBlockReason, the existing energy/
  // hunger/bladder stat scale). Informational-only actions are never "due".
  function reminderDueInfo(tmpl){
    if (tmpl.action === "open_walk") return state.energy < 30 || state.bladder < 30;
    if (tmpl.action === "open_meal") return state.hunger < 30;
    if (tmpl.action === "open_training"){
      var cooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
      return cooldownLeft <= 0 && !trainingBlockReason();
    }
    return false;
  }

  // Drives the Reminders today-tile subtitle without building the full list.
  function remindersDueCount(){
    if (!state) return 0;
    var templates = selectReminderTemplates(state.breedId, stageOf(state.dogDays), "simulation");
    return templates.filter(function(t){ return REMINDER_ACTIONABLE[t.action] && reminderDueInfo(t); }).length;
  }

  // Ported near-verbatim from reference/decision.mjs's decide(). Pure
  // eligibility chain — the caller (scheduleReminderNotifications) supplies
  // every field from real app state; this file never invents a field.
  function reminderDecide(x){
    function no(reason){ return { send:false, reason:reason }; }
    if (!x.active || !x.enabled || !x.permission || !x.categoryEnabled) return no('disabled');
    if (!x.matches || !x.supportedMode) return no('mismatch');
    if (x.resolved) return no('resolved');
    if (x.alreadyDispatchedAttempt) return no('duplicate');
    if (x.now >= x.expiresAt) return no('expired');
    if (x.now < x.dueAt || x.now < (x.snoozedUntil||0)) return no('not_due');
    if (quietAt(x.now, x.timezone, x.quietStart, x.quietEnd)) return no('quiet');
    if (x.userCount >= x.userCap || x.dogCount >= x.dogCap) return no('quota');
    if (x.lastSentAt != null && x.now - x.lastSentAt < x.spacingMinutes*60000) return no('spacing');
    return { send:true, reason:'eligible' };
  }

  var REMINDER_FREQ_CAP_KEY = { gentle:"gentle", balanced:"balanced", more_frequent:"more_frequent" };
  // Local-notification scheduling, phase 1: no APNs/FCM credentials exist
  // (confirmed with the user), so this schedules genuine on-device
  // LocalNotifications on native builds, and falls back to the existing
  // in-app Notification-API poll (checkNotify's pattern) on web/PWA where
  // that plugin no-ops. Never claims remote push or cross-device delivery.
  function scheduleReminderNotifications(){
    if (!state || !state.settings.notifications) return;
    var perm = ("Notification" in window) ? Notification.permission : "unsupported";
    var LN = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null;
    if (!LN && perm !== "granted") return;

    var cats = state.settings.reminderCategories || { daily:true, activity:true, care:true };
    var quietStart = state.settings.reminderQuietStart || "22:00";
    var quietEnd = state.settings.reminderQuietEnd || "08:00";
    var freqTier = state.settings.reminderFrequency || "gentle";
    var policy = (typeof NOTIFICATION_POLICY !== "undefined") ? NOTIFICATION_POLICY : null;
    var lifeStageKey = stageOf(state.dogDays) === "senior" ? "adult" : stageOf(state.dogDays);
    var userCap = (policy && policy.max_pushes_per_user_local_day) || 8;
    var dogCap = (policy && policy.push_limits && policy.push_limits[freqTier] && policy.push_limits[freqTier][lifeStageKey]) || userCap;
    var spacingMinutes = (policy && policy.minimum_minutes_between_pushes) || 60;
    var zone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    var now = Date.now();
    var todayKey = new Date(now).toDateString();

    state.reminderDispatch = state.reminderDispatch || { day: todayKey, count: 0, lastSentAt: null, sentIds: {} };
    if (state.reminderDispatch.day !== todayKey) state.reminderDispatch = { day: todayKey, count: 0, lastSentAt: null, sentIds: {} };

    var templates = selectReminderTemplates(state.breedId, stageOf(state.dogDays), "simulation");
    var toSend = [];
    templates.forEach(function(t){
      if (!REMINDER_ACTIONABLE[t.action]) return;
      var due = reminderDueInfo(t);
      var decision = reminderDecide({
        active: true, enabled: true, permission: (perm === "granted" || !!LN), categoryEnabled: !!cats[t.category],
        matches: true, supportedMode: t.supported_modes.indexOf("simulation") !== -1,
        resolved: false, alreadyDispatchedAttempt: !!state.reminderDispatch.sentIds[t.id],
        now: now, expiresAt: now + (t.ttl_minutes||180)*60000,
        dueAt: due ? now : now + 999999999999, snoozedUntil: 0,
        timezone: zone, quietStart: quietStart, quietEnd: quietEnd,
        userCount: state.reminderDispatch.count, userCap: userCap,
        dogCount: state.reminderDispatch.count, dogCap: dogCap,
        lastSentAt: state.reminderDispatch.lastSentAt, spacingMinutes: spacingMinutes
      });
      if (decision.send) toSend.push(t);
    });
    if (!toSend.length) return;
    var t = toSend[0];
    var title = (t.title||"").replace("{dogName}", state.name);
    var body = (t.body_by_mode && t.body_by_mode.simulation) || "";
    if (LN){
      LN.schedule({ notifications: [{ id: Math.floor(Math.random()*1000000), title: title, body: body, sound: (state.settings.reminderBark ? undefined : null) }] }).catch(function(){});
    } else {
      try { new Notification(title, { body: body, tag: "reminder-" + t.id }); } catch(e){}
    }
    state.reminderDispatch.count++;
    state.reminderDispatch.lastSentAt = now;
    state.reminderDispatch.sentIds[t.id] = now;
    save();
  }

  function wellnessScore(){
    return state.hunger*0.15 + state.bladder*0.15 + state.energy*0.15 + state.bond*0.3 + state.health*0.25;
  }
  function moodOf(){
    var score = wellnessScore();
    if (score>=78) return {label:tr('mood_content',"Content"), key:"good"};
    if (score>=55) return {label:tr('mood_restless',"Restless"), key:"warn"};
    if (score>=32) return {label:tr('mood_distressed',"Distressed"), key:"bad"};
    return {label:tr('mood_struggling',"Struggling"), key:"bad"};
  }
  function wellnessRingColor(){
    var mood = moodOf();
    return mood.key === "good" ? "teal" : mood.key === "warn" ? "warn" : "bad";
  }
  // Short chip-style sublabels for the compact stat tiles — a quick qualitative
  // read, distinct from the full sentences used elsewhere (e.g. bondStatusLine).
  function fedSublabel(){
    var stage = stageOf(state.dogDays);
    var fi = FEED_INTERVAL[stage];
    var mins = Math.round(Math.max(0, state.hunger * (fi||0) / 100 * 60));
    if (mins <= 0) return tr('fed_meal_due_now',"Meal due now");
    if (mins < 60) return tr('fed_next_meal_in',"Next meal in ") + mins + "m";
    return tr('fed_next_meal_in',"Next meal in ") + fmtHours(mins/60);
  }
  function energySublabel(){
    if (state.energy >= 70) return tr('energy_high',"High");
    if (state.energy >= 40) return tr('energy_normal',"Normal");
    return tr('energy_low',"Low");
  }
  function bladderSublabel(comfort){
    if (comfort >= 70) return tr('bladder_good',"Good");
    if (comfort >= 40) return tr('bladder_ok',"OK");
    return tr('bladder_needs_break',"Needs a break");
  }
  function bondSublabel(){
    if (state.bond >= 75) return tr('bond_strong',"Strong bond");
    if (state.bond >= 55) return tr('bond_getting_closer',"Getting closer");
    if (state.bond >= 35) return tr('bond_still_adjusting',"Still adjusting");
    return tr('bond_just_met',"Just met");
  }

    return String(s).replace(/[&<>"']/g, function(c){

  // Circular status ring — a live-state summary (NOT a permanent score), used

  function circularStatus(percent, opts){
    opts = opts || {};

    var colorKey = opts.colorKey || "accent";
    var stops = COLOR_GRAD_STOPS[colorKey] || COLOR_GRAD_STOPS.accent;
    var label = opts.label || "";
    var sublabel = opts.sublabel || "";
    var pct = Math.max(0, Math.min(100, Math.round(percent)));

    var offset = c * (1 - pct / 100);
    var mid = size / 2;
    var gradId = "ringGrad" + (RING_GRAD_ID++);
    var valueStyle = "";
    if (opts.valueSize) valueStyle += "font-size:"+opts.valueSize+"px;";
    if (opts.valueWeight) valueStyle += "font-weight:"+opts.valueWeight+";";

            '<stop offset="0%" stop-color="'+stops[0]+'"/><stop offset="100%" stop-color="'+stops[1]+'"/>' +
          '</linearGradient></defs>' +
          '<circle cx="'+mid+'" cy="'+mid+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+stroke+'"/>' +
          '<circle cx="'+mid+'" cy="'+mid+'" r="'+r+'" fill="none" stroke="url(#'+gradId+')" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+mid+' '+mid+')" style="transition:stroke-dashoffset 300ms ease;"/>' +

  // Picks the single most urgent thing the dog needs right now, from real decay rates —
  // not a dashboard of every meter, just what to do next.
  function computeNextAction(){
    var stage = stageOf(state.dogDays);
    var canWalk = canWalkOutside(state.dogDays);
    var fi = FEED_INTERVAL[stage], bi = BLADDER_INTERVAL[stage];

    function etaMinutes(val, intervalHours){
      if (!intervalHours) return Infinity;
      return Math.max(0, val * intervalHours / 100 * 60);
    }

    var hungerEta = etaMinutes(state.hunger, fi);
    var bladderEta = etaMinutes(state.bladder, bi);
    var energyEta = etaMinutes(state.energy, WALK_INTERVAL_HOURS);
    var outEta = Math.min(bladderEta, energyEta);
    var outIsBladder = bladderEta <= energyEta;

    var candidates = [
      { eta: hungerEta, label:"Feeding time", cta:"Feed " + esc(state.name), actionId:"feed" },
      { eta: outEta,
        label: outIsBladder ? "Bathroom break" : (canWalk ? "Walk" : "Safe activity"),
        cta: canWalk ? "Take " + dogPronoun("object") + " out" : "See safe activities",
        actionId: canWalk ? "walk" : "play" }
    ];
    candidates.sort(function(a,b){ return a.eta - b.eta; });
    var top = candidates[0];
    var minutes = Math.round(top.eta);

    var etaText;
    if (!isFinite(minutes)) etaText = "Not urgent right now";
    else if (minutes <= 0) etaText = "Due now";
    else if (minutes < 60) etaText = "in about " + minutes + " min";
    else etaText = "in about " + fmtHours(minutes/60);

    return { label: top.label, cta: top.cta, actionId: top.actionId, etaText: etaText };
  }

        '<div>' +
          '<div class="brand-wordmark">dogtrial</div>' +
          (dayLine ? '<div class="brand-dayline">'+dayLine+'</div>' : '') +
        '</div>' +
        '<div class="brand-right">'+bell+avatar+'</div>' +
      '</div>';
  }

  function renderSplash(){
    return '' +
      '<div class="splash">' +
        '<div class="splash-portrait">' +
          '<div class="splash-portrait-ring"></div>' +
          '<div class="splash-portrait-photo"><img src="'+SPLASH_PHOTO+'" alt="DogTrial"></div>' +
        '</div>' +
        '<div class="splash-copy">' +
          '<div class="label">'+tr('splash_label','A 30-DAY TRIAL RUN')+'</div>' +
          '<h1>DogTrial</h1>' +
          '<div class="splash-tagline">'+tr('splash_tagline','Live with a simulated dog for 30 days before you adopt one.')+'</div>' +
        '</div>' +
        '<button class="splash-start-btn" id="splash-start">'+tr('splash_get_started','Get Started')+'</button>' +
      '</div>';
  }

  // Onboarding is a one-choice-per-screen wizard: each step shows exactly one
  // section, and picking a card (or confirming the name) slides straight into
  // the next one rather than scrolling a long form.
  function onboardProgressHTML(){
    var total = ONBOARD_STEPS.length;
    var dots = "";
    for (var i=0;i<total;i++){
      dots += '<span class="onboard-dot'+(i===onboardStep?' active':(i<onboardStep?' done':''))+'"></span>';
    }
    return '' +
      '<div class="onboard-top">' +
        (onboardStep>0 ? '<button class="btn-ghost" id="onboard-back">&lsaquo; '+tr('btn_back','Back')+'</button>' : '<span></span>') +
        '<div class="onboard-dots">'+dots+'</div>' +
        '<span style="width:1px;"></span>' +
      '</div>';
  }

  function renderOnboarding(){
    var step = ONBOARD_STEPS[onboardStep] || "name";

    if (step === "lang"){
      return '' +
        '<div class="card intro">' +
          '<h1>'+tr('onboard_lang_title',"Choose your language")+'</h1>' +
          '<p>'+tr('onboard_lang_body',"You can change this later in Settings.")+'</p>' +
        '</div>' +
        '<div class="card onboard-step" style="margin-top:14px">' +
          '<button type="button" class="breed-card" id="onboard-lang-en" style="text-align:left;">' +
            '<div><div class="name">English</div></div>' +
          '</button>' +
          '<button type="button" class="breed-card" id="onboard-lang-fr" style="text-align:left; margin-top:10px;">' +
            '<div><div class="name">Français</div></div>' +
          '</button>' +
        '</div>';
    }

    if (step === "auth"){
      var isSignup = authMode === "signup";
      var pwType = authShowPassword ? "text" : "password";
      return '' +
        '<div class="auth-hero">' +
          '<div class="auth-hero-copy">' +
            '<h2>'+tr('auth_hero_title','The first step,<br>together.')+'</h2>' +
          '</div>' +
          '<div class="auth-hero-photo"><img src="'+SPLASH_PHOTO+'" alt=""></div>' +
        '</div>' +
        '<div class="card onboard-step">' +
          '<span class="auth-eyebrow">'+(isSignup?tr('auth_eyebrow_signup',"THE FIRST STEP"):tr('auth_eyebrow_login',"GOOD TO HAVE YOU BACK"))+'</span>' +
          '<div class="section-title" style="font-size:20px; text-transform:none; letter-spacing:0; color:var(--ink); font-family:\'DM Serif Display\',Georgia,serif; font-weight:400;">'+(isSignup?tr('onboard_create_account',"Create your account"):tr('onboard_log_in',"Log in"))+'</div>' +
          '<p class="auth-subtitle">'+(isSignup?tr('auth_subtitle_signup',"So you can pick up where you left off."):tr('auth_subtitle_login',"Welcome back — pick up where you left off."))+'</p>' +
          '<label class="auth-label" for="auth-email">'+tr('onboard_email_label','Email')+'</label>' +
          '<div class="auth-input-row'+(authEmailError?" has-error":"")+'">' +
            icon('mail', 18) +
            '<input id="auth-email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="you@example.com" value="'+esc(authEmailValue)+'">' +
          '</div>' +
          (authEmailError ? '<p class="auth-field-error">'+esc(authEmailError)+'</p>' : "") +
          '<label class="auth-label" for="auth-password">'+tr('onboard_password_label','Password')+'</label>' +
          '<div class="auth-input-row'+(authPasswordError?" has-error":"")+'">' +
            icon('lock', 18) +
            '<input id="auth-password" type="'+pwType+'" autocomplete="'+(isSignup?"new-password":"current-password")+'" placeholder="'+tr('onboard_password_placeholder','At least 8 characters')+'" value="'+esc(authPasswordValue)+'">' +
            '<button type="button" class="auth-eye-btn" id="auth-eye" aria-label="'+(authShowPassword?tr('auth_hide_password','Hide password'):tr('auth_show_password','Show password'))+'" aria-pressed="'+(authShowPassword?"true":"false")+'">'+icon(authShowPassword?'eyeOff':'eye', 18)+'</button>' +
          '</div>' +
          (authPasswordError ? '<p class="auth-field-error">'+esc(authPasswordError)+'</p>' : '<p class="auth-field-help">'+tr('onboard_password_placeholder','At least 8 characters')+'</p>') +
          (authError ? '<p class="auth-banner-error">'+esc(authError)+'</p>' : "") +
          '<button class="btn btn-primary" id="auth-submit" style="margin-top:16px; width:100%;" '+(authBusy?"disabled":"")+'>'+(authBusy?tr('onboard_please_wait',"Please wait…"):(isSignup?tr('onboard_create_account_btn',"Create account"):tr('onboard_log_in',"Log in")))+'</button>' +
          '<button class="btn-ghost" id="auth-toggle" style="margin-top:8px; width:100%;">'+(isSignup?tr('onboard_already_have_account',"Already have an account? Log in"):tr('onboard_new_here',"New here? Create an account"))+'</button>' +
          (isSignup ? '<p class="auth-legal">'+esc(tr('auth_legal_prefix','By creating your account, you agree to our '))+'<a href="https://dogtrial.dog/privacy" target="_blank" rel="noopener">'+esc(tr('auth_legal_privacy_link','Privacy Policy'))+'</a>.</p>' : "") +
          '<div class="auth-free-badge">✦ &nbsp;'+tr('auth_free_badge',"Free while we're in early access · No card required")+'</div>' +
        '</div>';
    }

    if (step === "name"){
      var archive = loadArchive();
      var archiveCard = archive.length === 0 ? "" :
        '<div class="card" style="margin-top:14px">' +
          '<div class="section-title">'+tr('onboard_past_trials','Past trials')+'</div>' +
          archive.slice(0,5).map(function(a){
            return '<div class="j-entry"><div class="j-time" style="width:auto; margin-right:10px;">'+esc(a.tripDaysReached)+'d</div>' +
              '<div class="j-text">'+esc(a.name)+' — '+esc(a.breedName)+', '+esc(a.housingLabel)+' <span class="muted">('+esc(a.outcome)+')</span></div></div>';
          }).join("") +
        '</div>';
      var NAME_SUGGESTIONS = ["Milo","Luna","Biscuit","Nala"];
      var nameChips = NAME_SUGGESTIONS.map(function(n){
        return '<button type="button" class="btn-chip'+(pendingName===n?' active':'')+'" data-name-suggest="'+esc(n)+'">'+esc(n)+'</button>';
      }).join("");
      return '' +
        onboardProgressHTML() +
        '<div class="name-hero">' +
          '<img src="media/onboarding/name-walk.jpg" alt="">' +
          '<div class="name-hero-tag" id="name-tag">'+(esc(pendingName) || "?")+'</div>' +
        '</div>' +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_name_eyebrow',"YOUR STORY STARTS HERE")+'</div>' +
          '<h1 style="margin-top:6px; font-size:27px;">'+tr('onboard_name_title','A small name.<br>A big beginning.')+'</h1>' +
          '<p class="muted" style="margin-top:6px; font-size:14px;">'+tr('onboard_name_subtitle',"What will your companion be called for these 30 days?")+'</p>' +
          '<div class="field" style="margin-top:18px;">' +
            '<label for="dogname">'+tr('onboard_name_label','Name the dog')+'</label>' +
            '<div class="name-input-wrap">' +
              '<input id="dogname" type="text" maxlength="20" placeholder="'+tr('onboard_name_placeholder','e.g. Biscuit')+'" value="'+esc(pendingName)+'" style="padding-right:44px;">' +
              '<span class="heart-icon">'+icon('heart',18)+'</span>' +
            '</div>' +
          '</div>' +
          '<div class="name-hint-row"><span>'+tr('onboard_name_hint',"You can change this later.")+'</span><span id="name-count">'+pendingName.length+' / 20</span></div>' +
          '<div class="name-suggest-label">'+tr('onboard_name_suggest_label',"A little inspiration")+'</div>' +
          '<div class="name-chip-row">'+nameChips+'</div>' +
          '<button class="btn btn-primary" id="onboard-next-name" style="margin-top:20px;" '+(pendingName.trim()?"":"disabled")+'>'+tr('btn_continue','Continue')+' →</button>' +
        '</div>' +
        archiveCard;
    }

    if (step === "breed"){
      if (breedInfoId){
        var ib = byId(breedInfoId);
        var infoSel = ib.id === pendingBreed;
        return onboardProgressHTML() +
          '<div class="card onboard-step">' +
            '<button class="btn-ghost" id="breed-info-back" style="margin-bottom:4px;">'+tr('btn_back_to_list','← Back to the list')+'</button>' +
            '<img src="media/moments/sniffing/'+ib.id+'_puppy.jpg" alt="" style="width:100%; aspect-ratio:1.4; object-fit:cover; border-radius:16px; margin-top:8px;">' +
            '<div style="margin-top:12px;">' +
              '<div class="name" style="font-size:19px;">'+esc(ib.name)+'</div>' +
              '<div class="catch">'+esc(ib.catch)+'</div>' +
            '</div>' +
            '<div class="cost-row" style="margin-top:16px;"><span>'+tr('trait_energy','Energy')+'</span><b>'+ib.energy+'/10</b></div>' +
            '<div class="cost-row"><span>'+tr('trait_trainability','Trainability')+'</span><b>'+ib.trainability+'/10</b></div>' +
            '<div class="cost-row"><span>'+tr('trait_alone_adult','Alone (adult)')+'</span><b>'+ib.tolerance+'h</b></div>' +
            '<div class="cost-row"><span>'+tr('trait_walk','Walk')+'</span><b>'+ib.walkMinutes+'min ×2/day</b></div>' +
            '<div class="cost-row"><span>'+tr('breed_info_weight','Adult weight')+'</span><b>~'+ib.weightKg+' kg</b></div>' +
            '<p class="muted" style="margin-top:12px; font-size:12.5px;">'+tr('breed_info_disclaimer',"These are the same simulation parameters used in the trial — a starting point for research, not a prescription for a real dog.")+'</p>' +
            '<button class="btn btn-primary" data-breed="'+ib.id+'" style="margin-top:16px;">'+(infoSel?tr('breed_info_selected','Selected'):tr('breed_info_choose','Choose this breed'))+'</button>' +
          '</div>';
      }
      var q = breedQuery.trim().toLowerCase();
      var filtered = BREEDS.filter(function(b){
        var matchesQuery = !q || b.name.toLowerCase().indexOf(q) !== -1;
        var matchesSize = breedSizeFilter === "all" || BREED_SIZE[b.id] === breedSizeFilter;
        return matchesQuery && matchesSize;
      });
      var SIZE_FILTERS = [
        { id:"all", label:tr('breed_filter_all','All') },
        { id:"small", label:tr('breed_filter_small','Small') },
        { id:"medium", label:tr('breed_filter_medium','Medium') },
        { id:"large", label:tr('breed_filter_large','Large') }
      ];
      var filterPills = SIZE_FILTERS.map(function(f){
        return '<button class="breed-filter-pill'+(breedSizeFilter===f.id?' active':'')+'" data-breed-filter="'+f.id+'">'+esc(f.label)+'</button>';
      }).join("");
      var SIZE_LABEL_BY_ID = {};
      SIZE_FILTERS.forEach(function(f){ SIZE_LABEL_BY_ID[f.id] = f.label; });
      var cards = filtered.map(function(b){
        var sel = b.id === pendingBreed;
        return '<div class="breed-card-wrap">' +
          '<button class="breed-photo-card'+(sel?' selected':'')+'" data-breed="'+b.id+'">' +
            '<img class="breed-photo" src="media/moments/sniffing/'+b.id+'_puppy.jpg" alt="">' +
            '<div class="name">'+esc(b.name)+'</div>' +
            '<span class="size-tag">'+esc(SIZE_LABEL_BY_ID[BREED_SIZE[b.id]] || "")+'</span>' +
          '</button>' +
          (sel ? '<span class="breed-photo-tick" aria-hidden="true">'+icon('check',13)+'</span>' : '') +
          '<button class="breed-info-btn" data-breed-info="'+b.id+'" aria-label="'+esc(tr('breed_info_aria','Information about {name}').replace('{name}', b.name))+'">'+icon('info',15)+'</button>' +
        '</div>';
      }).join("");
      return onboardProgressHTML() +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_choose_breed','Choose a breed')+'</div>' +
          '<div class="breed-search-row">' +
            icon('search',16) +
            '<input id="breed-search" type="text" placeholder="'+tr('breed_search_placeholder','Search a breed')+'" value="'+esc(breedQuery)+'" autocomplete="off">' +
          '</div>' +
          '<div class="breed-filter-row">'+filterPills+'</div>' +
          '<div class="breed-photo-grid">'+(cards || '<div class="breed-empty">'+tr('breed_empty','No breed matches.')+'</div>')+'</div>' +
        '</div>';
    }

    if (step === "age"){
      var stageCards = START_STAGES.map(function(s){
        var sel = s.id === pendingStartStage;
        return '<button class="breed-card'+(sel?' selected':'')+'" data-start-stage="'+s.id+'">' +
          '<div><div class="name">'+esc(s.label)+'</div>' +
          '<div class="catch">'+esc(s.note)+'</div></div>' +
          '</button>';
      }).join("");
      return onboardProgressHTML() +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_age_question','How old is the dog?')+'</div>' +
          '<div class="breed-grid">'+stageCards+'</div>' +
        '</div>';
    }

    if (step === "sex"){
      var sexCards = [
        { id:"female", label:tr('sex_female',"Female"), note:"Heat cycles roughly twice a year; spaying is a common consideration." },
        { id:"male", label:tr('sex_male',"Male"), note:"Roaming, marking, and mounting can increase with maturity; neutering is a common consideration." }
      ].map(function(s){
        var sel = s.id === pendingSex;
        return '<button class="breed-card'+(sel?' selected':'')+'" data-sex="'+s.id+'">' +
          '<div><div class="name">'+esc(s.label)+'</div>' +
          '<div class="catch">'+esc(s.note)+'</div></div>' +
          '</button>';
      }).join("");
      return onboardProgressHTML() +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_sex_title','Sex')+'</div>' +
          '<div class="breed-grid">'+sexCards+'</div>' +
        '</div>';
    }

    if (step === "housing"){
      var housingCards = selectableHousing().map(function(h){
        var sel = h.id === pendingHousing;
        return '<button class="breed-card'+(sel?' selected':'')+'" data-housing="'+h.id+'">' +
          '<div class="pup-thumb"><img src="media/housing/'+housingCardPhoto(h.id)+'" alt=""></div>' +
          '<div><div class="name">'+esc(h.label)+'</div>' +
          '<div class="catch">'+esc(h.note)+'</div>' +
          '<div class="house-risk"><span class="house-risk-tag">'+tr('house_risk_tag','Main risk')+'</span>'+esc(h.risk)+'</div></div>' +
          '</button>';
      }).join("");
      return onboardProgressHTML() +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_housing_title','Where the dog will live')+'</div>' +
          '<div class="breed-grid">'+housingCards+'</div>' +
        '</div>';
    }

    if (step === "life"){
      var lifeCards = LIFE_OPTIONS.map(function(l){
        var sel = l.id === pendingLife;
        return '<button class="breed-card'+(sel?' selected':'')+'" data-life="'+l.id+'">' +
          '<div><div class="name">'+esc(l.label)+'</div>' +
          '<div class="catch">'+esc(l.note)+'</div></div>' +
          '</button>';
      }).join("");
      return onboardProgressHTML() +
        '<div class="card onboard-step">' +
          '<div class="section-title">'+tr('onboard_life_title','What your typical day looks like')+'</div>' +
          '<div class="breed-grid">'+lifeCards+'</div>' +
        '</div>';
    }

    // summary
    var selectedBreed = byId(pendingBreed);
    var selectedHousing = housingById(pendingHousing);
    var selectedLife = lifeById(pendingLife);
    var selectedStage = START_STAGES.filter(function(s){ return s.id === pendingStartStage; })[0] || START_STAGES[0];
    var fitStage = stageOf(selectedStage.startDogDays);
    var fitMessage = lifeFitMessage(selectedBreed, selectedHousing, fitStage, selectedLife.hoursAway);
    return onboardProgressHTML() +
      '<div class="card onboard-step">' +
        '<div class="section-title">'+tr('onboard_summary_title','Dog × Home × Life')+'</div>' +
        '<div class="cost-row"><span>'+tr('summary_the_dog','The dog')+'</span><b>'+esc(selectedBreed.name)+'</b></div>' +
        '<div class="cost-row"><span>'+tr('summary_the_home','The home')+'</span><b>'+esc(selectedHousing.label)+'</b></div>' +
        '<div class="cost-row"><span>'+tr('summary_the_life','The life')+'</span><b>'+esc(selectedLife.label)+'</b></div>' +
        '<p class="muted" style="margin-top:10px; font-size:13px;">'+esc(fitMessage)+'</p>' +
      '</div>' +
      '<div class="card" style="margin-top:14px">' +
        '<button class="btn btn-primary" id="start-btn">'+tr('btn_start_trial','Start the trial')+'</button>' +
      '</div>';
  }

  // Reduced from 7 tabs to 4, grouping what belongs together instead of
  // spreading it across separate taps: Today absorbs Walks + Costs (the
  // day's actions and their running cost), Training becomes "Learn", Report
  // becomes "Journey", and Health + Life merge into one dog-profile tab
  // labeled with the dog's own name. The individual renderTab*() functions
  // for the merged sections are unchanged and reused as-is inside the new
  // composite tabs — see renderTabToday()/renderTabProfile() below.
  var TABS = [
    {id:"today", labelKey:"tab_today", label:"Today", icon:"home"},
    {id:"training", labelKey:"tab_training_learn", label:"Learn", icon:"cap"},
    {id:"report", labelKey:"tab_report_journey", label:"Journey", icon:"compass"},
    {id:"profile", labelKey:"tab_profile", label:"Dog", icon:"paw", dynamicLabel:true}
  ];

  function renderTabBar(){
    var btns = TABS.map(function(tabDef){
      var label = tabDef.dynamicLabel ? esc(state.name) : tr(tabDef.labelKey, tabDef.label);
      return '<button class="tab-btn'+(activeTab===tabDef.id?" active":"")+'" data-tab="'+tabDef.id+'">' +
        '<span class="tab-icon">'+icon(tabDef.icon)+'</span><span>'+label+'</span></button>';
    }).join("");
    return '<div class="tab-bar"><div class="tab-bar-inner">'+btns+'</div></div>';
  }

  // Lean by design: this is the "Now" card only when feeding is the day's most
  // urgent thing (see renderTabToday) — one number, one line of context, one tip,
  // one button. The fuller ration breakdown lives in the Costs tab instead of here.
  function renderFeedCard(){
    var breed = byId(state.breedId);
    var stage = stageOf(state.dogDays);
    var mealName = mealNameForHour(new Date().getHours());
    var feedsPerDay = feedsPerDayFor(stage);
    var perMeal = Math.round(dailyFoodGrams(breed)/feedsPerDay/5)*5;
    var fed = state.hunger >= 90;
    if (fed){
      var nextAt = new Date(Date.now() + FEED_INTERVAL[stage]*HOUR);
      return '' +
        '<div class="card">' +
          '<div class="section-title">Now</div>' +
          '<div class="next-label" style="font-size:19px;">✓ '+mealName+' completed</div>' +
          '<p class="muted" style="margin-top:2px;">Next meal around '+pad2(nextAt.getHours())+':'+pad2(nextAt.getMinutes())+'.</p>' +
        '</div>';
    }
    return '' +
      '<div class="card">' +
        '<div class="section-title">Now · '+mealName+'</div>' +
        '<div class="next-label" style="font-size:28px;">'+perMeal+' g</div>' +
        '<p class="muted" style="margin-top:4px; font-size:13px;">'+esc(state.name)+' is '+breed.weightKg+' kg and currently eats '+feedsPerDay+' meal'+(feedsPerDay>1?'s':'')+' a day.</p>' +
        '<p class="muted" style="margin-top:8px; font-size:13px; display:flex; gap:6px;"><span style="color:var(--warn); flex:none;">'+icon('bulb',13)+'</span><span>'+feedingTipForDay(breed, tripDay())+'</span></p>' +
        '<button class="btn btn-primary" id="feed-btn" style="margin-top:14px;">Feed '+esc(state.name)+'</button>' +
      '</div>';
  }

  function isLateNightHour(h){
    return h >= 22 || h < 6;
  }
  // Plain, dismiss-free welcome card for the day's first session — not a
  // notification, not an incident, never saved to the notification center.
  // Visible for a short window after tickHome first marks the day as begun,
  // then it naturally stops appearing on its own (no ack needed).
  function sniffingWelcomeCard(){
    if (!state.sniffingCardShownAt || (Date.now() - state.sniffingCardShownAt) > 20*60000) return "";
    var photo = sniffingPhotoFor();
    return '' +
      '<div class="card" style="padding:0; overflow:hidden;">' +
        (photo ? '<img src="'+photo+'" alt="" style="width:100%; height:130px; object-fit:cover; display:block;">' : '') +
        '<div style="padding:16px;">' +
          '<div class="section-title">'+tr('sniff_caption_label',"Sniffing around the house")+'</div>' +
          '<p class="muted" style="margin-top:4px; font-size:13px;">'+tr('sniff_caption_text',"Dogs check in on their environment most days — new smells, sounds, and small changes since last time.")+'</p>' +
        '</div>' +
      '</div>';
  }

  // Persistent Today hero: normally the generic walk photo, but slides over
  // to the dog's real breed+stage sniffing photo (with a caption) for 10s
  // once a day when tickHome marks a new sniffing moment, then slides back —
  // same trigger/timestamp sniffingWelcomeCard() uses for its own 20-minute
  // window on the "Discover their world" detail screen.
  var sniffHeroTimer = null;
  function ensureSniffHeroTimer(){
    if (sniffHeroTimer || !state || !state.sniffingCardShownAt) return;
    var remaining = 10000 - (Date.now() - state.sniffingCardShownAt);
    if (remaining <= 0) return;
    sniffHeroTimer = setTimeout(function(){
      sniffHeroTimer = null;
      if (view === "home") render();
    }, remaining);
  }
  function todayHeroHTML(){
    var sniffActive = !!(state.sniffingCardShownAt && (Date.now() - state.sniffingCardShownAt) <= 10000);
    if (sniffActive) ensureSniffHeroTimer();
    var sniffPhoto = sniffingPhotoFor();
    return '' +
      '<div class="today-hero'+(sniffActive ? ' sniff-active' : '')+'">' +
        '<img class="today-hero-layer today-hero-default" src="media/onboarding/name-walk.jpg" alt="">' +
        (sniffPhoto ? '<img class="today-hero-layer today-hero-sniff" src="'+sniffPhoto+'" alt="">' : '') +
        '<div class="today-hero-caption">' +
          '<div class="today-hero-caption-label">'+tr('sniff_caption_label',"Sniffing around the house")+'</div>' +
          '<div class="today-hero-caption-text">'+tr('sniff_caption_text',"Dogs check in on their environment most days — new smells, sounds, and small changes since last time.")+'</div>' +
        '</div>' +
      '</div>';
  }

  function renderTabToday(){
    var stage = stageOf(state.dogDays);
    var next = computeNextAction();
    var todayEntries = todaysJournalEntries();

    var now = new Date();
    var showLateBathroomChoice = next.actionId === "walk" && next.label === "Bathroom break" &&
      next.etaText === "Due now" && isLateNightHour(now.getHours());

    // Plain "Now" card restyled as an icon-tile+pill row (icon/color by action
    // type, pill reflecting real urgency) with its original CTA button kept
    // underneath — the feed-quiz and late-night micro-choice variants below are
    // left exactly as they were; they're bespoke interactive flows, not a
    // simple status row.
    var NOW_ROW_ICON = { feed:"bowl", walk:"paw", play:"paw" };
    var NOW_ROW_COLOR = { feed:"accent", walk:"teal", play:"teal" };
    var nowDueNow = next.etaText === "Due now";
    var plainNowCard = '' +
      '<div class="card">' +
        '<div class="row-card" style="padding:0;">' +
          iconTileHTML(NOW_ROW_ICON[next.actionId]||'paw', NOW_ROW_COLOR[next.actionId]||'accent') +
          '<div style="flex-grow:1; min-width:0;">' +
            '<div style="font-size:14px; font-weight:600;">'+esc(next.label)+'</div>' +
            '<div style="font-size:12px; color:var(--ink-faint); margin-top:2px;">'+esc(next.etaText)+'</div>' +
          '</div>' +
          pillHTML(nowDueNow ? tr('pill_due_now','Due now') : tr('pill_todo','To do'), nowDueNow ? "bad" : "accent") +
        '</div>' +
        '<button class="btn btn-primary" id="next-action-btn" data-action="'+next.actionId+'" style="margin-top:14px">'+esc(next.cta)+'</button>' +
      '</div>';

    var nowCard = next.actionId === "feed" ? renderFeedCard() :
      showLateBathroomChoice ? '' +
        '<div class="card">' +
          '<div class="section-title">'+tr('section_now','Now')+' · '+pad2(now.getHours())+':'+pad2(now.getMinutes())+'</div>' +
          '<div class="next-label" style="font-size:19px;">'+esc(state.name)+tr('late_night_suffix'," needs to go out — it's the middle of the night.")+'</div>' +
          '<p class="muted" style="margin-top:8px; font-size:13px;">'+tr('late_night_body','Take them out now, or risk an accident by morning.')+'</p>' +
          '<button class="btn btn-primary" id="microchoice-go" style="margin-top:14px;">'+tr('btn_go_out_15','Go out (15 min)')+'</button>' +
          '<button class="btn btn-ghost" id="microchoice-ignore" style="margin-top:8px; border:1px solid var(--line); width:100%;">'+tr('btn_ignore_for_now','Ignore for now')+'</button>' +
        '</div>' :
      plainNowCard;

    // Real per-tile data for the grid below — no fabricated stats, every
    // number is the same one the old inline Walks/Costs/Journal sections
    // and the "Today's tasks" rows already computed.
    var trainCooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
    var trainDone = trainCooldownLeft > 0;
    var breedForTiles = byId(state.breedId);
    var realDaysElapsedForTiles = (Date.now() - state.startedAt) / (24*HOUR);
    var minutesToday = todayWalkMinutes();
    var costRunning = costSoFar(breedForTiles, realDaysElapsedForTiles);

    var todayGrid = '<div class="today-grid">' +
      todayTileHTML('cap', 'tan', tr('tab_training','Training'),
        trainDone ? tr('today_tile_train_done','Session done') : tr('today_tile_train_available','1 session available'),

  // 7-day rolling wellness history rendered as a small bar chart — muted teal bars,
  // today's bar picked out in accent-bright, day-of-week single-letter labels below.
  function wellnessHistoryBarsHTML(){
    var history = (state.wellnessHistory || []).slice(-7);
    if (!history.length){
      return '<p class="muted" style="font-size:12.5px; margin-top:10px;">History will build up over the next few days.</p>';
    }
    var today = tripDay();
    var maxH = 64;
    var bars = history.map(function(h){
      var pct = Math.max(4, Math.min(100, Math.round(h.score)));
      var barH = Math.round(pct/100*maxH);
      var isToday = h.day === today;
      var weekday = new Date(h.ts || Date.now()).toLocaleDateString(appLocale(), { weekday:"narrow" }).toUpperCase();
      return '' +
        '<div style="display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0;">' +
          '<div style="width:100%; max-width:22px; height:'+maxH+'px; display:flex; align-items:flex-end;">' +
            '<div style="width:100%; height:'+barH+'px; border-radius:6px; background:'+(isToday?"var(--accent-bright)":"var(--teal)")+'; opacity:'+(isToday?1:0.55)+'; transition:height .4s ease;"></div>' +
          '</div>' +
          '<div style="font-size:10px; font-weight:700; color:'+(isToday?"var(--ink)":"var(--ink-faint)")+';">'+weekday+'</div>' +
        '</div>';
    }).join("");
    return '<div style="display:flex; align-items:flex-end; gap:6px; margin-top:14px;">'+bars+'</div>';
  }
  // Line-chart version of the same real state.wellnessHistory data (last 7
  // entries, appended once/day) — used by the Report tab's "Wellness over
  // time" card. Handles 0/1/partial-week history the same way the bar-chart
  // version above does, instead of fabricating a fuller trend.
  function wellnessTrendSVGHTML(){
    var history = (state.wellnessHistory || []).slice(-7);
    if (!history.length){
      return '<p class="muted" style="font-size:12.5px;">'+tr('report_wellness_history_empty','History will build up over the next few days.')+'</p>';
    }
    var w = 320, h = 120, padX = 6, padY = 14;
    var startLabel, endLabel = tr('life_today','Today');
    if (history.length === 1){
      var only = history[0];
      var cy = padY + (1 - Math.max(0,Math.min(100,only.score))/100) * (h - padY*2);
      startLabel = new Date(only.ts || Date.now()).toLocaleDateString(appLocale(), { month:"short", day:"numeric" });
      return '' +
        '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
          '<circle cx="'+(w/2)+'" cy="'+Math.round(cy)+'" r="4" fill="var(--accent-bright)"/>' +
        '</svg>' +
        '<div style="display:flex; justify-content:center; font-size:11px; color:var(--ink-faint); margin-top:4px;"><span>'+startLabel+'</span></div>';
    }
    var stepX = (w - padX*2) / (history.length - 1);
    var points = history.map(function(hpt, i){
      var pct = Math.max(0, Math.min(100, Math.round(hpt.score)));
      var x = padX + i*stepX;
      var y = padY + (1 - pct/100) * (h - padY*2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var last = points[points.length-1].split(",");
    startLabel = new Date(history[0].ts || Date.now()).toLocaleDateString(appLocale(), { month:"short", day:"numeric" });
    var today = tripDay();
    var lastIsToday = history[history.length-1].day === today;
    return '' +
      '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
        '<polyline points="'+points.join(" ")+'" fill="none" stroke="var(--accent-bright)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="var(--accent-bright)"/>' +
      '</svg>' +
      '<div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin-top:4px;">' +
        '<span>'+startLabel+'</span><span>'+(lastIsToday ? endLabel : new Date(history[history.length-1].ts || Date.now()).toLocaleDateString(appLocale(), { month:"short", day:"numeric" }))+'</span>' +
      '</div>';
  }

  function trainingMediaHTML(skill){
    if (skill.media) {
      return '<video class="gif-slot" src="'+skill.media+'" autoplay loop muted playsinline></video>';

  // A dog that's uncomfortable or keyed up doesn't actually learn — training is gated on
  // the same "green" bar used on the Health tab, not just a cooldown timer.
  var TRAIN_READY_THRESHOLD = 30;
  function trainingBlockReason(){
    if (state.bladder < TRAIN_READY_THRESHOLD) return "needs a bathroom break first";
    if (state.energy < TRAIN_READY_THRESHOLD) return "is too keyed up to focus right now";
    return null;
  }
  function renderTabTraining(){
    var cooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
    var trainNote = cooldownLeft > 0 ? '<div class="muted mono" style="margin-top:12px; font-size:12px;">Next session available in '+fmtClock(cooldownLeft)+'</div>' : "";
    var blockReason = trainingBlockReason();

    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var programDay = Math.max(1, Math.min(30, tripDay()+1));
    var skillId = skillForDay(programDay);
    var skill = trainingSkillById(skillId);
    var isNewToday = TRAINING_SCHEDULE.some(function(s){ return s.day === programDay && s.skill === skillId; });

    var unlocked = unlockedSkillIds(programDay);
    // A skill counts as "Done" once it's been trained past this mastery
    // threshold — same idea as statTone()'s 60%, pitched a bit higher since
    // this reads as "learned" rather than just "comfortable".
    var LESSON_DONE_THRESHOLD = 70;
    var doneCount = TRAINING_SKILLS.filter(function(s){ return (state.training[s.id]||0) >= LESSON_DONE_THRESHOLD; }).length;
    var totalLessons = TRAINING_SKILLS.length;
    var progressPct = Math.round(doneCount/totalLessons*100);
    var progressCard = '' +
      '<div class="card">' +
        '<div class="top-actions" style="margin-bottom:0;"><div class="section-title" style="margin-bottom:0;">'+tr('training_progress_title','Progress')+'</div><span style="font-size:13px; font-weight:700; color:var(--accent-bright);">'+tr('training_progress_count','{done} / {total} lessons').replace('{done}',doneCount).replace('{total}',totalLessons)+'</span></div>' +
        '<div class="meter-track" style="margin-top:10px;"><div class="meter-fill" style="width:'+progressPct+'%; background:var(--grad-accent);"></div></div>' +
      '</div>';
    var startArea = blockReason ?
      '<p class="muted" style="margin-top:12px; font-size:13px; display:flex; gap:6px;"><span style="color:var(--bad); flex:none;">'+icon('x',13)+'</span><span>'+esc(state.name)+' '+blockReason+' — training won\'t stick until that\'s handled.</span></p>' +
      '<button class="btn btn-primary" id="train-blocked-gohome" style="margin-top:10px;">'+tr('btn_take_care_first','Take care of it first')+'</button>' :
      '<button class="btn btn-primary" data-train="'+skillId+'" style="margin-top:12px;">'+tr('btn_start_session','Start session')+'</button>' +
      trainNote;

    var sessionMins = skill.sessionMinutes || 3;
    // The full 15-skill roadmap, in schedule order — locked (not-yet-reached)
    // skills stay visible but dimmed and non-tappable, unlike the reference
    // prototype's fully-open demo library.
    var allSkillRows = TRAINING_SCHEDULE.map(function(sc){ return sc.skill; }).map(function(id, idx){
      var s = trainingSkillById(id);
      var pct = Math.round(state.training[id]||0);
      var isUnlocked = unlocked.indexOf(id) !== -1;
      var isToday = id === skillId;
      var done = pct >= LESSON_DONE_THRESHOLD;
      var subtitle = (s.media ? tr('training_video_practice_quiz','Video + practice + quiz') : tr('training_practice_quiz','Practice + quiz')) + ' · ' + (idx+1) + '/' + TRAINING_SCHEDULE.length;
      return rowCardHTML({
        icon: isUnlocked ? s.icon : "lock", color: done ? "teal" : (isToday ? "accent" : "warn"),
        title: esc(s.label), subtitle: subtitle,
        pillText: done ? tr('pill_done','Done') : (isToday ? tr('training_today','Today') : (isUnlocked ? tr('pill_in_progress','In progress') : '')),
        pillColor: done ? "teal" : "accent",
        dim: !isUnlocked,
        attrs: (isUnlocked && !blockReason) ? 'data-train="'+id+'"' : ''
      });
    }).join("");
    return '' +
      progressCard +
      '<div class="card">' +
        '<div class="section-title">'+tr('report_day_of_30','Day {day} of 30').replace('{day}', programDay)+' · '+(isNewToday ? tr('training_new_skill','New skill') : tr('training_practice','Practice'))+'</div>' +
        '<div class="training-video-wrap" style="margin-top:10px;">' +
          trainingMediaHTML(skill) +
          '<div class="training-caption">' +
            '<span>' +
              '<div class="training-caption-label">'+tr('training_todays_skill',"Today's skill")+'</div>' +
              '<div class="training-caption-title">'+esc(skill.label)+'</div>' +
              '<div class="training-caption-sub">'+sessionMins+' min session</div>' +
            '</span>' +
            '<span class="training-caption-chevron" style="font-size:18px; font-weight:700;">&rsaquo;</span>' +
          '</div>' +
        '</div>' +
        '<p class="muted" style="margin-top:12px;">'+skill.whatToDo+'</p>' +
        (BREED_TRAINING_NOTE[breed.id] ? '<p class="muted" style="margin-top:8px; font-size:13px;">'+icon('paw',13)+' '+BREED_TRAINING_NOTE[breed.id]+'</p>' : "") +
        (AGE_TRAINING_NOTE[stage] ? '<p class="muted" style="margin-top:6px; font-size:13px;">'+AGE_TRAINING_NOTE[stage]+'</p>' : "") +
        startArea +
      '</div>' +
      '<div class="section-title" style="margin:18px 2px 10px;">'+tr('training_all_lessons','All lessons')+'</div>' +
      allSkillRows;
  }

  function monthlyExtrasTotal(){

  function renderTabCosts(breed, realDaysElapsed){

    return '' +
      '<div class="card">' +
        '<div class="top-actions" style="margin-bottom:2px; align-items:center;">' +

          '</span>' +
          '<span class="training-caption-chevron" style="color:var(--ink-faint);">&rsaquo;</span>' +

        '<div class="cost-row" style="margin-top:10px;"><span>'+tr('costs_food_so_far','Food so far')+'</span><b>€'+foodSoFar+'</b></div>' +

  // Reminders screen: categorized care-need cards for the current breed/
  // stage, sourced from the imported catalog (www/notifications-catalog.js).

  // due card does (it navigates to the existing walk/feed/training flow,
  // same as the Today tiles), per the conception pack's own requirement.
  function renderReminders(){
    var mode = "simulation";
    var stage = stageOf(state.dogDays);
    var templates = selectReminderTemplates(state.breedId, stage, mode);
    var programDay = Math.max(1, Math.min(30, tripDay()+1));
    var unlocked = unlockedSkillIds(programDay);
    var CATS = ["daily","activity","care"];
    var anyRows = false;
    var sectionsHTML = CATS.map(function(cat){
      var rows = templates.filter(function(t){ return t.category === cat; }).map(function(t){
        var due = reminderDueInfo(t);
        var body = (t.body_by_mode && t.body_by_mode[mode]) || "";
        var title = (t.title||"").replace("{dogName}", esc(state.name));
        var actionable = REMINDER_ACTIONABLE[t.action];
        var attrs = "";
        if (actionable && due){
          if (t.action === "open_training" && unlocked.length && !trainingBlockReason()){
            attrs = 'data-train="'+unlocked[unlocked.length-1]+'"';
          } else if (t.action !== "open_training"){
            attrs = 'data-remind-action="'+t.action+'"';
          }
        }
        return rowCardHTML({
          icon: REMINDER_ACTION_ICON[t.action] || "bell",
          color: due ? "warn" : "teal",
          title: esc(title),
          subtitle: esc(body),
          pillText: due ? tr('reminders_due_now','Due now') : tr('reminders_on_track','On track'),
          attrs: attrs
        });
      }).join("");
      if (!rows) return "";
      anyRows = true;
      return '<div class="section-title" style="margin:18px 2px 10px;">'+tr(REMINDER_CATEGORY_LABEL[cat])+'</div>' + rows;
    }).join("");

    var recentHTML = (state.journal||[]).filter(function(j){
      return tripDayOf(j.ts) === tripDay();
    }).slice(0,4).map(function(j){

    return '' +
      '<button class="btn-ghost" id="back-home">'+tr('btn_back','Back')+'</button>' +

      (recentHTML ? '<div class="card" style="margin-top:14px;"><div class="section-title">'+tr('reminders_today_so_far','Today so far')+'</div>'+recentHTML+'</div>' : '');

  var REMINDER_FREQ_OPTIONS = ["gentle","balanced","more_frequent"];
  // Preferences sub-screen off Settings: categories, quiet hours, frequency,
  // bark opt-in (off by default), and device permission status. Persists to
  // state.settings for simulation mode — matches how every other setting
  // already persists (renderSettingsCard, same pattern).
  function renderReminderPreferences(){
    var s = state.settings;
    var cats = s.reminderCategories || { daily:true, activity:true, care:true };
    var quietStart = s.reminderQuietStart || "22:00";
    var quietEnd = s.reminderQuietEnd || "08:00";
    var freq = s.reminderFrequency || "gentle";
    var bark = !!s.reminderBark;
    var permission = ("Notification" in window) ? Notification.permission : "unsupported";

    var catRows = ["daily","activity","care"].map(function(cat){
      return '<div class="setting-row">' +
        '<div class="setting-copy"><div class="title">'+tr(REMINDER_CATEGORY_LABEL[cat])+'</div></div>' +
        '<input class="switch" type="checkbox" data-remind-cat="'+cat+'" '+(cats[cat] ? "checked" : "")+'>' +
      '</div>';
    }).join("");

    var freqLabels = { gentle: tr('reminders_freq_gentle','Gentle'), balanced: tr('reminders_freq_balanced','Balanced'), more_frequent: tr('reminders_freq_more','More frequent') };
    var freqRows = REMINDER_FREQ_OPTIONS.map(function(f){
      return '<button type="button" class="btn-chip'+(freq===f?' active':'')+'" data-remind-freq="'+f+'" style="margin-right:6px; margin-bottom:6px;">'+freqLabels[f]+'</button>';
    }).join("");

    var permissionLine = permission === "granted" ? tr('reminders_permission_granted','Notifications are allowed on this device.')
      : permission === "denied" ? tr('reminders_permission_denied','Notifications are blocked in your device settings.')
      : tr('reminders_permission_unset','Not yet requested.');

  function journalEntriesForDay(dayNum){
    return state.journal.filter(function(j){ return tripDayOf(j.ts)+1 === dayNum; });
  }
  function dayPickerHTML(selectedDay){
    var lo = Math.max(1, Math.min(26, selectedDay-2));

    for (var i=0;i<5;i++){ var dd = lo+i; if (dd<=30) days.push(dd); }
    return '<div class="row-btns" style="grid-template-columns:repeat('+days.length+',1fr); gap:6px;">' +

        return '<button class="btn'+(dd===selectedDay?' btn-primary':'')+'" style="padding:10px 4px; font-size:13px; min-height:40px;" data-report-day="'+dd+'">'+dd+'</button>';
      }).join('') +
      '</div>';

  function journeyDayDetailHTML(selectedDay, currentDay){

    if (selectedDay < currentDay){
      var entries = journalEntriesForDay(selectedDay);
      var entriesHTML = entries.map(function(j){
        return '<div class="j-entry"><div class="j-time">'+timeAgo(j.ts)+'</div><div class="j-text">'+esc(j.text)+'</div></div>';
      }).join('');
      return '<div class="card">' +
        '<div class="section-title">'+tr('day_n_label','Day {day}').replace('{day}', selectedDay)+' · '+phaseLabel+'</div>' +
        (entriesHTML || '<p class="muted">'+tr('journey_no_entries',"Nothing logged that day.")+'</p>') +
      '</div>';

    if (selectedDay === currentDay){
      return '<div class="card">' +
        '<div class="section-title">'+tr('day_n_label','Day {day}').replace('{day}', selectedDay)+' · '+phaseLabel+'</div>' +
        '<p class="muted" style="margin-top:4px;">'+phase.transition(esc(state.name))+'</p>' +

        subtitle: historyLen ? tr(historyLen===1?'journey_nav_trend_sub_1':'journey_nav_trend_sub_n','{n} points recorded').replace('{n}', historyLen) : tr('report_wellness_history_empty','History will build up over the next few days.'),
        attrs:'data-journey-nav="trend"' }) +

        attrs:'data-journey-nav="milestones"' }) +

        subtitle: tr('journey_nav_preview_sub',"A provisional look, not the final verdict"),
        attrs:'data-journey-nav="preview"' }) +
      rowCardHTML({ icon:"medical", color: day >= 30 ? "teal" : "bad", title: tr('journey_nav_report',"Your 30-day report"),
        subtitle: day >= 30 ? tr('report_see_full','See your full 30-day report') : tr('report_unlocks_day_30','Full report unlocks on day 30.'),
        attrs:'data-journey-nav="report"' }) +
      '<div class="card">' +
        '<details><summary style="cursor:pointer; font-weight:700; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);">'+tr('tip_of_day_label','Tip of the day')+'</summary>' +

  var TAB_PAGE_HEADER = {
    training: { titleKey:"header_training_title_learn", title:"Learn", subtitle:function(){ return tr('header_training_subtitle',"Build good habits, step by step."); } },

  // Short, rotating, practical tips shown in the floating "Tip of the day" card —

    walks: [

      "Let them sniff — it's as much mental exercise as physical.",
      "Avoid the hottest hours to protect their paw pads.",
      "Changing your route now and then keeps things interesting for them."

    training: [
      "Short, frequent sessions beat one long, tiring one.",
      "Reward the exact moment of good behavior, not a few seconds later.",
      "Always end on a win, even a small one, to keep motivation up.",
      "Consistency across everyone in the household speeds up learning."

  function tipOfDayHTML(tabId){

    if (state.tipDismissed[tabId] === today) return "";
    var idx = ((today % tips.length) + tips.length) % tips.length;
    var text = keys[idx] ? tr(keys[idx], tips[idx]) : tips[idx];
    return '' +
      '<div class="tip-card" id="tip-card">' +

  function renderHome(){

    var checklist = [
      { label:tr('leave_checklist_bathroom',"Bathroom"), icon:"droplet", ready: state.bladder >= 60,

      { label:tr('leave_checklist_food',"Food"), icon:"bowl", ready: state.hunger >= 60,

      { label: canWalk ? tr('leave_checklist_exercise',"Exercise") : tr('leave_checklist_play',"Play"), icon:"bolt",
        ready: state.energy >= 50,

      '</div>' +
      '<div class="card">' +
        '<p class="muted">'+tr('leave_hours_question_prefix','How many hours will ')+esc(state.name)+tr('leave_hours_question_suffix',' actually be alone?')+'</p>' +
        '<div class="field" style="margin-top:14px">' +

        '<button class="btn btn-warn" id="confirm-leave" style="margin-top:16px">'+tr('btn_leave_now','Leave now')+'</button>' +

      '</div>';

  function renderAwayReport(report){
    var breed = byId(state.breedId);
    var timelineHtml = report.timeline.map(function(ev){
      var t = new Date(ev.ts);
      var hh = (t.getHours()<10?"0":"")+t.getHours();
      var mm = (t.getMinutes()<10?"0":"")+t.getMinutes();
      return '<div class="j-entry"><div class="j-time mono">'+hh+':'+mm+'</div><div class="j-text">'+esc(ev.text)+'</div></div>';
    }).join("");
    var footnotes = "";
    if (report.hadRisk && report.houseTrained) footnotes += '<p class="muted" style="margin-top:10px; font-size:12.5px;">Solid house-training kept any accident off the list.</p>';
    if (report.hadRisk && report.wellTrained) footnotes += '<p class="muted" style="margin-top:6px; font-size:12.5px;">Training paid off — a well-trained dog copes calmer alone, so fewer things went wrong than the hours alone would suggest.</p>';
    if (report.crateOverage > 0) footnotes += '<p class="muted" style="margin-top:6px; font-size:12.5px; color:var(--bad);">This is where crate use turns into a welfare risk, not just an inconvenience.</p>';
    return '' +
      '<div class="card">' +
        '<div class="section-title">Welcome home</div>' +
        '<h2>Away '+fmtHours(report.actualHours)+' — said '+fmtHours(report.declaredHours)+'</h2>' +
        '<p class="muted">'+esc(breed.name)+' can comfortably handle about '+fmtHours(report.tolerance)+' alone at this age ('+esc(report.housing.label)+').</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">What happened</div>' +

      '</div>' +
      '<div class="card">' +
        '<button class="btn btn-primary" id="ack-report">Back to '+esc(state.name)+'</button>' +
      '</div>';

  function renderWalkGps(){
    var breed = byId(state.breedId);
    var target = walkCtx ? walkCtx.target : Math.round(breed.walkMinutes*80);
    return '' +
      '<div class="card center">' +
        '<div class="section-title">Walking '+esc(state.name)+'</div>' +
        '<p class="muted">Move around outside — this tracks real distance with your device location, aiming for roughly a '+breed.walkMinutes+'-minute walk.</p>' +
        '<div class="big-num mono" id="walk-dist">0 m / '+target+' m</div>' +
        '<div class="meter-track" style="margin-top:6px;"><div class="meter-fill" id="walk-bar" style="width:0%; background:var(--accent)"></div></div>' +
        '<button class="btn btn-primary" id="end-walk" style="margin-top:20px">End walk</button>' +

      '</div>';

  function ringSVG(pct){
    var r = 66, c = 2*Math.PI*r;
    var offset = c - Math.max(0, Math.min(100, pct))/100*c;
    return '<svg width="152" height="152" viewBox="0 0 152 152">' +
      '<circle cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--card-2)" stroke-width="14"/>' +
      '<circle id="ring-progress" cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="14" ' +
        'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" ' +
        'transform="rotate(-90 76 76)" style="transition:stroke-dashoffset .3s ease;"/>' +
      '</svg>';
  }

  function pad2(n){ return (n<10?"0":"")+n; }

  function renderWalkSteps(){
    var breed = byId(state.breedId);
    var goalMin = walkCtx ? walkCtx.goalMinutes : breed.walkMinutes;

    // Not started yet: a calm intro (goal, static ring) with an explicit
    // "Start" tap — this is also the natural place to ask for motion-sensor
    // permission, instead of surprising the walker the instant they land here.
    if (!walkCtx){
      return '' +
        '<div class="card center">' +
          '<div class="section-title">'+tr('walk_walking_name','Walking {name}').replace('{name}', esc(state.name))+'</div>' +
          '<p class="muted">'+tr('walk_goal_intro','Goal: {min} active minutes for this breed.').replace('{min}', goalMin)+'</p>' +
          '<div class="ring-wrap">' + ringSVG(0) +
            '<div class="ring-center"><div class="ring-num mono">00:00</div><div class="ring-goal mono">'+tr('walk_of_min','of {min} min').replace('{min}', goalMin)+'</div></div>' +
          '</div>' +
          '<button class="btn btn-primary" id="start-walk-steps" style="margin-top:20px;">'+tr('btn_start_walk','Start the walk')+' →</button>' +
          '<button class="btn-ghost" id="walk-steps-cancel" style="margin-top:8px;">'+tr('btn_back_to_today','← Back to today')+'</button>' +
        '</div>';
    }

    var activeSec = walkCtx.activeSeconds;
    var steps = walkCtx.steps;
    var paused = !!walkCtx.paused;
    var goalSec = goalMin*60;
    var remainSec = Math.max(0, goalSec - activeSec);
    var pct = Math.min(100, Math.round(activeSec/goalSec*100));
    var moving = !paused && (Date.now() - walkCtx.lastStepTime) < 90000 && walkCtx.lastStepTime > 0;
    return '' +
      '<div class="card center">' +
        '<div class="section-title">'+tr('walk_walking_name','Walking {name}').replace('{name}', esc(state.name))+'</div>' +
        '<p class="muted">'+tr('walk_steps_intro','Keep moving — the ring only fills while you\'re actually walking, up to a real {min} minutes for this breed.').replace('{min}', goalMin)+'</p>' +
        '<div class="ring-wrap">' + ringSVG(pct) +
          '<div class="ring-center"><div class="ring-num mono" id="ring-num">'+pad2(Math.floor(activeSec/60))+':'+pad2(activeSec%60)+'</div><div class="ring-goal mono">'+tr('walk_of_min','of {min} min').replace('{min}', goalMin)+'</div></div>' +
        '</div>' +
        '<div class="muted" id="walk-motion-state" style="margin-top:10px; font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px;">' +
          '<span style="width:7px; height:7px; border-radius:50%; background:currentColor; flex:none;"></span>' +
          '<span id="walk-motion-label">'+(paused?tr('walk_paused_label',"Paused"):(moving?tr('walk_moving_label',"Walking — tracking your steps"):tr('walk_still_label',"Standing still — progress paused")))+'</span>' +
        '</div>' +
        '<div class="stat-grid" style="margin-top:16px;">' +
          '<div class="stat-tile">' +
            '<div class="stat-icon" style="background:var(--grad-accent); box-shadow:var(--glow-accent);">'+icon('paw',18)+'</div>' +
            '<div class="stat-value" id="walk-steps-count">'+steps+'</div>' +
            '<div class="stat-label">'+tr('walk_steps_detected','Steps detected')+'</div>' +
          '</div>' +
          '<div class="stat-tile">' +
            '<div class="stat-icon" style="background:var(--grad-teal); box-shadow:var(--glow-teal);">'+icon('clock',18)+'</div>' +
            '<div class="stat-value" id="walk-remain">'+pad2(Math.floor(remainSec/60))+':'+pad2(remainSec%60)+'</div>' +
            '<div class="stat-label">'+tr('walk_time_remaining','Time remaining')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="row-btns" style="margin-top:16px;">' +
          '<button class="btn" id="pause-walk">'+(paused?tr('btn_resume_walk','Resume'):tr('btn_pause_walk','Pause'))+'</button>' +
          '<button class="btn btn-primary" id="end-walk">'+tr('btn_end_walk','End walk')+'</button>' +
        '</div>' +
        '<p class="muted" style="margin-top:12px; font-size:12px;">'+tr('walk_lock_note','Best with your screen on. If it locks briefly, steps for that gap are estimated at a normal walking pace when you come back.')+'</p>' +
      '</div>';
  }

  function renderWalkConfirm(){
    var c = walkCtx;
    var statLine = c.mode === "steps"
      ? Math.round(c.activeSeconds/60) + " of " + c.goalMinutes + " min · " + c.steps + " steps"
      : Math.round(c.distance) + " m of " + c.target + " m";
    var lockNote = c.mode === "steps"
      ? (c.estimatedSteps ? c.estimatedSteps + " steps estimated while your screen was locked." : "")
      : (c.estimatedDistance ? "~" + Math.round(c.estimatedDistance) + "m estimated while your screen was locked." : "");
    return '' +
      '<div class="card center">' +
        '<div class="section-title">Walk complete?</div>' +
        '<div class="big-num mono" style="font-size:26px;">'+statLine+'</div>' +
        (lockNote ? '<p class="muted" style="margin-top:6px; font-size:12.5px;">'+lockNote+'</p>' : "") +
        '<p class="muted" style="margin-top:10px;">Does that match what actually happened?</p>' +
        '<button class="btn btn-primary" id="confirm-walk-yes" style="margin-top:20px">Confirm walk</button>' +
        '<button class="btn btn-ghost" id="confirm-walk-no" style="width:100%; border:1px solid var(--line); margin-top:8px;">I couldn\'t walk</button>' +
      '</div>';
  }

  function renderWalkSummary(){
    var s = lastWalkSummary;
    if (!s){ view = "home"; return renderHome(); }
    var big = s.mode === "steps" ? pad2(Math.floor(s.activeSeconds/60))+':'+pad2(s.activeSeconds%60) : s.distance+' m';
    var goalLine = s.mode === "steps" ? s.goalMinutes+' '+tr('walk_summary_min',"min") : s.target+' m';
    var sub = s.mode === "steps" ? tr('walk_summary_steps_n',"{n} steps detected").replace('{n}', s.steps) : tr('walk_summary_distance',"Distance walked");
    var feedback = s.couldntWalk ? tr('walk_summary_skipped',"Logged as skipped today — plans change, that's alright.") :

      tr('walk_summary_partial',"Logged as a partial walk — the goal wasn't fully reached.");
    return '' +
      '<div class="card center">' +
        '<div class="section-title">'+tr('walk_summary_title',"Walk summary")+'</div>' +
        '<img src="media/onboarding/name-walk.jpg" alt="" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:16px; margin:10px 0 4px;">' +
        '<div class="big-num mono" style="margin-top:14px;">'+big+'</div>' +
        '<div class="muted">'+sub+'</div>' +
        '<div class="cost-row" style="margin-top:18px; border-bottom:none;"><span>'+tr('walk_summary_goal',"Goal")+'</span><b>'+goalLine+'</b></div>' +
        '<p class="muted" style="margin-top:10px;">'+feedback+'</p>' +
        '<button class="btn btn-primary" id="walk-summary-done" style="margin-top:20px;">'+tr('walk_summary_back',"Back to today")+' →</button>' +
        '<button class="btn-ghost" id="walk-summary-new" style="margin-top:8px; border:1px solid var(--line); width:100%;">'+tr('walk_summary_new',"New walk")+'</button>' +
      '</div>';
  }

  function quizOptionStyle(selected){
    return selected

  function trainingStepsHTML(skill){

      return '<div class="step-row">' +
        '<div class="step-num">'+(i+1)+'</div>' +

        '<div class="step-info">'+esc(s.info)+'</div></div>' +
      '</div>';
    }).join("");

  function trainStagePill(n){
    var STAGE_LABELS = [
      tr('train_stage_1','1 · WATCH & PRACTICE'),
      tr('train_stage_2','2 · QUICK CHECK'),
      tr('train_stage_3','3 · HOW IT WENT')
    ];

  function renderTrainFeedback(){
    var c = quizFeedbackCtx;

      return { color:"bad", iconName:"x" };

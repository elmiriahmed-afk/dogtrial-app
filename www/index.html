<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DogTrial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EDECE3;
    --card:#FFFFFF;
    --card-2:#F6F5EE;
    --ink:#1B2420;
    --ink-soft:#5B6760;
    --ink-faint:#8A938B;
    --line:#DEDBCE;
    --accent:#3F6B4A;
    --accent-soft:#E4ECE3;
    --warn:#B4762E;
    --warn-soft:#F3E8D6;
    --bad:#A13D2B;
    --bad-soft:#F4E1DB;
    --shadow: 0 1px 2px rgba(27,36,32,.06), 0 8px 24px rgba(27,36,32,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121613;
      --card:#1C2420;
      --card-2:#212B25;
      --ink:#ECEEE8;
      --ink-soft:#9BA69E;
      --ink-faint:#6C766E;
      --line:#333F37;
      --accent:#7FB88D;
      --accent-soft:#233029;
      --warn:#D9A25C;
      --warn-soft:#332A1B;
      --bad:#DD8C7A;
      --bad-soft:#332420;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121613; --card:#1C2420; --card-2:#212B25; --ink:#ECEEE8; --ink-soft:#9BA69E;
    --ink-faint:#6C766E; --line:#333F37; --accent:#7FB88D; --accent-soft:#233029;
    --warn:#D9A25C; --warn-soft:#332A1B; --bad:#DD8C7A; --bad-soft:#332420;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  #app{width:100%; max-width:440px;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}

  /* ---- brand strip ---- */
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:18px; color:var(--ink-soft);}
  .brand .mark{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .brand span{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase;}

  /* ---- cards / generic ---- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px;
  }
  .card + .card{margin-top:14px;}
  .stack{display:flex; flex-direction:column; gap:14px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line); background:var(--card-2); color:var(--ink);
    border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:600;
    width:100%;
  }
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-warn{background:var(--warn); border-color:var(--warn); color:#fff;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft); width:auto; padding:6px 8px; font-size:13px;}
  .row-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---- onboarding ---- */
  .intro p{color:var(--ink-soft); font-size:15px; max-width:52ch;}
  .field label{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; font-family:"IBM Plex Mono",monospace;}
  .field input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card-2); color:var(--ink); font-size:16px; font-family:inherit;
  }
  .breed-grid{display:flex; flex-direction:column; gap:10px;}
  .breed-card{
    border:1.5px solid var(--line); border-radius:12px; padding:14px; background:var(--card-2);
    text-align:left; display:flex; gap:12px; align-items:flex-start;
  }
  .breed-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .breed-card .name{font-weight:700; font-size:15px;}
  .breed-card .catch{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .traits{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .trait{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-soft); background:var(--card); border:1px solid var(--line); padding:2px 6px; border-radius:5px;}
  .house-risk{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft);}
  .house-risk-tag{display:block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--warn); margin-bottom:3px;}

  /* ---- cost breakdown ---- */
  .cost-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .cost-row b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cost-total{border-bottom:none; font-weight:600; margin-top:2px; padding-top:9px; border-top:1px dashed var(--line);}
  .challenge-list{margin:10px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-soft);}
  .challenge-list li{margin-bottom:6px; line-height:1.4;}
  .pup-thumb{flex:none; width:56px; height:52px;}
  .pup-thumb svg, .dog-portrait svg, .pup-thumb img, .dog-portrait img{width:100%; height:100%; display:block; object-fit:contain;}

  /* ---- dashboard header ---- */
  .dog-head{display:flex; align-items:center; gap:14px;}
  .dog-portrait{width:120px; height:104px; flex:none;}
  .dog-id .name{font-size:22px; font-weight:700;}
  .stage-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .badge{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; font-weight:600;
  }
  .badge.puppy{background:var(--accent-soft); color:var(--accent);}
  .badge.adolescent{background:var(--warn-soft); color:var(--warn);}
  .badge.adult{background:var(--card-2); color:var(--ink-soft); border:1px solid var(--line);}
  .age{color:var(--ink-faint); font-size:13px;}
  .mood-chip{margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;}
  .mood-dot{width:8px; height:8px; border-radius:50%;}
  .day-label{color:var(--ink-faint); font-size:11px; letter-spacing:.05em; text-transform:uppercase;}
  .next-label{font-family:"Fraunces",serif; font-weight:600; font-size:22px; margin-top:2px;}

  /* ---- meters ---- */
  .meter-track{height:8px; border-radius:6px; background:var(--card-2); border:1px solid var(--line); overflow:hidden;}
  .meter-fill{height:100%; border-radius:6px; transition:width .4s ease;}

  .section-title{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; margin-bottom:12px;}

  /* ---- training ---- */
  .cmd-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .cmd-row:last-child{border-bottom:none;}
  .cmd-name{font-size:14px; font-weight:600; width:110px; flex:none;}
  .cmd-bar{flex:1; height:6px; border-radius:5px; background:var(--card-2); border:1px solid var(--line); overflow:hidden;}
  .cmd-fill{height:100%; background:var(--accent); border-radius:5px;}
  .cmd-btn{flex:none; font-size:12px; padding:7px 11px; width:auto; border-radius:8px;}

  .track-wrap{margin:22px 0 8px;}
  .track{position:relative; height:22px; border-radius:11px; background:var(--card-2); border:1px solid var(--line);}
  .zone{position:absolute; top:0; bottom:0; background:var(--accent-soft); border-left:2px solid var(--accent); border-right:2px solid var(--accent);}
  .marker{position:absolute; top:-5px; width:10px; height:32px; margin-left:-5px; background:var(--ink); border-radius:4px;}
  .round-dots{display:flex; gap:6px; justify-content:center; margin-top:16px;}
  .round-dots span{width:9px; height:9px; border-radius:50%; background:var(--card-2); border:1px solid var(--line);}
  .round-dots span.hit{background:var(--accent); border-color:var(--accent);}
  .round-dots span.miss{background:var(--bad); border-color:var(--bad);}

  /* ---- journal ---- */
  .j-entry{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .j-entry:last-child{border-bottom:none;}
  .j-time{flex:none; width:64px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding-top:1px;}
  .j-text{color:var(--ink);}

  .alert-banner{margin-top:14px; padding:10px 12px; border-radius:8px; background:var(--warn-soft); color:var(--warn); font-size:13px; text-align:left; font-weight:600;}

  /* ---- activity ring ---- */
  .ring-wrap{position:relative; width:152px; height:152px; margin:20px auto 0;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-num{font-size:26px; font-weight:700; line-height:1;}
  .ring-goal{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* ---- settings ---- */
  .setting-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;}
  .setting-copy .title{font-weight:600; font-size:14px;}
  .setting-copy .caveat{color:var(--ink-soft); font-size:12px; margin-top:3px; line-height:1.5;}
  .switch{position:relative; display:inline-block; width:38px; height:22px; flex:none; margin-top:2px;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .slider{position:absolute; inset:0; background:var(--card-2); border:1px solid var(--line); border-radius:22px; transition:.15s;}
  .switch .slider:before{content:""; position:absolute; height:16px; width:16px; left:2px; top:2px; background:var(--ink-faint); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--accent-soft); border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(15px); background:var(--accent);}

  .center{text-align:center;}
  .muted{color:var(--ink-soft); font-size:14px;}
  .big-num{font-family:"Fraunces",serif; font-size:40px; font-weight:600;}

  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .reset-confirm{display:flex; align-items:center; gap:8px;}

  @media (prefers-reduced-motion: reduce){
    .meter-fill, .cmd-fill{transition:none;}
  }
</style>

  // or it reads as noise instead of a moment.
  function maybePositiveMoment(deltaHours){
    if (state.bond < 45) return;
    var hoursSince = (Date.now() - (state.lastPositiveMomentAt||0)) / HOUR;
    if (hoursSince < 3) return;
    var chance = Math.min(0.9, deltaHours/8) * (state.bond/100);
    if (Math.random() < chance){
      var pick = POSITIVE_MOMENTS[Math.floor(Math.random()*POSITIVE_MOMENTS.length)];
      log(pick(state.name));
      state.bond = clamp(state.bond + 1);
      state.lastPositiveMomentAt = Date.now();
    }
  }

  // Real elapsed days, not simulated dog age — the 30-day clock keeps moving
  // even if the dog's own aging is compressed or paused.
  function checkPhaseTransition(){
    var day = Math.min(30, tripDay()+1);
    var phase = tripPhaseFor(day);
    if (state.lastPhaseLabel && state.lastPhaseLabel !== phase.label){
      log(phase.transition(state.name));
    }
    state.lastPhaseLabel = phase.label;
  }

  function tickHome(now){
    var last = state.lastTick;
    var deltaHours = (now-last)/HOUR;
    if (deltaHours <= 0) return;
    var stageBefore = stageOf(state.dogDays);
    applyHomeDecay(deltaHours, stageBefore);
    state.dogDays += deltaHours*DOGDAYS_PER_HOUR;
    state.lastTick = now;
    var stageAfter = stageOf(state.dogDays);
    if (stageAfter !== stageBefore){
      log(state.name + " is now " + STAGE_LABEL[stageAfter].toLowerCase() + ".");
    }
    if (!canWalkOutside(state.dogDays) && state.bladder <= 0 && (now - (state.lastHomeAccidentAt||0)) > 0.75*HOUR){
      state.houseTraining = clamp(state.houseTraining - 3);
      state.lastHomeAccidentAt = now;
      state.accidentsCount = (state.accidentsCount||0) + 1;
      bumpOwnerLoad(8);
      log(state.name + " had an accident on the floor — before real walks start, puppies need a bathroom trip after almost every nap, meal, or play session.");
    }
    maybePositiveMoment(deltaHours);
    checkPhaseTransition();
    bumpOwnerLoad(-deltaHours*0.5); // calm, uneventful time settles the load back down
    save();
  }

  function computeTolerance(breed, stage, housing){
    return breed.tolerance * TOLERANCE_MULT[stage] * housing.toleranceMult;
  }

  // Difficulty comes from breed x home x life together, not from the breed alone —
  // the same husky can be an easy or a rough fit depending on the other two.
  function lifeFitMessage(breed, housing, stage, hoursAway){
    var tolerance = computeTolerance(breed, stage, housing);
    if (!isFinite(tolerance)) return "Pick a starting age above to see how this combination fits.";
    if (hoursAway <= tolerance) return breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone at this age — your typical day should fit.";
    var excess = hoursAway - tolerance;
    if (excess <= 2) return "This combination may create some challenges — " + breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone, a bit less than your typical day.";
    return "This combination may create significant challenges around exercise and alone time — " + breed.name + " can comfortably handle about " + Math.round(tolerance) + "h alone, well under your typical " + hoursAway + "h day.";
  }

  function housingRiskNote(housing){
    if (housing.id === "garden") return "there's a yard to burn energy in, so it's a lower-risk kind of alone";
    if (housing.id === "cage") return "no property is at risk, but this is exactly where crate time turns into anxiety and depression";
    return "confined with nothing to do — this is where boredom-chewing starts";
  }

  function resolveAway(now){
    var away = state.away;
    var actualHours = (now - away.leaveStart)/HOUR;
    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    applyHomeDecay(actualHours, stage); // baseline physiological need regardless of tolerance
    state.dogDays += actualHours*DOGDAYS_PER_HOUR;
    checkPhaseTransition();

    var tolerance = computeTolerance(breed, stage, housing);
    var excess = Math.max(0, actualHours - tolerance);
    var incidents = [];
    var houseTrained = state.houseTraining >= 70;
    var avgTraining = COMMANDS.reduce(function(s,c){ return s + state.training[c.id]; }, 0) / COMMANDS.length;
    var wellTrained = avgTraining >= 60;
    if (excess > 0){
      var rolls = Math.min(4, Math.max(1, Math.ceil(excess/1.5) - (wellTrained?1:0) + housing.rollAdjust));
      var pool = housing.confinement
        ? CONFINEMENT_INCIDENTS.slice()
        : breed.incidents.filter(function(inc){ return !(houseTrained && inc.type==="accident"); });
      for (var i=0;i<rolls && pool.length>0;i++){
        var idx = Math.floor(Math.random()*pool.length);
        var inc = pool.splice(idx,1)[0];
        incidents.push(inc);
        state.bond = clamp(state.bond + inc.bond);
        state.health = clamp(state.health + inc.health);
        state.houseTraining = clamp(state.houseTraining + inc.house);
      }
    }

    // Crate time beyond a welfare-safe cap costs extra, regardless of how many incidents rolled —
    // this is the "depression" risk, distinct from the physical-damage risk of a free-roam apartment.
    var crateCap = 4 * TOLERANCE_MULT[stage];
    var crateOverage = 0;
    if (housing.confinement && actualHours > crateCap){
      crateOverage = actualHours - crateCap;
      state.bond = clamp(state.bond - crateOverage*1.5);
      state.health = clamp(state.health - crateOverage*1);
    }

    state.lastTick = now;
    state.away = null;
    state.totalHoursAway = (state.totalHoursAway||0) + actualHours;
    state.accidentsCount = (state.accidentsCount||0) + incidents.filter(function(inc){ return inc.type==="accident"; }).length;
    bumpOwnerLoad(5 + incidents.length*3 + (crateOverage>0 ? 5 : 0));

    // Build a real timeline instead of a lump-sum summary: each incident is logged with
    // the timestamp it actually happened at, spread across the window past tolerance —
    // action (leaving) -> state (restless) -> delay -> consequence (incident), not a score.
    var toleranceMs = tolerance*HOUR;
    var timeline = [{ ts: away.leaveStart, text: "Left for work — said back in " + away.declaredHours + "h." }];
    if (excess > 0){
      var restlessTs = away.leaveStart + toleranceMs;
      var restlessText = state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.";
      if (!away.awayAlerted) logAt(restlessTs, restlessText);
      timeline.push({ ts: restlessTs, text: restlessText });
    }
    if (incidents.length > 0){
      var windowMs = Math.max(1, now - (away.leaveStart + toleranceMs));
      incidents.forEach(function(inc, i){
        var ts = away.leaveStart + toleranceMs + windowMs * ((i+1) / (incidents.length+1));
        var text = state.name + " " + inc.text + ".";
        logAt(ts, text);
        timeline.push({ ts: ts, text: text });
      });
    }
    if (crateOverage > 0){
      var crateText = state.name + " spent " + fmtHours(crateOverage) + " past the recommended crate-time limit.";
      log(crateText);
      timeline.push({ ts: now, text: crateText });
    }
    var homeText = (incidents.length===0 && crateOverage===0)
      ? state.name + " handled " + fmtHours(actualHours) + " alone just fine."
      : "You're home. " + state.name + " is excited to see you.";
    log(homeText);
    timeline.push({ ts: now, text: homeText });
    save();

    return { actualHours: actualHours, declaredHours: away.declaredHours, tolerance: tolerance, incidents: incidents,
      houseTrained: houseTrained, wellTrained: wellTrained, hadRisk: excess>0, housing: housing, crateOverage: crateOverage,
      timeline: timeline };
  }

  function checkNotify(){
    if (!state || !state.settings.notifications || !("Notification" in window) || Notification.permission !== "granted") return;
    var checks = [["hunger","is hungry"],["bladder","needs a walk, badly"],["energy","has too much pent-up energy"]];
    checks.forEach(function(pair){
      var key = pair[0];
      if (state[key] < 20 && Date.now() - (state.lastNotified[key]||0) > 2*HOUR){
        try { new Notification("The 30-Day Dog", { body: state.name + " " + pair[1] + ".", tag: "need-"+key }); } catch(e){}
        state.lastNotified[key] = Date.now();
        save();
      }
    });
  }

  function moodOf(){
    var score = state.hunger*0.15 + state.bladder*0.15 + state.energy*0.15 + state.bond*0.3 + state.health*0.25;
    if (score>=78) return {label:"Content", key:"good"};
    if (score>=55) return {label:"Restless", key:"warn"};
    if (score>=32) return {label:"Distressed", key:"bad"};
    return {label:"Struggling", key:"bad"};
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function dayLabel(){
    var n = Math.max(1, tripDay()+1);
    var phase = tripPhaseFor(n);
    var now = new Date();
    var weekday = now.toLocaleDateString("en-US", { weekday:"long" });
    var monthDay = now.toLocaleDateString("en-US", { month:"long", day:"numeric" });
    return "Day " + Math.min(30, n) + " / 30 · " + phase.label + " · " + weekday + ", " + monthDay;
  }

  function todaysJournalEntries(){
    var now = new Date();
    return state.journal.filter(function(j){
      return new Date(j.ts).toDateString() === now.toDateString();
    }).slice().reverse();
  }

  // Picks the single most urgent thing the dog needs right now, from real decay rates —
  // not a dashboard of every meter, just what to do next.
  function computeNextAction(){
    var stage = stageOf(state.dogDays);
    var canWalk = canWalkOutside(state.dogDays);
    var fi = FEED_INTERVAL[stage], bi = BLADDER_INTERVAL[stage];

    function etaMinutes(val, intervalHours){
      if (!intervalHours) return Infinity;
      return Math.max(0, val * intervalHours / 100 * 60);
    }

    var hungerEta = etaMinutes(state.hunger, fi);
    var bladderEta = etaMinutes(state.bladder, bi);
    var energyEta = etaMinutes(state.energy, WALK_INTERVAL_HOURS);
    var outEta = Math.min(bladderEta, energyEta);
    var outIsBladder = bladderEta <= energyEta;

    var candidates = [
      { eta: hungerEta, label:"Feeding time", cta:"Feed " + esc(state.name), actionId:"feed" },
      { eta: outEta,
        label: outIsBladder ? "Bathroom break" : (canWalk ? "Walk" : "Safe activity"),
        cta: canWalk ? "Take her out" : "See safe activities",
        actionId: canWalk ? "walk" : "play" }
    ];
    candidates.sort(function(a,b){ return a.eta - b.eta; });
    var top = candidates[0];
    var minutes = Math.round(top.eta);

    var etaText;
    if (!isFinite(minutes)) etaText = "Not urgent right now";
    else if (minutes <= 0) etaText = "Due now";
    else if (minutes < 60) etaText = "in about " + minutes + " min";
    else etaText = "in about " + fmtHours(minutes/60);

    return { label: top.label, cta: top.cta, actionId: top.actionId, etaText: etaText };
  }

  // ---------- SVG dog ----------
  function dogSVG(breed, stage){
    var P = {
      puppy:{scale:0.66, headR:32, bodyRX:42, bodyRY:32, legH:16, headYOff:-6},
      adolescent:{scale:0.86, headR:27, bodyRX:52, bodyRY:28, legH:34, headYOff:0},
      adult:{scale:1, headR:29, bodyRX:58, bodyRY:32, legH:32, headYOff:0}
    }[stage];
    var cx = 100, bodyCy = 118;
    var headCx = 46, headCy = bodyCy - P.bodyRY - P.headR*0.55 + P.headYOff;
    var coat = breed.coat, coatLight = breed.coatLight;

    var ears = "";
    if (breed.ear === "floppy"){
      ears = '<ellipse cx="'+(headCx-14)+'" cy="'+(headCy+10)+'" rx="9" ry="18" fill="'+coat+'" transform="rotate(18 '+(headCx-14)+' '+(headCy+10)+')"/>' +
             '<ellipse cx="'+(headCx+16)+'" cy="'+(headCy+10)+'" rx="9" ry="18" fill="'+coat+'" transform="rotate(-14 '+(headCx+16)+' '+(headCy+10)+')"/>';
    } else if (breed.ear === "pointy"){
      ears = '<path d="M '+(headCx-18)+' '+(headCy-6)+' L '+(headCx-22)+' '+(headCy-32)+' L '+(headCx-6)+' '+(headCy-14)+' Z" fill="'+coat+'"/>' +
             '<path d="M '+(headCx+16)+' '+(headCy-6)+' L '+(headCx+22)+' '+(headCy-32)+' L '+(headCx+6)+' '+(headCy-14)+' Z" fill="'+coat+'"/>';
    } else {
      ears = '<path d="M '+(headCx-16)+' '+(headCy-4)+' L '+(headCx-18)+' '+(headCy-20)+' L '+(headCx-4)+' '+(headCy-10)+' Z" fill="'+coat+'"/>' +
             '<path d="M '+(headCx+14)+' '+(headCy-4)+' L '+(headCx+18)+' '+(headCy-20)+' L '+(headCx+4)+' '+(headCy-10)+' Z" fill="'+coat+'"/>';
    }

    var legX = [cx-38, cx-14, cx+16, cx+40];
    var legs = legX.map(function(lx, i){
      var back = i<2;
      var ly = bodyCy + P.bodyRY - 6;
      return '<rect x="'+(lx-6)+'" y="'+ly+'" width="12" height="'+P.legH+'" rx="5" fill="'+(back?coat:coatLight)+'" opacity="'+(back?0.9:1)+'"/>';
    }).join("");

    var svg = '<svg viewBox="0 0 200 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(breed.name)+'">' +
      legs +
      '<ellipse cx="'+cx+'" cy="'+bodyCy+'" rx="'+P.bodyRX+'" ry="'+P.bodyRY+'" fill="'+coat+'"/>' +
      '<ellipse cx="'+cx+'" cy="'+(bodyCy+8)+'" rx="'+(P.bodyRX*0.55)+'" ry="'+(P.bodyRY*0.5)+'" fill="'+coatLight+'" opacity="0.55"/>' +
      '<path d="M '+(cx+P.bodyRX-8)+' '+(bodyCy-6)+' Q '+(cx+P.bodyRX+22)+' '+(bodyCy-24)+' '+(cx+P.bodyRX+14)+' '+(bodyCy-40)+'" stroke="'+coat+'" stroke-width="9" fill="none" stroke-linecap="round"/>' +
      ears +
      '<circle cx="'+headCx+'" cy="'+headCy+'" r="'+P.headR+'" fill="'+coat+'"/>' +
      '<ellipse cx="'+(headCx-P.headR*0.65)+'" cy="'+(headCy+P.headR*0.35)+'" rx="'+(P.headR*0.42)+'" ry="'+(P.headR*0.3)+'" fill="'+coatLight+'"/>' +
      '<circle cx="'+(headCx-P.headR*1.0)+'" cy="'+(headCy+P.headR*0.32)+'" r="2.6" fill="'+state_ink()+'"/>' +
      '<circle cx="'+(headCx-6)+'" cy="'+(headCy-6)+'" r="3.4" fill="'+state_ink()+'"/>' +
      '</svg>';
    return svg;
  }
  function state_ink(){ return "#1B2420"; }

  function dogVisual(breed, stage){
    if (breed.icon) return '<img src="'+breed.icon+'" alt="'+esc(breed.name)+'">';
    return dogSVG(breed, stage);
  }

    else if (view === "leaveSetup") root.innerHTML = brandStrip() + renderLeaveSetup();
    else if (view === "atWork") root.innerHTML = brandStrip() + renderAtWork();
    else if (view === "awayReport") root.innerHTML = brandStrip() + renderAwayReport(window.__lastReport);
    else if (view === "train") root.innerHTML = brandStrip() + renderTrain();
    else if (view === "journal") root.innerHTML = brandStrip() + renderJournal();
    else if (view === "reality7") root.innerHTML = brandStrip() + renderReality7();
    else if (view === "report30") root.innerHTML = brandStrip() + renderReport30();
    else if (view === "walkGps") root.innerHTML = brandStrip() + renderWalkGps();
    else if (view === "walkSteps") root.innerHTML = brandStrip() + renderWalkSteps();
    else if (view === "walkConfirm") root.innerHTML = brandStrip() + renderWalkConfirm();
    else if (view === "safeActivities") root.innerHTML = brandStrip() + renderSafeActivities();
    attachHandlers();
    if (view === "atWork") startAtWorkClock();
    else if (view === "walkSteps") startStepsClock();
  }

    return '' +
      '<div class="card">' +

  function ringSVG(pct){
    var r = 66, c = 2*Math.PI*r;
    var offset = c - Math.max(0, Math.min(100, pct))/100*c;
    return '<svg width="152" height="152" viewBox="0 0 152 152">' +
      '<circle cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--card-2)" stroke-width="14"/>' +
      '<circle id="ring-progress" cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="14" ' +
        'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" ' +
        'transform="rotate(-90 76 76)" style="transition:stroke-dashoffset .3s ease;"/>' +
      '</svg>';
  }

  function pad2(n){ return (n<10?"0":"")+n; }

  function renderWalkSteps(){
    var breed = byId(state.breedId);
    var goalMin = walkCtx ? walkCtx.goalMinutes : breed.walkMinutes;
    var activeSec = walkCtx ? walkCtx.activeSeconds : 0;
    var steps = walkCtx ? walkCtx.steps : 0;
    var pct = Math.min(100, Math.round(activeSec/(goalMin*60)*100));
    return '' +
      '<div class="card center">' +
        '<div class="section-title">Walking '+esc(state.name)+'</div>' +
        '<p class="muted">Keep moving — the ring only fills while you\'re actually walking, up to a real '+goalMin+' minutes for this breed.</p>' +
        '<div class="ring-wrap">' + ringSVG(pct) +
          '<div class="ring-center"><div class="ring-num mono" id="ring-num">'+pad2(Math.floor(activeSec/60))+':'+pad2(activeSec%60)+'</div><div class="ring-goal mono">of '+goalMin+' min</div></div>' +
        '</div>' +
        '<div class="muted mono" id="walk-steps-count" style="margin-top:12px; font-size:12.5px;">'+steps+' steps detected</div>' +
        '<button class="btn btn-primary" id="end-walk" style="margin-top:16px">End walk</button>' +
      '</div>';
  }

  // ---------- handlers ----------
  function attachHandlers(){
    var root = document.getElementById("app");

    if (view === "onboarding"){
      root.querySelectorAll("[data-breed]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingBreed = el.getAttribute("data-breed");
          render();
        });
      });
      root.querySelectorAll("[data-housing]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingHousing = el.getAttribute("data-housing");
          render();
        });
      });
      root.querySelectorAll("[data-start-stage]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingStartStage = el.getAttribute("data-start-stage");
          render();
        });
      });
      root.querySelectorAll("[data-life]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingLife = el.getAttribute("data-life");
          render();
        });
      });
      var startBtn = document.getElementById("start-btn");
      if (startBtn) startBtn.addEventListener("click", function(){
        var nameInput = document.getElementById("dogname");
        var name = (nameInput.value || "").trim() || "The dog";
        var startStage = START_STAGES.filter(function(s){ return s.id === pendingStartStage; })[0] || START_STAGES[0];
        state = newDog(name, pendingBreed, pendingHousing, startStage.startDogDays);
        state.typicalHoursAway = lifeById(pendingLife).hoursAway;
        save();
        view = "home";
        render();
      });
    }

    if (view === "home"){
      var nextBtn = document.getElementById("next-action-btn");
      if (nextBtn) nextBtn.addEventListener("click", function(){
        var target = document.getElementById(nextBtn.getAttribute("data-action") + "-btn");
        if (target) target.click();
      });
      document.getElementById("feed-btn").addEventListener("click", function(){
        state.hunger = 100; state.bond = clamp(state.bond+1);
        var isPuppy = stageOf(state.dogDays) === "puppy";
        if (isPuppy) state.bladder = clamp(state.bladder - 30);
        log("Fed " + state.name + "." + (isPuppy ? " Expect a bathroom trip within 20 minutes at this age." : ""));
        bumpOwnerLoad(1);
        save(); render();
      });
      var walkBtn = document.getElementById("walk-btn");
      if (walkBtn) walkBtn.addEventListener("click", function(){
        if (state.settings.stepWalks && typeof DeviceMotionEvent !== "undefined") startStepsWalk();
        else if (state.settings.gpsWalks && "geolocation" in navigator) startGpsWalk();
        else doManualWalk();
      });
      var playBtn = document.getElementById("play-btn");
      if (playBtn) playBtn.addEventListener("click", function(){
        view = "safeActivities"; render();
      });
      document.getElementById("leave-btn").addEventListener("click", function(){
        view = "leaveSetup"; render();
      });
      document.getElementById("journal-btn").addEventListener("click", function(){
        view = "journal"; render();
      });
      var resetBtn = document.getElementById("reset-btn");
      if (resetBtn) resetBtn.addEventListener("click", function(){
        resetConfirmOpen = true;
        render();
      });
      var resetConfirmBtn = document.getElementById("reset-confirm-btn");
      if (resetConfirmBtn) resetConfirmBtn.addEventListener("click", function(){
        resetConfirmOpen = false;
        archiveCurrentTrial("ended early");
        state = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
        view = "onboarding";
        render();
      });
      var resetCancelBtn = document.getElementById("reset-cancel-btn");
      if (resetCancelBtn) resetCancelBtn.addEventListener("click", function(){
        resetConfirmOpen = false;
        render();
      });
      root.querySelectorAll("[data-train]").forEach(function(el){
        el.addEventListener("click", function(){
          var cooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
          if (cooldownLeft > 0) return;
          var breed = byId(state.breedId);
          var width = Math.max(12, Math.min(40, 12 + breed.trainability*2.4)) * (state.energy<30 ? 0.7 : 1);
          trainCtx = {
            commandId: el.getAttribute("data-train"),
            round: 0, results: [],
            zoneLeft: Math.random()*(100-width),
            zoneWidth: width,
            pos: 0
          };
          view = "train"; render();
          startTrainAnim();
        });
      });
      var notifToggle = document.getElementById("notif-toggle");
      notifToggle.addEventListener("change", function(){
        if (notifToggle.checked){
          if (!("Notification" in window)){
            notifToggle.checked = false;
            window.alert("This browser doesn't support notifications.");
            return;
          }
          Notification.requestPermission().then(function(perm){
            state.settings.notifications = (perm === "granted");
            notifToggle.checked = state.settings.notifications;
            save();
          });
        } else {
          state.settings.notifications = false;
          save();
        }
      });
      var gpsToggle = document.getElementById("gps-toggle");
      gpsToggle.addEventListener("change", function(){
        if (gpsToggle.checked && !("geolocation" in navigator)){
          gpsToggle.checked = false;
          window.alert("This browser doesn't support location.");
          return;
        }
        state.settings.gpsWalks = gpsToggle.checked;
        save();
      });
      var stepsToggle = document.getElementById("steps-toggle");
      stepsToggle.addEventListener("change", function(){
        if (stepsToggle.checked && typeof DeviceMotionEvent === "undefined"){
          stepsToggle.checked = false;
          window.alert("This browser doesn't support motion sensing.");
          return;
        }
        state.settings.stepWalks = stepsToggle.checked;
        save();
      });
    }

    if (view === "walkGps"){
      document.getElementById("end-walk").addEventListener("click", function(){
        requestGpsWalkConfirm();
      });
    }

    if (view === "walkSteps"){
      document.getElementById("end-walk").addEventListener("click", function(){
        requestStepsWalkConfirm();
      });
    }

    if (view === "walkConfirm"){
      var isSteps = walkCtx && walkCtx.mode === "steps";
      document.getElementById("confirm-walk-yes").addEventListener("click", function(){
        if (isSteps) finishStepsWalk(false, false);
        else finishGpsWalk(false, false);
      });
      document.getElementById("confirm-walk-no").addEventListener("click", function(){
        if (isSteps) finishStepsWalk(false, true);
        else finishGpsWalk(false, true);
      });
    }

    if (view === "safeActivities"){
      root.querySelectorAll("[data-activity]").forEach(function(el){
        el.addEventListener("click", function(){
          doSafeActivity(el.getAttribute("data-activity"));
        });
      });
      document.getElementById("safe-activities-back").addEventListener("click", function(){
        view = "home"; render();
      });
    }

    if (view === "leaveSetup"){
      var range = document.getElementById("hours-range");
      var out = document.getElementById("hours-out");
      range.addEventListener("input", function(){ out.textContent = range.value + "h"; });
      document.getElementById("confirm-leave").addEventListener("click", function(){
        var hours = parseInt(range.value, 10);
        state.away = { leaveStart: Date.now(), declaredHours: hours, awayAlerted: false };
        log("Left for work — said back in " + hours + "h.");
        save();
        view = "atWork"; render();
      });
      document.getElementById("cancel-leave").addEventListener("click", function(){
        view = "home"; render();
      });
    }

    if (view === "atWork"){
      document.getElementById("im-back").addEventListener("click", function(){
        stopLiveTimer();
        var report = resolveAway(Date.now());
        window.__lastReport = report;
        view = "awayReport"; render();
      });
    }

    if (view === "awayReport"){
      document.getElementById("ack-report").addEventListener("click", function(){
        view = "home"; maybeInterceptView(); render();
      });
    }

    if (view === "journal"){
      document.getElementById("back-home").addEventListener("click", function(){
        view = "home"; render();
      });
    }

    if (view === "reality7"){
      document.getElementById("reality-keep").addEventListener("click", function(){
        log("Day 7: decided to keep going.");
        save(); view = "home"; render();
      });
      document.getElementById("reality-unsure").addEventListener("click", function(){
        log("Day 7: not sure yet — noted, and that's useful information.");
        save(); view = "home"; render();
      });
    }

    if (view === "report30"){
      document.getElementById("report-yes").addEventListener("click", function(){
        log("30-day trial complete: ready to adopt.");
        archiveCurrentTrial("ready to adopt");
        save(); view = "home"; render();
      });
      document.getElementById("report-think").addEventListener("click", function(){
        log("30-day trial complete: still thinking it over.");
        archiveCurrentTrial("still deciding");
        save(); view = "home"; render();
      });
      document.getElementById("report-no").addEventListener("click", function(){
        log("30-day trial complete: not the right dog — a successful outcome, not a failure.");
        archiveCurrentTrial("not the right dog");
        save(); view = "home"; render();
      });
    }

    if (view === "train"){
      document.getElementById("tap-btn").addEventListener("click", onTap);
    }
  }

  // ---------- training animation ----------
  var trainAnimStart = null, trainAnimId = null;
  function startTrainAnim(){
    trainAnimStart = performance.now();
    var period = 1100;
    function loop(now){
      var t = ((now-trainAnimStart) % period) / period;
      var pos = t < 0.5 ? t*2*100 : (1-t)*2*100;
      trainCtx.pos = pos;
      var marker = document.getElementById("marker");
      if (marker) marker.style.left = pos + "%";
      if (view === "train") trainAnimId = requestAnimationFrame(loop);
    }
    trainAnimId = requestAnimationFrame(loop);
  }
  function stopTrainAnim(){
    if (trainAnimId) cancelAnimationFrame(trainAnimId);
    trainAnimId = null;
  }
  function onTap(){
    var c = trainCtx;
    var hit = c.pos >= c.zoneLeft && c.pos <= (c.zoneLeft + c.zoneWidth);
    c.results.push(hit);
    if (c.results.length >= 3){
      stopTrainAnim();
      var breed = byId(state.breedId);
      var hits = c.results.filter(Boolean).length;
      var ratio = hits/3;
      var cmd = COMMANDS.filter(function(x){return x.id===c.commandId;})[0];
      state.training[c.commandId] = clamp(state.training[c.commandId] + ratio*(5+breed.trainability));
      state.bond = clamp(state.bond + ratio*3);
      state.energy = clamp(state.energy - 10);
      var isPuppy = stageOf(state.dogDays) === "puppy";
      if (isPuppy) state.bladder = clamp(state.bladder - 15);
      state.lastTrainedAt = Date.now();
      var resultWord = ratio>=0.66 ? "went well" : ratio>0 ? "was mixed" : "didn't land";
      log("Training — " + cmd.label + ": " + hits + "/3, session " + resultWord + "." + (isPuppy ? " Playtime like this means another bathroom trip soon." : ""));
      bumpOwnerLoad(2);
      save();
      trainCtx = null;
      view = "home";
      render();
    } else {
      render();
    }
  }

  // ---------- walks ----------
  var walkCtx = null;
  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d*Math.PI/180; };
    var dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function applyWalkOutcome(fraction, note){
    fraction = Math.max(0.15, Math.min(1, fraction));
    state.bladder = 100;
    state.energy = clamp(state.energy + fraction*(100-state.energy));
    state.bond = clamp(state.bond + fraction*3);
    state.houseTraining = clamp(state.houseTraining + fraction*2);
    state.walksCompleted = (state.walksCompleted||0) + 1;
    bumpOwnerLoad(3);
    log(note);
    save();
  }
  function doManualWalk(){
    applyWalkOutcome(1, "Walked " + state.name + ".");
    view = "home"; render();
  }
  function applyPlayOutcome(note){
    state.bladder = 100;
    state.energy = clamp(state.energy + 0.5*(100-state.energy));
    state.bond = clamp(state.bond + 4);
    state.houseTraining = clamp(state.houseTraining + 1);
    state.walksCompleted = (state.walksCompleted||0) + 1;
    bumpOwnerLoad(2);
    log(note);
    save();
  }
  function doSafeActivity(activityId){
    var act = safeActivityById(activityId);
    applyPlayOutcome(act.text(state.name));
    view = "home"; render();
  }
  function startGpsWalk(){
    var breed = byId(state.breedId);
    walkCtx = { mode:"gps", watchId:null, distance:0, lastPos:null, target: Math.round(breed.walkMinutes*80) };
    view = "walkGps"; render();
    walkCtx.watchId = navigator.geolocation.watchPosition(onWalkPos, onWalkErr, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }
  // Ending the walk asks for confirmation rather than applying the outcome straight away —
  // a person reviews what was measured before it's logged, per the "no GPS gotchas" rule.
  function requestGpsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    if (walkCtx.watchId != null) { navigator.geolocation.clearWatch(walkCtx.watchId); walkCtx.watchId = null; }
    view = "walkConfirm"; render();
  }
  function onWalkPos(pos){
    if (!walkCtx) return;
    var c = pos.coords;
    if (walkCtx.lastPos){
      var d = haversine(walkCtx.lastPos.latitude, walkCtx.lastPos.longitude, c.latitude, c.longitude);
      if (d > 2 && d < 100) walkCtx.distance += d;
    }
    walkCtx.lastPos = c;
    if (view === "walkGps"){
      var pct = Math.min(100, Math.round(walkCtx.distance/walkCtx.target*100));
      var bar = document.getElementById("walk-bar");
      var label = document.getElementById("walk-dist");
      if (bar) bar.style.width = pct + "%";
      if (label) label.textContent = Math.round(walkCtx.distance) + " m / " + walkCtx.target + " m";
    }
  }
  function onWalkErr(){
    finishGpsWalk(true, false);
  }
  function finishGpsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    var dist = Math.round(walkCtx.distance);
    var fraction = walkCtx.distance / walkCtx.target;
    if (walkCtx.watchId != null) navigator.geolocation.clearWatch(walkCtx.watchId);
    var note;
    if (errored) { note = "Walked " + state.name + " (GPS signal lost — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — GPS confirmed " + dist + "m.";
    else note = "Cut the walk short with " + state.name + " — only " + dist + "m confirmed.";
    applyWalkOutcome(fraction, note);
    walkCtx = null;
    view = "home"; render();
  }

  function startStepsWalk(){
    var breed = byId(state.breedId);
    walkCtx = { mode:"steps", steps:0, filtered:9.8, lastStepTime:0, activeSeconds:0, goalMinutes: breed.walkMinutes };
    view = "walkSteps"; render();
    function attach(){
      window.addEventListener("devicemotion", onStepMotion);
    }
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
      DeviceMotionEvent.requestPermission().then(function(resp){
        if (resp === "granted") attach();
        else finishStepsWalk(true, false);
      }).catch(function(){ finishStepsWalk(true, false); });
    } else if (typeof DeviceMotionEvent !== "undefined"){
      attach();
    } else {
      finishStepsWalk(true, false);
    }
  }
  function requestStepsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    stopLiveTimer();
    view = "walkConfirm"; render();
  }
  function onStepMotion(e){
    if (!walkCtx || walkCtx.mode !== "steps") return;
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x == null) return;
    var mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    walkCtx.filtered = walkCtx.filtered*0.9 + mag*0.1;
    var delta = mag - walkCtx.filtered;
    var now = Date.now();
    if (delta > 1.2 && (now - walkCtx.lastStepTime) > 300){
      walkCtx.steps++;
      walkCtx.lastStepTime = now;
      var countEl = document.getElementById("walk-steps-count");
      if (countEl) countEl.textContent = walkCtx.steps + " steps detected";
    }
  }
  function finishStepsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    var steps = walkCtx.steps;
    var minutesWalked = Math.round(walkCtx.activeSeconds/60);
    var fraction = Math.max(0, Math.min(1, walkCtx.activeSeconds/(walkCtx.goalMinutes*60)));
    var note;
    if (errored) { note = "Walked " + state.name + " (motion access unavailable — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — " + minutesWalked + " of " + walkCtx.goalMinutes + " min, " + steps + " steps.";
    else note = "Cut the walk short with " + state.name + " — only " + minutesWalked + " of " + walkCtx.goalMinutes + " min.";
    applyWalkOutcome(fraction, note);
    walkCtx = null;
    stopLiveTimer();
    view = "home"; render();
  }

  // ---------- at-work live clock ----------
  var atWorkInterval = null;
  function checkAwayAlert(){
    if (!state.away || state.away.awayAlerted) return;
    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    var tolerance = computeTolerance(breed, stage, housing);
    var elapsed = (Date.now() - state.away.leaveStart)/HOUR;
    if (elapsed <= tolerance) return;
    state.away.awayAlerted = true;
    log(state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.");
    save();
    var alertEl = document.getElementById("atwork-alert");
    if (alertEl) alertEl.innerHTML = anxietyAlertHtml();
    if (state.settings.notifications && ("Notification" in window) && Notification.permission === "granted"){
      try { new Notification("The 30-Day Dog", { body: state.name + "'s anxiety is climbing. " + housingRiskNote(housing), tag: "anxiety-alert" }); } catch(e){}
    }
  }

  function startAtWorkClock(){
    stopLiveTimer();
    checkAwayAlert();
    atWorkInterval = setInterval(function(){
      if (view !== "atWork" || !state.away) { stopLiveTimer(); return; }
      var away = state.away;
      var remaining = away.declaredHours*HOUR - (Date.now() - away.leaveStart);
      var clockEl = document.getElementById("atwork-clock");
      var labelEl = document.getElementById("atwork-label");
      if (clockEl) clockEl.textContent = fmtClock(Math.abs(remaining));
      if (labelEl) labelEl.textContent = remaining > 0 ? "Due home in" : "Overdue by";
      checkAwayAlert();
    }, 1000);
  }
  function stopLiveTimer(){
    if (atWorkInterval) clearInterval(atWorkInterval);
    atWorkInterval = null;
  }
  function startStepsClock(){
    stopLiveTimer();
    atWorkInterval = setInterval(function(){
      if (view !== "walkSteps" || !walkCtx){ stopLiveTimer(); return; }
      var moving = (Date.now() - walkCtx.lastStepTime) < 20000; // counts a step within the last 20s as "still walking"
      if (moving) walkCtx.activeSeconds++;
      var goalSec = walkCtx.goalMinutes*60;
      var pct = Math.min(100, Math.round(walkCtx.activeSeconds/goalSec*100));
      var numEl = document.getElementById("ring-num");
      if (numEl) numEl.textContent = pad2(Math.floor(walkCtx.activeSeconds/60)) + ":" + pad2(walkCtx.activeSeconds%60);
      var circle = document.getElementById("ring-progress");
      if (circle){
        var r = 66, c = 2*Math.PI*r;
        circle.style.strokeDashoffset = (c - pct/100*c);
      }
    }, 1000);
  }

  // ---------- home live tick ----------
  setInterval(function(){
    if (state && view === "home"){
      tickHome(Date.now());
      checkNotify();
      maybeInterceptView();
      render();
    }
  }, 20000);

  // ---------- init ----------
  function init(){
    state = load();
    if (!state){
      view = "onboarding";
      render();
      return;
    }
    if (!state.settings) state.settings = { notifications:false, gpsWalks:false, stepWalks:false };
    if (state.settings.stepWalks === undefined) state.settings.stepWalks = false;
    if (!state.lastNotified) state.lastNotified = { hunger:0, bladder:0, energy:0 };
    if (!state.housingId) state.housingId = HOUSING[1].id;
    if (state.lastHomeAccidentAt === undefined) state.lastHomeAccidentAt = 0;
    if (state.lastPositiveMomentAt === undefined) state.lastPositiveMomentAt = 0;
    if (state.typicalHoursAway === undefined) state.typicalHoursAway = 4;
    if (state.lastPhaseLabel === undefined) state.lastPhaseLabel = tripPhaseFor(Math.min(30, tripDay()+1)).label;
    if (state.ownerLoad === undefined) state.ownerLoad = 20;
    if (state.walksCompleted === undefined) state.walksCompleted = 0;
    if (state.accidentsCount === undefined) state.accidentsCount = 0;
    if (state.totalHoursAway === undefined) state.totalHoursAway = 0;
    if (state.checkpointShownDay === undefined) state.checkpointShownDay = 0;
    if (state.away && state.away.awayAlerted === undefined) state.away.awayAlerted = false;
    if (state.away){
      var now = Date.now();
      var elapsed = now - state.away.leaveStart;
      if (elapsed >= state.away.declaredHours*HOUR){
        var report = resolveAway(now);
        window.__lastReport = report;
        view = "awayReport";
      } else {
        view = "atWork";
      }
    } else {
      tickHome(Date.now());
      view = "home";
      maybeInterceptView();
    }
    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>

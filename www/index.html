<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DogTrial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3F5FC;
    --card:#FFFFFF;
    --card-2:#EEF1FA;
    --ink:#20232F;
    --ink-soft:#6B7280;
    --ink-faint:#9AA1B2;
    --line:#E4E8F3;
    --accent:#5B6EF5;
    --accent-soft:#E7EAFD;
    --purple:#8B5CF6;
    --purple-soft:#F1EBFE;
    --teal:#14B8A6;
    --teal-soft:#E1F7F4;
    --warn:#F5A524;
    --warn-soft:#FEF1DA;
    --bad:#F0506E;
    --bad-soft:#FCE4EA;
    --shadow: 0 2px 6px rgba(32,35,47,.05), 0 14px 30px rgba(32,35,47,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141C;
      --card:#1B1E29;
      --card-2:#20242F;
      --ink:#EDEFF7;
      --ink-soft:#A7ACC0;
      --ink-faint:#6E7284;
      --line:#2A2E3C;
      --accent:#8B98FF;
      --accent-soft:#242A47;
      --purple:#B79CFF;
      --purple-soft:#2B2447;
      --teal:#4DD9C7;
      --teal-soft:#173A36;
      --warn:#FFC169;
      --warn-soft:#3A2B12;
      --bad:#FF8FA3;
      --bad-soft:#3A1E26;
      --shadow: 0 2px 6px rgba(0,0,0,.3), 0 14px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141C; --card:#1B1E29; --card-2:#20242F; --ink:#EDEFF7; --ink-soft:#A7ACC0;
    --ink-faint:#6E7284; --line:#2A2E3C; --accent:#8B98FF; --accent-soft:#242A47;
    --purple:#B79CFF; --purple-soft:#2B2447; --teal:#4DD9C7; --teal-soft:#173A36;
    --warn:#FFC169; --warn-soft:#3A2B12; --bad:#FF8FA3; --bad-soft:#3A1E26;
    --shadow: 0 2px 6px rgba(0,0,0,.3), 0 14px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  #app{width:100%; max-width:440px;}
  h1,h2,h3{font-family:"Poppins",system-ui,sans-serif; font-weight:700; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer; color:var(--ink);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mono{font-family:"Inter",system-ui,sans-serif; font-weight:600; font-variant-numeric:tabular-nums;}

  /* ---- brand strip ---- */
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:18px; color:var(--ink-soft);}
  .brand .mark{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .brand span{font-family:"Inter",system-ui,sans-serif; font-weight:700; font-size:11px; letter-spacing:.07em; text-transform:uppercase;}

  /* ---- cards / generic ---- */
  .card{
    background:var(--card);
    border:none;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:20px;
  }
  .card + .card{margin-top:14px;}
  .stack{display:flex; flex-direction:column; gap:14px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line); background:var(--card-2); color:var(--ink);
    border-radius:999px; padding:13px 18px; font-size:14.5px; font-weight:700;
    width:100%;
  }
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 8px 20px rgba(91,110,245,.35);}
  .btn-warn{background:var(--warn); border-color:var(--warn); color:#fff;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft); width:auto; padding:6px 8px; font-size:13px;}
  .row-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---- onboarding ---- */
  .intro p{color:var(--ink-soft); font-size:15px; max-width:52ch;}
  .field label{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; font-weight:700;}
  .field input[type=text]{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card-2); color:var(--ink); font-size:16px; font-family:inherit;
  }
  .breed-grid{display:flex; flex-direction:column; gap:10px;}
  .breed-card{
    border:1.5px solid var(--line); border-radius:18px; padding:14px; background:var(--card-2);
    text-align:left; display:flex; gap:12px; align-items:flex-start;
  }
  .breed-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .breed-card .name{font-weight:700; font-size:15px;}
  .breed-card .catch{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .traits{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .trait{font-family:"Inter",system-ui,sans-serif; font-weight:600; font-size:10.5px; color:var(--purple); background:var(--purple-soft); border:none; padding:4px 9px; border-radius:999px;}
  .house-risk{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft);}
  .house-risk-tag{display:block; font-weight:700; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--warn); margin-bottom:3px;}

  /* ---- cost breakdown ---- */
  .cost-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .cost-row b{font-family:"Inter",system-ui,sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cost-total{border-bottom:none; font-weight:600; margin-top:2px; padding-top:9px; border-top:1px dashed var(--line);}
  .challenge-list{margin:10px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-soft);}
  .challenge-list li{margin-bottom:6px; line-height:1.4;}
  .pup-thumb{flex:none; width:56px; height:56px; border-radius:50%; overflow:hidden;}
  .pup-thumb svg, .dog-portrait svg{width:100%; height:100%; display:block; object-fit:contain;}
  .pup-thumb img, .dog-portrait img{width:100%; height:100%; display:block; object-fit:cover;}

  /* ---- dashboard header ---- */
  .dog-head{display:flex; align-items:center; gap:14px;}
  .dog-portrait{width:104px; height:104px; flex:none; border-radius:50%; overflow:hidden;}
  .dog-id .name{font-size:22px; font-weight:700; font-family:"Poppins",system-ui,sans-serif;}
  .stage-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .badge{
    font-family:"Inter",system-ui,sans-serif; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; font-weight:700;
  }
  .badge.puppy{background:var(--accent-soft); color:var(--accent);}
  .badge.adolescent{background:var(--warn-soft); color:var(--warn);}
  .badge.adult{background:var(--teal-soft); color:var(--teal);}
  .badge.senior{background:var(--purple-soft); color:var(--purple);}
  .age{color:var(--ink-faint); font-size:13px;}
  .mood-chip{margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;}
  .mood-dot{width:8px; height:8px; border-radius:50%;}
  .day-label{color:var(--ink-faint); font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;}
  .next-label{font-family:"Poppins",system-ui,sans-serif; font-weight:700; font-size:22px; margin-top:2px;}

  /* ---- meters ---- */
  .meter-track{height:9px; border-radius:999px; background:var(--card-2); overflow:hidden;}
  .meter-fill{height:100%; border-radius:999px; transition:width .4s ease;}

  .section-title{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:12px;}

  /* ---- stat tiles (wellness-style) ---- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat-tile{background:var(--card-2); border-radius:18px; padding:14px;}
  .stat-tile .stat-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:8px;}
  .stat-tile .stat-value{font-family:"Poppins",system-ui,sans-serif; font-size:20px; font-weight:700; line-height:1;}
  .stat-tile .stat-label{color:var(--ink-soft); font-size:12px; margin-top:3px;}

  /* ---- training ---- */
  .cmd-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .cmd-row:last-child{border-bottom:none;}
  .cmd-name{font-size:14px; font-weight:600; width:110px; flex:none;}
  .cmd-bar{flex:1; height:7px; border-radius:999px; background:var(--card-2); overflow:hidden;}
  .cmd-fill{height:100%; background:var(--purple); border-radius:999px;}
  .cmd-btn{flex:none; font-size:12px; padding:7px 13px; width:auto; border-radius:999px;}

  .track-wrap{margin:22px 0 8px;}
  .track{position:relative; height:22px; border-radius:11px; background:var(--card-2); border:1px solid var(--line);}
  .zone{position:absolute; top:0; bottom:0; background:var(--accent-soft); border-left:2px solid var(--accent); border-right:2px solid var(--accent);}
  .marker{position:absolute; top:-5px; width:10px; height:32px; margin-left:-5px; background:var(--ink); border-radius:4px;}
  .round-dots{display:flex; gap:6px; justify-content:center; margin-top:16px;}
  .round-dots span{width:9px; height:9px; border-radius:50%; background:var(--card-2); border:1px solid var(--line);}
  .round-dots span.hit{background:var(--teal); border-color:var(--teal);}
  .round-dots span.miss{background:var(--bad); border-color:var(--bad);}

  /* ---- journal ---- */
  .j-entry{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .j-entry:last-child{border-bottom:none;}
  .j-time{flex:none; width:64px; color:var(--ink-faint); font-weight:700; font-size:11.5px; padding-top:1px;}
  .j-text{color:var(--ink);}

  .alert-banner{margin-top:14px; padding:10px 12px; border-radius:14px; background:var(--warn-soft); color:var(--warn); font-size:13px; text-align:left; font-weight:600;}

  /* ---- activity ring ---- */
  .ring-wrap{position:relative; width:152px; height:152px; margin:20px auto 0;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-num{font-size:26px; font-weight:700; line-height:1; font-family:"Poppins",system-ui,sans-serif;}
  .ring-goal{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* ---- settings ---- */
  .setting-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;}
  .setting-copy .title{font-weight:600; font-size:14px;}
  .setting-copy .caveat{color:var(--ink-soft); font-size:12px; margin-top:3px; line-height:1.5;}
  .switch{position:relative; display:inline-block; width:38px; height:22px; flex:none; margin-top:2px;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .slider{position:absolute; inset:0; background:var(--card-2); border:1px solid var(--line); border-radius:22px; transition:.15s;}
  .switch .slider:before{content:""; position:absolute; height:16px; width:16px; left:2px; top:2px; background:var(--ink-faint); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--accent-soft); border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(15px); background:var(--accent);}

  .center{text-align:center;}
  .muted{color:var(--ink-soft); font-size:14px;}
  .big-num{font-family:"Poppins",system-ui,sans-serif; font-size:40px; font-weight:700;}

  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .reset-confirm{display:flex; align-items:center; gap:8px;}

  /* ---- bottom tab bar ---- */
  .tab-bar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .tab-bar-inner{pointer-events:auto; width:100%; max-width:440px; margin:0 14px; display:flex; background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); gap:2px;}
  .tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; border:none; padding:6px 2px; border-radius:14px; color:var(--ink-faint); font-size:10px; font-weight:700; font-family:"Inter",system-ui,sans-serif;}
  .tab-btn .tab-icon{font-size:17px; line-height:1;}
  .tab-btn.active{color:var(--accent); background:var(--accent-soft);}

  @media (prefers-reduced-motion: reduce){
    .meter-fill, .cmd-fill{transition:none;}
  }
</style>

</head>

      var restlessText = state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.";

      timeline.push({ ts: restlessTs, text: restlessText });
    }
    if (incidents.length > 0){
      var windowMs = Math.max(1, now - (away.leaveStart + toleranceMs));
      incidents.forEach(function(inc, i){
        var ts = away.leaveStart + toleranceMs + windowMs * ((i+1) / (incidents.length+1));
        var text = state.name + " " + inc.text + ".";
        logAt(ts, text);
        timeline.push({ ts: ts, text: text });
      });
    }
    if (crateOverage > 0){
      var crateText = state.name + " spent " + fmtHours(crateOverage) + " past the recommended crate-time limit.";
      log(crateText);
      timeline.push({ ts: now, text: crateText });
    }
    var homeText = (incidents.length===0 && crateOverage===0)
      ? state.name + " handled " + fmtHours(actualHours) + " alone just fine."
      : "You're home. " + state.name + " is excited to see you.";
    log(homeText);
    timeline.push({ ts: now, text: homeText });
    save();

    return { actualHours: actualHours, declaredHours: away.declaredHours, tolerance: tolerance, incidents: incidents,
      houseTrained: houseTrained, wellTrained: wellTrained, hadRisk: excess>0, housing: housing, crateOverage: crateOverage,
      timeline: timeline };
  }

  function checkNotify(){
    if (!state || !state.settings.notifications || !("Notification" in window) || Notification.permission !== "granted") return;
    var checks = [["hunger","is hungry"],["bladder","needs a walk, badly"],["energy","has too much pent-up energy"]];
    checks.forEach(function(pair){
      var key = pair[0];
      if (state[key] < 20 && Date.now() - (state.lastNotified[key]||0) > 2*HOUR){
        try { new Notification("The 30-Day Dog", { body: state.name + " " + pair[1] + ".", tag: "need-"+key }); } catch(e){}
        state.lastNotified[key] = Date.now();
        save();
      }
    });
  }

  function moodOf(){
    var score = state.hunger*0.15 + state.bladder*0.15 + state.energy*0.15 + state.bond*0.3 + state.health*0.25;
    if (score>=78) return {label:"Content", key:"good"};
    if (score>=55) return {label:"Restless", key:"warn"};
    if (score>=32) return {label:"Distressed", key:"bad"};
    return {label:"Struggling", key:"bad"};
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function dayLabel(){
    var n = Math.max(1, tripDay()+1);
    var phase = tripPhaseFor(n);
    var now = new Date();
    var weekday = now.toLocaleDateString("en-US", { weekday:"long" });
    var monthDay = now.toLocaleDateString("en-US", { month:"long", day:"numeric" });
    return "Day " + Math.min(30, n) + " / 30 · " + phase.label + " · " + weekday + ", " + monthDay;

  // Picks the single most urgent thing the dog needs right now, from real decay rates —
  // not a dashboard of every meter, just what to do next.
  function computeNextAction(){
    var stage = stageOf(state.dogDays);
    var canWalk = canWalkOutside(state.dogDays);
    var fi = FEED_INTERVAL[stage], bi = BLADDER_INTERVAL[stage];

    function etaMinutes(val, intervalHours){
      if (!intervalHours) return Infinity;
      return Math.max(0, val * intervalHours / 100 * 60);
    }

    var hungerEta = etaMinutes(state.hunger, fi);
    var bladderEta = etaMinutes(state.bladder, bi);
    var energyEta = etaMinutes(state.energy, WALK_INTERVAL_HOURS);
    var outEta = Math.min(bladderEta, energyEta);
    var outIsBladder = bladderEta <= energyEta;

    var candidates = [
      { eta: hungerEta, label:"Feeding time", cta:"Feed " + esc(state.name), actionId:"feed" },
      { eta: outEta,
        label: outIsBladder ? "Bathroom break" : (canWalk ? "Walk" : "Safe activity"),
        cta: canWalk ? "Take her out" : "See safe activities",
        actionId: canWalk ? "walk" : "play" }
    ];
    candidates.sort(function(a,b){ return a.eta - b.eta; });
    var top = candidates[0];
    var minutes = Math.round(top.eta);

    var etaText;
    if (!isFinite(minutes)) etaText = "Not urgent right now";
    else if (minutes <= 0) etaText = "Due now";
    else if (minutes < 60) etaText = "in about " + minutes + " min";
    else etaText = "in about " + fmtHours(minutes/60);

    return { label: top.label, cta: top.cta, actionId: top.actionId, etaText: etaText };
  }

          var hh = (t.getHours()<10?"0":"")+t.getHours();

      '<div class="card">' +
        '<div class="top-actions" style="margin-bottom:6px;"><div class="section-title" style="margin-bottom:0">Journal</div><button class="btn-ghost" id="journal-btn">View all</button></div>' +

  function renderTabHealth(){
    var bladderComfort = clamp(100 - state.bladder);
    return '' +
      '<div class="card">' +
        '<div class="section-title">Wellness</div>' +
        '<div class="stat-grid">' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--accent-soft);">🍖</div><div class="stat-value">'+Math.round(state.hunger)+'%</div><div class="stat-label">Fed</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--teal-soft);">⚡</div><div class="stat-value">'+Math.round(state.energy)+'%</div><div class="stat-label">Energy</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--warn-soft);">🚽</div><div class="stat-value">'+Math.round(bladderComfort)+'%</div><div class="stat-label">Bladder comfort</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--purple-soft);">💗</div><div class="stat-value">'+Math.round(state.bond)+'%</div><div class="stat-label">Bond</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">House training — '+Math.round(state.houseTraining)+'%</div>' +
        '<div class="meter-track"><div class="meter-fill" style="width:'+state.houseTraining+'%; background:var(--accent)"></div></div>' +
        '<div class="cost-row" style="margin-top:12px; border-bottom:none;"><span>Accidents cleaned up</span><b>'+state.accidentsCount+'</b></div>' +
        '<p class="muted" style="font-size:12.5px;">It\'s normal for house training to take weeks — most puppies still have occasional accidents even with a consistent routine, especially before 4–5 months old.</p>' +
        '<div class="section-title" style="margin-top:6px; margin-bottom:4px;">Tip of the day</div>' +
        '<p class="muted" style="font-size:13px;">'+pottyTipForDay(tripDay())+'</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">Cleaning up properly</div>' +
        '<ul class="challenge-list">'+CLEANUP_TIPS.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ul>' +
      '</div>' +
      '<div class="card">' +
        '<div class="cost-row" style="border-bottom:none;"><span>Overall health</span><b>'+Math.round(state.health)+'%</b></div>' +
      '</div>';
  }

  function renderTabWalks(){
    var walkable = canWalkOutside(state.dogDays);
    return '' +
      '<div class="card">' +
        '<div class="stat-grid">' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--accent-soft);">🐾</div><div class="stat-value">'+state.walksCompleted+'</div><div class="stat-label">Walks / play sessions</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--teal-soft);">⏱️</div><div class="stat-value">'+fmtHours(state.totalHoursAway)+'</div><div class="stat-label">Hours away, total</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        (walkable ?
          '<button class="btn btn-primary" id="walk-btn">Walk</button>' :
          '<button class="btn btn-primary" id="play-btn">See safe activities</button>') +
        (walkable ? "" :
          '<p class="muted" style="margin-top:8px; font-size:12.5px;">Public walks locked — not fully vaccinated yet, real outdoor walks unlock around 3 months old. Until then: home play, socialization, and being carried outside for exposure without ground time.</p>') +
      '</div>';
  }

  function renderTabTraining(){
    var cooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
    var trainNote = cooldownLeft > 0 ? '<div class="muted mono" style="margin-top:12px; font-size:12px;">Next session available in '+fmtClock(cooldownLeft)+'</div>' : "";

    var programDay = Math.max(1, Math.min(30, tripDay()+1));
    var plan = trainingPlanForDay(programDay);
    var focus = COMMANDS.filter(function(c){ return c.id === plan.commandId; })[0];
    var info = COMMAND_INFO[focus.id];
    var tipsHTML = info.tips.map(function(t){ return '<li>'+t+'</li>'; }).join("");

    var otherRows = COMMANDS.filter(function(c){ return c.id !== focus.id; }).map(function(c){
      return '<div class="cmd-row"><div class="cmd-name">'+c.label+'</div>' +
        '<div class="cmd-bar"><div class="cmd-fill" style="width:'+state.training[c.id]+'%"></div></div>' +
        '<button class="btn btn-ghost cmd-btn" data-train="'+c.id+'" style="border:1px solid var(--line)">Train</button></div>';
    }).join("");

    return '' +
      '<div class="card">' +
        '<div class="section-title">Day '+programDay+' of 30 · '+plan.phase+'</div>' +
        '<div class="next-label" style="font-size:19px;">🧠 '+esc(focus.label)+'</div>' +
        '<p class="muted" style="margin-top:6px;">'+info.why+'</p>' +
        '<ul class="challenge-list" style="margin-top:10px;">'+tipsHTML+'</ul>' +
        '<p class="muted" style="margin-top:10px; font-size:13px;"><b>Today\'s session:</b> '+plan.detail+'</p>' +
        (info.keySentence ? '<p class="muted" style="margin-top:8px; font-size:13px; font-style:italic;">'+info.keySentence+'</p>' : "") +
        '<div class="cmd-bar" style="margin-top:14px;"><div class="cmd-fill" style="width:'+state.training[focus.id]+'%"></div></div>' +
        '<button class="btn btn-primary" data-train="'+focus.id+'" style="margin-top:12px;">Train '+esc(focus.label)+'</button>' +
        trainNote +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">Other commands</div>' +
        otherRows +
      '</div>';
  }

  function renderTabCosts(breed, realDaysElapsed){
    var costRunning = costSoFar(breed, realDaysElapsed);
    var foodSoFar = Math.round(estimateMonthlyFoodCost(breed) / 30 * Math.max(0, realDaysElapsed));
    return '' +
      '<div class="card">' +
        '<div class="section-title">Spent so far</div>' +
        '<div class="next-label">€'+costRunning+'</div>' +
        '<div class="cost-row" style="margin-top:10px;"><span>Vet visit + first 2 vaccines</span><b>€'+VET_STARTER_COST+'</b></div>' +
        '<div class="cost-row"><span>Starter gear — bed, collar &amp; leash, bowls, toys</span><b>€'+GEAR_STARTER_COST+'</b></div>' +
        '<div class="cost-row cost-total"><span>Food so far</span><b>€'+foodSoFar+'</b></div>' +
        '<p class="muted" style="margin-top:8px; font-size:12.5px;">Not the dog\'s stats — yours. How is this fitting into your life?</p>' +
      '</div>';
  }

  function renderTabLife(breed, housing){
    var stage = stageOf(state.dogDays);
    var fit = lifeFitMessage(breed, housing, stage, state.typicalHoursAway);
    var realDaysElapsed = (Date.now() - state.startedAt) / (24*HOUR);
    var longest = longestAwaySession();
    var incidentLine = incidentSummaryLine();
    return '' +
      '<div class="card">' +
        '<div class="section-title">Dog × Home × Life</div>' +
        '<p class="muted" style="margin-top:2px;">'+fit+'</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">Your pattern</div>' +
        (longest > 0 ? '<p class="muted">Longest single stretch away so far: <b>'+fmtHours(longest)+'</b>.</p>' : "") +
        '<p class="muted"'+(longest>0 ? ' style="margin-top:8px;"' : "")+'>'+esc(state.name)+' has been alone for <b>'+fmtHours(state.totalHoursAway)+'</b> in total across this trial.</p>' +
        '<p class="muted" style="margin-top:8px;">Real spend so far: <b>€'+costSoFar(breed, realDaysElapsed)+'</b>.</p>' +
        (incidentLine ? '<p class="muted" style="margin-top:8px;">'+incidentLine+'</p>' : '<p class="muted" style="margin-top:8px;">No incidents logged yet — early days.</p>') +
      '</div>' +
      renderSettingsCard() +
      '<div class="card">' +
        '<div class="section-title">In case of emergency</div>' +
        '<p class="muted" style="font-size:13px;">Toxic foods, your vet\'s number, and medical notes — handy for you or a sitter.</p>' +
        '<button class="btn btn-primary" id="emergency-btn" style="margin-top:12px;">Open emergency &amp; sitter info</button>' +
      '</div>';
  }

  function renderTabReport(){
    var day = tripDay();
    var score = compatibilityScore();
    var label = compatibilityLabel(score);
    var challengeItems = topChallenges(2).map(function(c){
      return '<li>'+challengeDescription(c.label)+'</li>';
    }).join("");
    var progress = Math.max(0, Math.min(100, Math.round(day/30*100)));
    return '' +
      '<div class="card">' +
        '<div class="section-title">Day '+Math.max(0, Math.min(day,30))+' of 30</div>' +
        '<div class="meter-track"><div class="meter-fill" style="width:'+progress+'%; background:var(--purple)"></div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">If the trial ended today</div>' +
        '<h2 style="margin-top:4px;">'+label+'</h2>' +
        '<ul class="challenge-list">'+challengeItems+'</ul>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">Look back</div>' +
        '<p class="muted" style="font-size:13px;">A day-by-day scrapbook of the trial so far.</p>' +
        '<button class="btn btn-primary" id="milestones-btn" style="margin-top:12px;">View milestones</button>' +
      '</div>' +
      (day >= 30 ?
        '<div class="card"><button class="btn btn-primary" id="report-tab-view30">See your full 30-day report</button></div>' :
        '<div class="card"><p class="muted">Full report unlocks on day 30.</p></div>');
  }

  function renderHome(){
    var breed = byId(state.breedId);
    var stage = stageOf(state.dogDays);
    var mood = moodOf();
    var weeks = Math.floor(state.dogDays/7);
    var days = Math.floor(state.dogDays%7);
    var housing = housingById(state.housingId);
    var realDaysElapsed = (Date.now() - state.startedAt) / (24*HOUR);

    var header = '' +
      '<div class="card">' +
        '<div class="top-actions">' +
          '<span class="day-label mono">'+dayLabel()+'</span>' +
          (resetConfirmOpen ?
            '<span class="reset-confirm">' +
              '<span class="muted" style="font-size:12px;">Start a new trial?</span>' +
              '<button class="btn-ghost" id="reset-confirm-btn" style="color:var(--bad)">Yes</button>' +
              '<button class="btn-ghost" id="reset-cancel-btn">Cancel</button>' +
            '</span>' :
            '<button class="btn-ghost" id="reset-btn">Start a new trial</button>') +
        '</div>' +
        '<div class="dog-head">' +
          '<div class="dog-portrait">'+dogVisual(breed, stage)+'</div>' +
          '<div class="dog-id">' +
            '<span class="badge '+stage+'">'+STAGE_LABEL[stage]+'</span>' +
            '<div class="name">'+esc(state.name)+'</div>' +
            '<div class="age mono">'+weeks+'w '+days+'d old · '+esc(breed.name)+'</div>' +
            '<div class="age" style="margin-top:2px;">'+esc(housing.short)+'</div>' +
            '<div class="mood-chip"><span class="mood-dot" style="background:'+(mood.key==="good"?"var(--accent)":mood.key==="warn"?"var(--warn)":"var(--bad)")+'"></span>'+mood.label+'</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var content;
    if (activeTab === "health") content = renderTabHealth();
    else if (activeTab === "walks") content = renderTabWalks();
    else if (activeTab === "training") content = renderTabTraining();
    else if (activeTab === "costs") content = renderTabCosts(breed, realDaysElapsed);
    else if (activeTab === "life") content = renderTabLife(breed, housing);
    else if (activeTab === "report") content = renderTabReport();
    else content = renderTabToday();

    return header + content + '<div style="height:84px"></div>' + renderTabBar();
  }

  function settingRow(id, title, caveat, checked){
    return '<div class="setting-row">' +
      '<div class="setting-copy"><div class="title">'+title+'</div><div class="caveat">'+caveat+'</div></div>' +
      '<label class="switch"><input type="checkbox" id="'+id+'" '+(checked?"checked":"")+'><span class="slider"></span></label>' +
    '</div>';
  }

  function renderSettingsCard(){
    var s = state.settings;
    return '' +
      '<div class="card">' +
        '<div class="section-title">Settings</div>' +
        settingRow("notif-toggle", "Reminders (best-effort)",
          "Uses your browser's notifications. Only fires while this tab is open or backgrounded — it can't wake a fully closed browser. Real background alerts need the native app in Phase 3.",
          s.notifications) +
        settingRow("steps-toggle", "Verify walks with steps",
          "Uses your phone's motion sensor to fill a ring only while you're actually moving, toward this breed's real walk length. An approximate pedometer, not as precise as a fitness tracker, but far more honest than a tap. iOS will ask for a motion-access permission the first time. On by default.",
          s.stepWalks) +
        settingRow("gps-toggle", "Verify walks with GPS",
          "Confirms you actually moved during a walk, using your device location only while a walk is active. Off by default.",
          s.gpsWalks) +
      '</div>';
  }

  function prepRow(label, ready, note){
    return '<div class="setting-row">' +
      '<div class="setting-copy">' +
        '<div class="title"><span class="mood-dot" style="background:'+(ready?"var(--accent)":"var(--warn)")+'; display:inline-block; margin-right:6px;"></span>'+esc(label)+'</div>' +
        '<div class="caveat">'+esc(note)+'</div>' +
      '</div>' +
    '</div>';
  }

  function renderLeaveSetup(){
    var canWalk = canWalkOutside(state.dogDays);
    var checklist = [
      { label:"Bathroom", ready: state.bladder >= 60,
        note: state.bladder >= 60 ? "Recently relieved." : "Bladder is low — an accident is more likely on a long day." },
      { label:"Food", ready: state.hunger >= 60,
        note: state.hunger >= 60 ? "Recently fed." : "Already hungry — that adds up over a long absence." },
      { label: canWalk ? "Exercise" : "Play",
        ready: state.energy >= 50,
        note: state.energy >= 50 ? "Had a chance to burn energy." : "Still has pent-up energy — restlessness sets in sooner." }
    ];
    var allReady = checklist.every(function(c){ return c.ready; });
    var rows = checklist.map(function(c){ return prepRow(c.label, c.ready, c.note); }).join("");
    var warning = allReady ? "" :
      '<p class="muted" style="margin-top:10px; font-size:12.5px; color:var(--warn);">Leaving before '+esc(state.name)+' is ready makes the day harder on both of you — you can still go.</p>';
    return '' +
      '<div class="card">' +
        '<h2>Leave '+esc(state.name)+' alone?</h2>' +
        '<div class="section-title" style="margin-top:16px;">Before you leave</div>' +
        rows +
        warning +
      '</div>' +
      '<div class="card">' +
        '<p class="muted">How many hours will '+esc(state.name)+' actually be alone?</p>' +
        '<div class="field" style="margin-top:14px">' +
          '<label for="hours-range">Hours away: <b id="hours-out" class="mono">'+state.typicalHoursAway+'h</b></label>' +
          '<input id="hours-range" type="range" min="1" max="12" step="1" value="'+state.typicalHoursAway+'" style="width:100%">' +
        '</div>' +
        '<button class="btn btn-warn" id="confirm-leave" style="margin-top:16px">Leave now</button>' +
        '<button class="btn btn-ghost" id="cancel-leave" style="margin-top:8px; width:100%;">Cancel</button>' +
      '</div>';
  }

  function renderSafeActivities(){
    var cards = SAFE_ACTIVITIES.map(function(a){
      return '<button class="breed-card" data-activity="'+a.id+'">' +
        '<div><div class="name">'+esc(a.label)+'</div>' +
        '<div class="catch">'+esc(a.note)+'</div></div>' +
        '</button>';
    }).join("");
    return '' +
      '<div class="card">' +
        '<div class="section-title">Public walks locked</div>' +
        '<h2 style="margin-top:4px;">'+esc(state.name)+' isn\'t ready for public walks yet</h2>' +
        '<p class="muted" style="margin-top:8px;">Not fully vaccinated — real outdoor walks unlock around 3 months old. Until then, here\'s what actually helps.</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">Choose an activity</div>' +
        '<div class="breed-grid">'+cards+'</div>' +
      '</div>' +
      '<div class="card">' +
        '<button class="btn btn-ghost" id="safe-activities-back" style="width:100%; border:1px solid var(--line);">Back</button>' +
      '</div>';
  }

  function anxietyAlertHtml(){
    var housing = housingById(state.housingId);
    return '<div class="alert-banner">Anxiety is climbing — '+esc(housingRiskNote(housing))+'</div>';
  }

  function renderAtWork(){
    var away = state.away;
    var remaining = away.declaredHours*HOUR - (Date.now() - away.leaveStart);
    var label = remaining > 0 ? "Due home in" : "Overdue by";
    return '' +
      '<div class="card center">' +
        '<div class="section-title">At work</div>' +
        '<p class="muted">'+esc(state.name)+' is home alone.</p>' +
        '<div class="big-num mono" id="atwork-clock">'+fmtClock(Math.abs(remaining))+'</div>' +
        '<div class="muted" id="atwork-label">'+label+'</div>' +
        '<div id="atwork-alert">'+(away.awayAlerted ? anxietyAlertHtml() : "")+'</div>' +
        '<button class="btn btn-primary" id="im-back" style="margin-top:20px">I’m back</button>' +
      '</div>';
  }

  function renderAwayReport(report){
    var breed = byId(state.breedId);
    var timelineHtml = report.timeline.map(function(ev){
      var t = new Date(ev.ts);
      var hh = (t.getHours()<10?"0":"")+t.getHours();
      var mm = (t.getMinutes()<10?"0":"")+t.getMinutes();
      return '<div class="j-entry"><div class="j-time mono">'+hh+':'+mm+'</div><div class="j-text">'+esc(ev.text)+'</div></div>';
    }).join("");
    var footnotes = "";
    if (report.hadRisk && report.houseTrained) footnotes += '<p class="muted" style="margin-top:10px; font-size:12.5px;">Solid house-training kept any accident off the list.</p>';
    if (report.hadRisk && report.wellTrained) footnotes += '<p class="muted" style="margin-top:6px; font-size:12.5px;">Training paid off — a well-trained dog copes calmer alone, so fewer things went wrong than the hours alone would suggest.</p>';
    if (report.crateOverage > 0) footnotes += '<p class="muted" style="margin-top:6px; font-size:12.5px; color:var(--bad);">This is where crate use turns into a welfare risk, not just an inconvenience.</p>';
    return '' +
      '<div class="card">' +
        '<div class="section-title">Welcome home</div>' +
        '<h2>Away '+fmtHours(report.actualHours)+' — said '+fmtHours(report.declaredHours)+'</h2>' +
        '<p class="muted">'+esc(breed.name)+' can comfortably handle about '+fmtHours(report.tolerance)+' alone at this age ('+esc(report.housing.label)+').</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-title">What happened</div>' +
        timelineHtml +
        footnotes +
      '</div>' +
      '<div class="card">' +
        '<button class="btn btn-primary" id="ack-report">Back to '+esc(state.name)+'</button>' +
      '</div>';
  }

  function renderWalkGps(){
    var breed = byId(state.breedId);
    var target = walkCtx ? walkCtx.target : Math.round(breed.walkMinutes*80);
    return '' +
      '<div class="card center">' +
        '<div class="section-title">Walking '+esc(state.name)+'</div>' +
        '<p class="muted">Move around outside — this tracks real distance with your device location, aiming for roughly a '+breed.walkMinutes+'-minute walk.</p>' +
        '<div class="big-num mono" id="walk-dist">0 m / '+target+' m</div>' +
        '<div class="meter-track" style="margin-top:6px;"><div class="meter-fill" id="walk-bar" style="width:0%; background:var(--accent)"></div></div>' +
        '<button class="btn btn-primary" id="end-walk" style="margin-top:20px">End walk</button>' +
        '<p class="muted" style="margin-top:12px; font-size:12px;">Keep DogTrial open and your screen on during the walk — tracking pauses if your phone locks or you switch apps.</p>' +
      '</div>';
  }

  function ringSVG(pct){
    var r = 66, c = 2*Math.PI*r;
    var offset = c - Math.max(0, Math.min(100, pct))/100*c;
    return '<svg width="152" height="152" viewBox="0 0 152 152">' +
      '<circle cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--card-2)" stroke-width="14"/>' +
      '<circle id="ring-progress" cx="76" cy="76" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="14" ' +
        'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" ' +
        'transform="rotate(-90 76 76)" style="transition:stroke-dashoffset .3s ease;"/>' +
      '</svg>';
  }

  function pad2(n){ return (n<10?"0":"")+n; }

  function renderWalkSteps(){
    var breed = byId(state.breedId);
    var goalMin = walkCtx ? walkCtx.goalMinutes : breed.walkMinutes;
    var activeSec = walkCtx ? walkCtx.activeSeconds : 0;
    var steps = walkCtx ? walkCtx.steps : 0;
    var pct = Math.min(100, Math.round(activeSec/(goalMin*60)*100));
    return '' +
      '<div class="card center">' +
        '<div class="section-title">Walking '+esc(state.name)+'</div>' +
        '<p class="muted">Keep moving — the ring only fills while you\'re actually walking, up to a real '+goalMin+' minutes for this breed.</p>' +
        '<div class="ring-wrap">' + ringSVG(pct) +
          '<div class="ring-center"><div class="ring-num mono" id="ring-num">'+pad2(Math.floor(activeSec/60))+':'+pad2(activeSec%60)+'</div><div class="ring-goal mono">of '+goalMin+' min</div></div>' +
        '</div>' +
        '<div class="muted mono" id="walk-steps-count" style="margin-top:12px; font-size:12.5px;">'+steps+' steps detected</div>' +
        '<button class="btn btn-primary" id="end-walk" style="margin-top:16px">End walk</button>' +
        '<p class="muted" style="margin-top:12px; font-size:12px;">Keep DogTrial open and your screen on during the walk — tracking pauses if your phone locks or you switch apps.</p>' +
      '</div>';
  }

  function renderMilestones(){
    var breed = byId(state.breedId);
    var day = tripDay();
    var realDaysElapsed = (Date.now() - state.startedAt) / (24*HOUR);
    var avgTraining = Math.round(COMMANDS.reduce(function(s,c){ return s + state.training[c.id]; }, 0) / COMMANDS.length);

    var groups = [];
    state.journal.forEach(function(j){
      var key = new Date(j.ts).toDateString();
      var group = groups.length && groups[groups.length-1].key === key ? groups[groups.length-1] : null;
      if (!group){ group = { key:key, ts:j.ts, entries:[] }; groups.push(group); }
      group.entries.push(j);
    });
    // state.journal is already newest-first, but entries can be inserted out of
    // chronological order (see logAt) — grouping by run assumes the common case;
    // an out-of-order backdated entry just lands in the nearest matching group or starts a new one.

    var groupsHTML = groups.map(function(g){
      var d = new Date(g.ts);
      var weekday = d.toLocaleDateString("en-US", { weekday:"long" });
      var monthDay = d.toLocaleDateString("en-US", { month:"long", day:"numeric" });
      var entries = g.entries.map(function(j){
        var isMilestone = j.text.indexOf("✓") === 0;
        return '<div class="j-entry"><div class="j-time">'+timeAgo(j.ts)+'</div>' +
          '<div class="j-text"'+(isMilestone ? ' style="color:var(--accent); font-weight:600;"' : '')+'>'+esc(j.text)+'</div></div>';
      }).join("");
      return '<div class="card">' +
        '<div class="section-title">'+weekday+', '+monthDay+'</div>' +
        entries +
      '</div>';
    }).join("");

    return '' +
      '<div class="card">' +
        '<div class="top-actions"><h2 style="font-size:19px">Milestones</h2><button class="btn-ghost" id="back-home">Back</button></div>' +
        '<p class="muted">'+esc(state.name)+'\'s 30-day rehearsal, day by day. Highlighted lines are completed actions.</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="stat-grid">' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--purple-soft);">📅</div><div class="stat-value">'+Math.min(30, Math.max(0,day))+'/30</div><div class="stat-label">Days in</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--accent-soft);">🐾</div><div class="stat-value">'+state.walksCompleted+'</div><div class="stat-label">Walks</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--teal-soft);">🎓</div><div class="stat-value">'+avgTraining+'%</div><div class="stat-label">Avg. training</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--warn-soft);">💶</div><div class="stat-value">€'+costSoFar(breed, realDaysElapsed)+'</div><div class="stat-label">Spent so far</div></div>' +
        '</div>' +
      '</div>' +
      (groupsHTML || '<div class="card"><div class="muted">Nothing logged yet.</div></div>');
  }

        state = newDog(name, pendingBreed, pendingHousing, startStage.startDogDays);

        view = "home";
        render();

  function onQuizSubmit(){
    var c = quizCtx;
    if (!c || c.answers.indexOf(null) !== -1) return;
    var breed = byId(state.breedId);
    var correct = c.questions.filter(function(item, i){ return c.answers[i] === item.correct; }).length;
    var total = c.questions.length;
    var ratio = correct/total;
    var cmd = COMMANDS.filter(function(x){return x.id===c.commandId;})[0];
    state.training[c.commandId] = clamp(state.training[c.commandId] + ratio*(5+breed.trainability));
    state.bond = clamp(state.bond + ratio*3);
    state.energy = clamp(state.energy - 10);
    var isPuppy = stageOf(state.dogDays) === "puppy";
    if (isPuppy) state.bladder = clamp(state.bladder - 15);
    state.lastTrainedAt = Date.now();
    var checkmark = ratio>=0.66 ? "✓ " : "";
    var resultWord = ratio>=0.66 ? "went well" : ratio>0 ? "was mixed" : "needs another look";
    log(checkmark + cmd.label + " practiced — quiz " + correct + "/" + total + " correct, session " + resultWord + "." + (isPuppy ? " Playtime like this means another bathroom trip soon." : ""));
    bumpOwnerLoad(2);
    save();
    quizCtx = null;
    view = "home";
    render();
  }

  // ---------- walks ----------
  var walkCtx = null;

  // Screen Wake Lock: without it, iOS/Android auto-locks the screen mid-walk and
  // both the devicemotion listener (steps) and the GPS watch effectively freeze,
  // so the walk silently stops counting. Re-requested on visibilitychange because
  // the OS releases the lock the moment the page is backgrounded any other way
  // (switching apps, manually pressing the power button), and a fresh request is
  // needed once the user comes back while still mid-walk.
  var wakeLock = null;
  function requestWakeLock(){
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function(lock){
      wakeLock = lock;
      lock.addEventListener("release", function(){ wakeLock = null; });
    }).catch(function(){ wakeLock = null; });
  }
  function releaseWakeLock(){
    if (wakeLock){
      wakeLock.release().catch(function(){});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && walkCtx && (walkCtx.mode === "steps" || walkCtx.mode === "gps") && !wakeLock){
      requestWakeLock();
    }
  });

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d*Math.PI/180; };
    var dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function applyWalkOutcome(fraction, note){
    fraction = Math.max(0.15, Math.min(1, fraction));
    state.bladder = 100;
    state.energy = clamp(state.energy + fraction*(100-state.energy));
    state.bond = clamp(state.bond + fraction*3);
    state.houseTraining = clamp(state.houseTraining + fraction*2);
    state.walksCompleted = (state.walksCompleted||0) + 1;
    bumpOwnerLoad(3);
    log(note);
    save();
  }
  function doManualWalk(){
    applyWalkOutcome(1, "Walked " + state.name + ".");
    view = "home"; render();
  }
  function applyPlayOutcome(note){
    state.bladder = 100;
    state.energy = clamp(state.energy + 0.5*(100-state.energy));
    state.bond = clamp(state.bond + 4);
    state.houseTraining = clamp(state.houseTraining + 1);
    state.walksCompleted = (state.walksCompleted||0) + 1;
    bumpOwnerLoad(2);
    log(note);
    save();
  }
  function doSafeActivity(activityId){
    var act = safeActivityById(activityId);
    applyPlayOutcome(act.text(state.name));
    view = "home"; render();
  }
  function startGpsWalk(){
    var breed = byId(state.breedId);
    walkCtx = { mode:"gps", watchId:null, distance:0, lastPos:null, target: Math.round(breed.walkMinutes*80) };
    view = "walkGps"; render();
    requestWakeLock();
    walkCtx.watchId = navigator.geolocation.watchPosition(onWalkPos, onWalkErr, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }
  // Ending the walk asks for confirmation rather than applying the outcome straight away —
  // a person reviews what was measured before it's logged, per the "no GPS gotchas" rule.
  function requestGpsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    if (walkCtx.watchId != null) { navigator.geolocation.clearWatch(walkCtx.watchId); walkCtx.watchId = null; }
    releaseWakeLock();
    view = "walkConfirm"; render();
  }
  function onWalkPos(pos){
    if (!walkCtx) return;
    var c = pos.coords;
    if (walkCtx.lastPos){
      var d = haversine(walkCtx.lastPos.latitude, walkCtx.lastPos.longitude, c.latitude, c.longitude);
      if (d > 2 && d < 100) walkCtx.distance += d;
    }
    walkCtx.lastPos = c;
    if (view === "walkGps"){
      var pct = Math.min(100, Math.round(walkCtx.distance/walkCtx.target*100));
      var bar = document.getElementById("walk-bar");
      var label = document.getElementById("walk-dist");
      if (bar) bar.style.width = pct + "%";
      if (label) label.textContent = Math.round(walkCtx.distance) + " m / " + walkCtx.target + " m";
    }
  }
  function onWalkErr(){
    finishGpsWalk(true, false);
  }
  function finishGpsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    var dist = Math.round(walkCtx.distance);
    var fraction = walkCtx.distance / walkCtx.target;
    if (walkCtx.watchId != null) navigator.geolocation.clearWatch(walkCtx.watchId);
    releaseWakeLock();
    var note;
    if (errored) { note = "Walked " + state.name + " (GPS signal lost — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — GPS confirmed " + dist + "m.";
    else note = "Cut the walk short with " + state.name + " — only " + dist + "m confirmed.";
    applyWalkOutcome(fraction, note);
    walkCtx = null;
    view = "home"; render();
  }

  function startStepsWalk(){
    var breed = byId(state.breedId);
    walkCtx = { mode:"steps", steps:0, filtered:9.8, lastStepTime:0, activeSeconds:0, goalMinutes: breed.walkMinutes };
    view = "walkSteps"; render();
    requestWakeLock();
    function attach(){
      window.addEventListener("devicemotion", onStepMotion);
    }
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
      DeviceMotionEvent.requestPermission().then(function(resp){
        if (resp === "granted") attach();
        else finishStepsWalk(true, false);
      }).catch(function(){ finishStepsWalk(true, false); });
    } else if (typeof DeviceMotionEvent !== "undefined"){
      attach();
    } else {
      finishStepsWalk(true, false);
    }
  }
  function requestStepsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    stopLiveTimer();
    releaseWakeLock();
    view = "walkConfirm"; render();
  }
  function onStepMotion(e){
    if (!walkCtx || walkCtx.mode !== "steps") return;
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x == null) return;
    var mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    walkCtx.filtered = walkCtx.filtered*0.9 + mag*0.1;
    var delta = mag - walkCtx.filtered;
    var now = Date.now();
    if (delta > 1.2 && (now - walkCtx.lastStepTime) > 300){
      walkCtx.steps++;
      walkCtx.lastStepTime = now;
      var countEl = document.getElementById("walk-steps-count");
      if (countEl) countEl.textContent = walkCtx.steps + " steps detected";
    }
  }
  function finishStepsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    releaseWakeLock();
    var steps = walkCtx.steps;
    var minutesWalked = Math.round(walkCtx.activeSeconds/60);
    var fraction = Math.max(0, Math.min(1, walkCtx.activeSeconds/(walkCtx.goalMinutes*60)));
    var note;
    if (errored) { note = "Walked " + state.name + " (motion access unavailable — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — " + minutesWalked + " of " + walkCtx.goalMinutes + " min, " + steps + " steps.";
    else note = "Cut the walk short with " + state.name + " — only " + minutesWalked + " of " + walkCtx.goalMinutes + " min.";
    applyWalkOutcome(fraction, note);
    walkCtx = null;
    stopLiveTimer();
    view = "home"; render();
  }

  // ---------- at-work live clock ----------
  var atWorkInterval = null;
  function checkAwayAlert(){
    if (!state.away || state.away.awayAlerted) return;
    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    var tolerance = computeTolerance(breed, stage, housing);
    var elapsed = (Date.now() - state.away.leaveStart)/HOUR;
    if (elapsed <= tolerance) return;
    state.away.awayAlerted = true;
    log(state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.");
    save();
    var alertEl = document.getElementById("atwork-alert");
    if (alertEl) alertEl.innerHTML = anxietyAlertHtml();
    if (state.settings.notifications && ("Notification" in window) && Notification.permission === "granted"){
      try { new Notification("The 30-Day Dog", { body: state.name + "'s anxiety is climbing. " + housingRiskNote(housing), tag: "anxiety-alert" }); } catch(e){}
    }
  }

  function startAtWorkClock(){
    stopLiveTimer();
    checkAwayAlert();
    atWorkInterval = setInterval(function(){
      if (view !== "atWork" || !state.away) { stopLiveTimer(); return; }
      var away = state.away;
      var remaining = away.declaredHours*HOUR - (Date.now() - away.leaveStart);
      var clockEl = document.getElementById("atwork-clock");
      var labelEl = document.getElementById("atwork-label");
      if (clockEl) clockEl.textContent = fmtClock(Math.abs(remaining));
      if (labelEl) labelEl.textContent = remaining > 0 ? "Due home in" : "Overdue by";
      checkAwayAlert();
    }, 1000);
  }
  function stopLiveTimer(){
    if (atWorkInterval) clearInterval(atWorkInterval);
    atWorkInterval = null;
  }
  function startStepsClock(){
    stopLiveTimer();
    atWorkInterval = setInterval(function(){
      if (view !== "walkSteps" || !walkCtx){ stopLiveTimer(); return; }
      var moving = (Date.now() - walkCtx.lastStepTime) < 20000; // counts a step within the last 20s as "still walking"
      if (moving) walkCtx.activeSeconds++;
      var goalSec = walkCtx.goalMinutes*60;
      var pct = Math.min(100, Math.round(walkCtx.activeSeconds/goalSec*100));
      var numEl = document.getElementById("ring-num");
      if (numEl) numEl.textContent = pad2(Math.floor(walkCtx.activeSeconds/60)) + ":" + pad2(walkCtx.activeSeconds%60);
      var circle = document.getElementById("ring-progress");
      if (circle){
        var r = 66, c = 2*Math.PI*r;
        circle.style.strokeDashoffset = (c - pct/100*c);
      }
    }, 1000);
  }

  // ---------- home live tick ----------
  setInterval(function(){
    if (state && view === "home"){
      tickHome(Date.now());
      checkNotify();
      maybeInterceptView();
      render();
    }
  }, 20000);

  // ---------- init ----------
  function init(){
    state = load();
    if (!state){
      view = "onboarding";
      render();
      return;
    }
    if (!state.settings) state.settings = { notifications:false, gpsWalks:false, stepWalks:false };
    if (state.settings.stepWalks === undefined) state.settings.stepWalks = false;
    if (!state.lastNotified) state.lastNotified = { hunger:0, bladder:0, energy:0 };
    if (!state.housingId) state.housingId = HOUSING[1].id;
    if (state.lastHomeAccidentAt === undefined) state.lastHomeAccidentAt = 0;
    if (state.lastPositiveMomentAt === undefined) state.lastPositiveMomentAt = 0;
    if (state.typicalHoursAway === undefined) state.typicalHoursAway = 4;
    if (state.lastPhaseLabel === undefined) state.lastPhaseLabel = tripPhaseFor(Math.min(30, tripDay()+1)).label;
    if (state.ownerLoad === undefined) state.ownerLoad = 20;
    if (state.walksCompleted === undefined) state.walksCompleted = 0;
    if (state.accidentsCount === undefined) state.accidentsCount = 0;
    if (state.totalHoursAway === undefined) state.totalHoursAway = 0;
    if (!state.awaySessions) state.awaySessions = [];
    if (!state.incidentTally) state.incidentTally = {};
    if (state.checkpointShownDay === undefined) state.checkpointShownDay = 0;
    if (!state.emergencyInfo) state.emergencyInfo = { vetName:"", vetPhone:"", allergies:"", microchipId:"" };
    if (state.away && state.away.awayAlerted === undefined) state.away.awayAlerted = false;
    if (state.away){
      var now = Date.now();
      var elapsed = now - state.away.leaveStart;
      if (elapsed >= state.away.declaredHours*HOUR){
        var report = resolveAway(now);
        window.__lastReport = report;
        view = "awayReport";
      } else {
        view = "atWork";
      }
    } else {
      tickHome(Date.now());
      view = "home";
      maybeInterceptView();
    }
    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DogTrial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FFFCF6;
    --card:#FFFFFF;
    --card-2:#F7F3E9;
    --surface-3:#F1EDE0;
    --border-elevated:#E7E1D2;
    --ink:#101B46;
    --ink-soft:#647088;
    --ink-faint:#9AA2B6;
    --line:#EAE5D9;
    --accent:#4B60FF;
    --accent-bright:#6577FF;
    --accent-dark:#3548E5;
    --accent-soft:rgba(75,96,255,.12);
    --purple:#8388F0;
    --purple-soft:rgba(131,136,240,.14);
    --teal:#2AAE85;
    --teal-soft:rgba(42,174,133,.14);
    --warn:#E27F1B;
    --warn-soft:rgba(226,127,27,.14);
    --bad:#E1495F;
    --bad-soft:rgba(225,73,95,.12);
    --tan:#AA7937;
    --tan-soft:#F6ECD8;
    --shadow: 0 2px 6px rgba(16,27,70,.07), 0 14px 30px rgba(16,27,70,.09);

    --grad-accent: linear-gradient(135deg, #6577FF, #3548E5);
    --grad-teal: linear-gradient(135deg, #4FD9A8, #1F9670);
    --grad-warn: linear-gradient(135deg, #FFC069, #E27F1B);
    --grad-bad: linear-gradient(135deg, #FF8FA0, #D13750);
    --grad-purple: linear-gradient(135deg, #A6ABF5, #6870E8);
    --glow-accent: 0 10px 24px -6px rgba(75,96,255,.45);
    --glow-teal: 0 10px 24px -6px rgba(42,174,133,.4);
    --glow-warn: 0 10px 24px -6px rgba(226,127,27,.4);
    --glow-bad: 0 10px 24px -6px rgba(225,73,95,.4);
    --glow-purple: 0 10px 24px -6px rgba(131,136,240,.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{
    font-family:"DM Sans",system-ui,sans-serif;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:max(28px, env(safe-area-inset-top,0px)) 14px 60px;
    touch-action:manipulation;
  }
  #app{width:100%; max-width:440px;}
  h1,h2,h3{font-family:"DM Serif Display",Georgia,serif; font-weight:700; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer; color:var(--ink);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mono{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-variant-numeric:tabular-nums;}

  /* ---- splash ---- */
  .splash{position:fixed; inset:0; z-index:30; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 32px; text-align:center;}
  .splash-portrait{position:relative; width:208px; height:208px; flex-shrink:0;}
  .splash-portrait-ring{position:absolute; inset:-7px; border-radius:999px; border:2px solid var(--accent); box-shadow:0 0 0 10px rgba(133,142,255,.1), 0 24px 48px rgba(133,142,255,.28); pointer-events:none;}
  .splash-portrait-photo{width:100%; height:100%; border-radius:999px; overflow:hidden; position:relative; background:var(--card-2);}
  .splash-portrait-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .splash-copy{margin-top:28px;}
  .splash-copy h1{font-weight:800; font-size:38px; margin-top:8px;}
  .splash-tagline{font-size:14px; color:var(--ink-soft); margin-top:10px; max-width:280px; line-height:1.5;}
  .splash-start-btn{
    margin-top:32px; width:260px; min-height:52px; border-radius:16px;
    background:var(--grad-accent); color:#fff; font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:15px;
    border:none; box-shadow:var(--glow-accent), 0 0 0 1px rgba(255,255,255,.08) inset;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; transition:filter 150ms ease, transform 150ms ease;
  }
  .splash-start-btn:active{filter:brightness(.9); transform:scale(.985);}

  /* ---- brand strip ---- */
  .brand{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .brand-wordmark{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:21px; color:var(--ink); letter-spacing:-.4px; line-height:1;}
  .brand-dayline{font-family:'DM Serif Display',Georgia,serif; font-weight:700; font-size:8.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-top:5px; line-height:1.35;}
  .brand-right{display:flex; align-items:center; gap:8px; flex:none; padding-top:1px;}
  .brand-bell{position:relative; background:none; border:none; color:var(--ink-soft); display:flex; align-items:center; padding:4px; cursor:pointer;}
  .brand .brand-bell-dot{position:absolute; top:-1px; right:-1px; background:var(--grad-bad); box-shadow:var(--glow-bad); color:#fff; font-size:9px; font-weight:800; letter-spacing:0; text-transform:none; min-width:14px; height:14px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .brand-avatar{width:24px; height:24px; border-radius:50%; overflow:hidden; flex:none; border:1.5px solid var(--card); box-shadow:0 0 0 1px var(--line);}
  .brand-avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  /* ---- dog moment bubble + expanded card ---- */
  .moment-bubble{position:fixed; left:16px; right:16px; bottom:100px; max-width:408px; margin:0 auto; z-index:25; background:var(--card-2); border:1px solid var(--border-elevated); border-radius:16px; padding:10px 12px; display:flex; align-items:flex-start; gap:10px; box-shadow:var(--shadow); animation:momentIn .25s ease;}
  .moment-bubble-icon{flex:none; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .moment-bubble-body{flex:1; min-width:0; cursor:pointer; background:none; border:none; text-align:left; padding:0; color:inherit;}
  .moment-bubble-label{font-size:9.5px; font-weight:800; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase;}
  .moment-bubble-title{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:13.5px; margin-top:2px; color:var(--ink);}
  .moment-bubble-close{flex:none; background:none; border:none; color:var(--ink-faint); padding:2px; cursor:pointer;}
  @keyframes momentIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .moment-overlay-backdrop{position:fixed; inset:0; background:rgba(6,8,15,.6); z-index:26;}
  .moment-card{position:fixed; left:16px; right:16px; bottom:0; max-width:408px; margin:0 auto; z-index:27; background:var(--card); border:1px solid var(--border-elevated); border-radius:20px 20px 0 0; box-shadow:var(--shadow); animation:momentCardIn .25s ease; overflow:hidden; min-height:48dvh; max-height:82dvh; display:flex; flex-direction:column;}
  .moment-card:focus-visible{outline:none;}
  .moment-card-photo{width:calc(100% + 36px); margin:0 -18px 14px; height:150px; object-fit:cover; display:block;}
  .moment-card-top{display:flex; align-items:center; gap:8px; flex:none; padding:20px 18px 0;}
  .moment-card-scroll{overflow-y:auto; overscroll-behavior:contain; padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));}
  .moment-card-label{font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; flex:1;}
  .moment-card-close{background:none; border:none; color:var(--ink-faint); padding:4px; cursor:pointer;}
  .moment-card-title{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:18px; margin-top:12px; color:var(--ink);}
  .moment-card-explain{font-size:13.5px; line-height:1.5; color:var(--ink-soft); margin-top:8px;}
  .moment-card-explain-label{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--warn); margin-top:10px; text-transform:uppercase;}
  .moment-card-whatto{margin-top:14px; background:var(--card-2); border-radius:14px; padding:12px 14px;}
  .moment-card-whatto-label{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--accent-bright); display:flex; align-items:center; gap:6px;}
  .moment-card-whatto-text{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  @keyframes momentCardIn{ from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

  /* ---- notification center ---- */
  .notif-filters{display:flex; gap:8px; flex-wrap:wrap;}
  .notif-filter-chip{border:1px solid var(--line); background:var(--card-2); color:var(--ink-soft); font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer;}
  .notif-filter-chip.active{background:var(--grad-accent); box-shadow:var(--glow-accent); color:#fff; border-color:transparent;}
  .notif-list{display:flex; flex-direction:column; gap:2px;}
  .notif-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:none; padding:10px 2px; cursor:pointer; border-bottom:1px solid var(--line);}
  .notif-row:last-child{border-bottom:none;}
  .notif-row-icon{flex:none; width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .notif-row-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .notif-row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .notif-row-title{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);}
  .notif-row-time{font-size:11px; color:var(--ink-faint); flex:none;}
  .notif-row-sub{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:14px; color:var(--ink); margin-top:2px;}
  .notif-unread-dot{flex:none; width:7px; height:7px; border-radius:50%; background:var(--accent-bright); box-shadow:var(--glow-accent);}
  .notif-row-chevron{flex:none; color:var(--ink-faint); font-size:18px;}

  /* ---- cards / generic ---- */
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%), var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 16px 36px -22px rgba(0,0,0,.65);
    padding:20px;
    position:relative;
  }
  .card + .card{margin-top:14px;}
  .stack{display:flex; flex-direction:column; gap:14px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--line); background:var(--card-2); color:var(--ink);
    border-radius:16px; padding:13px 18px; font-size:14.5px; font-weight:700;
    width:100%; min-height:52px; transition:filter 150ms ease, transform 150ms ease, background 150ms ease;
  }
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:active:not(:disabled){transform:scale(.985);}
  .btn-primary{
    background:var(--grad-accent); border-color:transparent; color:#fff; font-family:"DM Sans",system-ui,sans-serif;
    box-shadow: var(--glow-accent), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .btn-primary:active:not(:disabled){filter:brightness(.92);}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06); transform:translateY(-1px);}
  .btn-warn{background:var(--grad-warn); border-color:transparent; color:#241704; box-shadow: var(--glow-warn), 0 0 0 1px rgba(255,255,255,.08) inset; font-family:"DM Sans",system-ui,sans-serif;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft); width:auto; min-height:auto; padding:6px 8px; font-size:13px;}
  .btn-chip{
    display:inline-flex; align-items:center; gap:6px; width:auto; min-height:auto;
    background:var(--card-2); border:1px solid var(--line); color:var(--ink-soft);
    padding:9px 15px; font-size:12.5px; font-weight:600; border-radius:999px;
  }
  .btn-chip:active{background:var(--surface-3);}
  .btn-chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark);}
  .row-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---- onboarding: name step hero + suggestion chips ---- */
  .name-hero{border-radius:20px; overflow:hidden; aspect-ratio:3/2; position:relative; margin-bottom:14px; background:var(--card-2);}
  .name-hero img{width:100%; height:100%; object-fit:cover; display:block;}
  .name-hero-tag{
    position:absolute; right:14px; bottom:14px; max-width:65%;
    background:var(--grad-accent); color:#fff; padding:9px 16px; border-radius:12px;
    border:3px solid rgba(255,255,255,.55); font-family:'DM Serif Display',Georgia,serif; font-size:18px;
    transform:rotate(-4deg); box-shadow:0 6px 16px rgba(75,96,255,.35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .name-input-wrap{position:relative;}
  .name-input-wrap .heart-icon{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none;}
  .name-hint-row{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin:8px 2px 16px;}
  .name-suggest-label{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .name-chip-row{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---- real-dog Today: immersive hero + quick actions ---- */
  .real-hero{position:relative; border-radius:20px; overflow:hidden; aspect-ratio:16/11; margin-bottom:14px; background:var(--card-2);}
  .real-hero img{width:100%; height:100%; object-fit:cover; display:block;}
  .real-hero-overlay{position:absolute; inset:0; background:linear-gradient(0deg, rgba(16,27,70,.8), rgba(16,27,70,.05) 65%); display:flex; flex-direction:column; justify-content:flex-end; padding:20px;}
  .real-hero-pill{align-self:flex-start; background:rgba(255,255,255,.92); color:var(--accent-dark); font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:5px 11px; border-radius:999px;}
  .real-hero-overlay h1{color:#fff; font-size:25px; margin-top:10px; line-height:1.12;}
  .real-hero-overlay p{color:rgba(255,255,255,.85); font-size:13px; margin-top:4px;}
  .real-hero-days{margin-top:12px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3); border-radius:14px; padding:8px 14px; display:inline-block; color:#fff;}
  .real-hero-days strong{font-family:'DM Serif Display',Georgia,serif; font-size:22px; display:block; line-height:1;}
  .real-quick-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .real-quick-btn{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink);}
  .real-quick-btn .row-icon-tile{margin:0 auto;}

  /* ---- simulated Today: persistent hero photo that slides to a "sniffing"
     photo + caption for a few seconds, then slides back ---- */
  .today-hero{position:relative; border-radius:20px; overflow:hidden; aspect-ratio:16/10; margin-bottom:14px; background:var(--card-2);}
  .today-hero-layer{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease, opacity .6s ease;}
  .today-hero-default{transform:translateX(0); opacity:1; z-index:1;}
  .today-hero-sniff{transform:translateX(100%); opacity:0; z-index:2;}
  .today-hero.sniff-active .today-hero-default{transform:translateX(-100%); opacity:0;}
  .today-hero.sniff-active .today-hero-sniff{transform:translateX(0); opacity:1;}
  .today-hero-caption{position:absolute; left:0; right:0; bottom:0; padding:14px 16px; background:linear-gradient(0deg, rgba(16,27,70,.8), rgba(16,27,70,0) 75%); color:#fff; opacity:0; transition:opacity .6s ease; z-index:3;}
  .today-hero.sniff-active .today-hero-caption{opacity:1;}
  .today-hero-caption-label{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.9;}
  .today-hero-caption-text{font-size:12.5px; margin-top:3px; line-height:1.4;}

  /* ---- onboarding ---- */
  .intro p{color:var(--ink-soft); font-size:15px; max-width:52ch;}
  .field label{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; font-weight:700;}
  .field input[type=text]{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card-2); color:var(--ink); font-size:16px; font-family:inherit;
  }
  .breed-grid{display:flex; flex-direction:column; gap:10px;}
  .breed-card{
    border:1.5px solid var(--line); border-radius:18px; padding:14px; background:var(--card-2);
    text-align:left; display:flex; gap:12px; align-items:flex-start;
  }
  .breed-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .breed-card .name{font-weight:700; font-size:15px;}
  .breed-card .catch{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .traits{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .trait{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:10.5px; color:var(--purple); background:var(--purple-soft); border:none; padding:4px 9px; border-radius:999px;}
  .house-risk{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft);}
  .house-risk-tag{display:block; font-weight:700; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--warn); margin-bottom:3px;}
  .breed-search-row{display:flex; gap:8px; align-items:center; background:var(--card-2); border:1px solid var(--line); border-radius:999px; padding:0 14px; margin-bottom:10px; color:var(--ink-faint);}
  .breed-search-row input{flex:1; min-width:0; border:0; background:none; font-size:15px; padding:11px 0; color:var(--ink); font-family:inherit;}
  .breed-search-row input:focus{outline:none;}
  .breed-filter-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .breed-filter-pill{border:1px solid var(--line); background:var(--card-2); color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600;}
  .breed-filter-pill.active{background:var(--accent); border-color:transparent; color:#fff;}
  .breed-card-wrap{position:relative;}
  .breed-info-btn{position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:var(--card); border:1px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; z-index:2;}
  .breed-empty{grid-column:1/-1; padding:24px 8px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  /* ---- breed-picker step only: photo-first 2-column grid (mockup style) ---- */
  .breed-photo-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .breed-photo-card{
    border:1.5px solid var(--line); border-radius:16px; background:var(--card-2);
    text-align:left; display:block; width:100%; overflow:hidden;
  }
  .breed-photo-card.selected{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
  .breed-photo-card .breed-photo{width:100%; aspect-ratio:1.31; object-fit:cover; display:block; background:var(--card-2);}
  .breed-photo-card .name{font-family:'DM Serif Display',Georgia,serif; font-weight:700; font-size:15px; line-height:1.15; padding:9px 34px 0 10px;}
  .breed-photo-card .size-tag{display:block; font-size:11px; color:var(--ink-faint); padding:3px 10px 11px;}
  .breed-photo-tick{position:absolute; top:8px; left:8px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; z-index:2; border:2px solid #fff; font-size:13px;}

  /* ---- auth (sign up / log in) ---- */
  .auth-hero{
    display:grid; grid-template-columns:1.05fr .95fr; align-items:stretch;
    border-radius:20px; overflow:hidden; min-height:140px; margin-bottom:14px;
    background:linear-gradient(135deg, var(--card-2), var(--surface-3));
  }
  .auth-hero-copy{padding:18px 8px 16px 18px; display:flex; flex-direction:column; justify-content:center;}
  .auth-hero-copy h2{font-size:19px; line-height:1.18; margin:0;}
  .auth-hero-photo{position:relative; overflow:hidden; background:var(--surface-3);}
  .auth-hero-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .auth-eyebrow{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:2px;}
  .auth-subtitle{color:var(--ink-soft); font-size:14px; margin-top:4px;}
  .auth-label{display:block; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin:16px 0 7px; font-weight:700;}
  .auth-input-row{display:flex; align-items:center; gap:10px; min-height:52px; border:1px solid var(--line); border-radius:14px; background:var(--card-2); padding:0 14px;}
  .auth-input-row.has-error{border-color:var(--bad);}
  .auth-input-row .icon-svg{flex:none; color:var(--ink-faint);}
  .auth-input-row input{flex:1; min-width:0; border:0; background:none; font-size:16px; padding:13px 0; color:var(--ink); font-family:inherit;}
  .auth-input-row input:focus{outline:none;}
  .auth-eye-btn{flex:none; border:0; background:none; color:var(--ink-faint); padding:8px; margin-right:-8px; min-width:36px; min-height:36px; display:flex; align-items:center; justify-content:center;}
  .auth-field-error{color:var(--bad); font-size:12px; margin:6px 2px 0;}
  .auth-field-help{color:var(--ink-faint); font-size:11.5px; margin:6px 2px 0;}
  .auth-banner-error{background:var(--bad-soft); color:var(--bad); font-size:13px; border-radius:12px; padding:10px 12px; margin-top:14px;}
  .auth-legal{font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:16px;}
  .auth-legal a{color:var(--accent);}
  .auth-free-badge{margin-top:14px; text-align:center; font-size:11.5px; font-weight:600; color:var(--teal); background:var(--teal-soft); border-radius:14px; padding:10px 8px;}

  /* ---- onboarding wizard ---- */
  .onboard-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .onboard-dots{display:flex; gap:6px;}
  .onboard-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .onboard-dot.active{background:var(--accent); width:16px; border-radius:4px;}
  .onboard-dot.done{background:var(--purple);}
  .onboard-step{animation:onboardSlideIn .28s ease;}
  @keyframes onboardSlideIn{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }

  /* ---- cost breakdown ---- */
  .cost-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .cost-row b{font-family:"DM Sans",system-ui,sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cost-total{border-bottom:none; font-weight:600; margin-top:2px; padding-top:9px; border-top:1px dashed var(--line);}
  .expense-list{display:flex; flex-direction:column; gap:10px;}
  .expense-card{
    border:1px solid var(--line); border-radius:16px; padding:14px 16px; background:var(--card);
    text-align:left; display:flex; gap:12px; align-items:flex-start; width:100%;
    transition:background 150ms ease, border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
  }
  .expense-card:hover{background:var(--card-2); border-color:var(--border-elevated); transform:translateY(-1px);}
  .expense-card:active{background:#10141D; transform:scale(.985);}
  .expense-card.selected{border-color:var(--accent); background:var(--surface-3); box-shadow:0 0 0 3px rgba(133,142,255,.08), var(--glow-accent);}
  .expense-icon{
    flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .expense-check{
    flex:none; width:22px; height:22px; margin-top:1px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--card-2); display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .expense-card.selected .expense-check{border-color:var(--accent); background:var(--grad-accent); box-shadow:var(--glow-accent);}
  .expense-body{flex:1; min-width:0;}
  .expense-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .expense-label{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:15px;}
  .expense-top b{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px;}
  .expense-note{font-size:13px; margin-top:4px; font-family:"DM Sans",system-ui,sans-serif; color:var(--ink-soft);}
  .expense-badge{
    display:inline-block; margin-top:8px; font-size:11px; font-weight:600; letter-spacing:.02em;
    color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px;
  }
  .extras-card{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface-3); border:1px solid var(--border-elevated); border-radius:16px; padding:14px 16px;
  }
  .extras-icon{flex:none; width:36px; height:36px; border-radius:10px; background:var(--grad-accent); box-shadow:var(--glow-accent); color:#fff; display:flex; align-items:center; justify-content:center;}
  .extras-body{flex:1; min-width:0;}
  .extras-label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .extras-amount{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:19px; margin-top:2px;}
  .extras-amount span{font-family:"DM Sans",system-ui,sans-serif; font-weight:500; font-size:13px; color:var(--ink-soft);}
  .extras-yearly{font-size:12px; color:var(--ink-faint); margin-top:2px;}

  .status-ring{position:relative; margin:6px auto 0;}
  .status-ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .status-ring-value{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:30px; line-height:1;}
  .status-ring-label{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:4px;}
  .status-ring-sub{text-align:center; margin-top:10px; font-size:13px; color:var(--ink-soft);}
  .challenge-list{margin:10px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-soft);}
  .challenge-list li{margin-bottom:6px; line-height:1.4;}
  .pup-thumb{flex:none; width:56px; height:56px; border-radius:50%; overflow:hidden;}
  .pup-thumb svg, .dog-portrait svg{width:100%; height:100%; display:block; object-fit:contain;}
  .pup-thumb img, .dog-portrait img{width:100%; height:100%; display:block; object-fit:cover;}

  /* ---- dashboard header ---- */
  .dog-head{display:flex; align-items:center; gap:14px;}
  .dog-portrait{width:104px; height:104px; flex:none; border-radius:50%; overflow:hidden; box-shadow:0 0 0 3px var(--card), 0 0 0 5px rgba(133,142,255,.4), 0 8px 24px -6px rgba(133,142,255,.5);}
  .dog-id .name{font-size:22px; font-weight:700; font-family:"DM Serif Display",Georgia,serif;}
  .stage-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .badge{
    font-family:"DM Sans",system-ui,sans-serif; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; font-weight:700;
  }
  .badge.puppy{background:var(--accent-soft); color:var(--accent);}
  .badge.adolescent{background:var(--warn-soft); color:var(--warn);}
  .badge.adult{background:var(--teal-soft); color:var(--teal);}
  .badge.senior{background:var(--purple-soft); color:var(--purple);}
  .age{color:var(--ink-faint); font-size:13px;}
  .mood-chip{margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;}
  .mood-dot{width:8px; height:8px; border-radius:50%;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; background:var(--card-2); outline:none; margin:6px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--grad-accent); box-shadow:var(--glow-accent), 0 0 0 4px var(--bg); cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; border:none; background:var(--grad-accent); box-shadow:var(--glow-accent), 0 0 0 4px var(--bg); cursor:pointer;}
  input[type=range]::-moz-range-track{background:var(--card-2); height:6px; border-radius:3px;}
  .day-label{color:var(--ink-faint); font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; flex:1; min-width:0; padding-top:2px;}
  .page-header{padding:2px 2px 16px;}
  .page-header h1{font-size:26px;}
  .page-header p{margin-top:4px; font-size:14px;}
  .next-label{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:22px; margin-top:2px;}

  /* ---- meters ---- */
  .meter-track{height:9px; border-radius:999px; background:var(--card-2); overflow:hidden;}
  .meter-fill{height:100%; border-radius:999px; transition:width .4s ease;}

  .section-title{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:12px;}

  /* ---- stat tiles (wellness-style) ---- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ---- Today: clickable tile grid (tasks/walks/journal/budget/away/discover) ---- */
  .today-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .today-tile{text-align:left; padding:16px; display:flex; flex-direction:column; align-self:stretch; width:100%; height:100%;}
  .today-tile .tile-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .today-tile .tile-chevron{color:var(--ink-faint); font-size:20px; line-height:1;}
  .today-tile .tile-title{font-weight:700; font-size:14px; margin-top:14px;}
  .today-tile .tile-sub{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.35; min-height:32px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .stat-tile{background:var(--card-2); border-radius:18px; padding:14px;}
  .stat-tile[data-stat]{cursor:pointer;}
  .stat-tile[data-stat]:active{opacity:0.75;}
  .stat-tile .stat-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:8px; color:#fff;}
  .stat-tile .stat-value{font-family:"DM Serif Display",Georgia,serif; font-size:22px; font-weight:700; line-height:1;}
  .stat-tile .stat-label{color:var(--ink-faint); font-size:10.5px; margin-top:5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .stat-tile .stat-sublabel{color:var(--ink-faint); font-size:11px; margin-top:5px; font-weight:600;}
  .stat-tile .stat-sublabel.good{color:var(--teal);}
  .stat-tile .stat-sublabel.warn{color:var(--warn);}

  /* ---- icon-tile rows: a 40x40 tinted icon + title/subtitle + trailing status
     pill, used for Today's task list, Walks history, Training lessons, Costs
     breakdown and Report milestones (see rowCardHTML/pillHTML/iconTileHTML). ---- */
  .row-card{padding:14px 16px; display:flex; align-items:center; gap:14px;}
  .row-card[data-train], .row-card[data-tab], .row-card.tappable{cursor:pointer;}
  .row-card[data-train]:active, .row-card[data-tab]:active, .row-card.tappable:active{opacity:.8;}
  .row-icon-tile{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pill{display:inline-block; flex:none; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}

  /* ---- training GIF slot (placeholder until real clips exist) ---- */
  .gif-slot{display:flex; align-items:center; justify-content:center; height:140px; border-radius:16px; background:var(--card-2); font-size:56px;}
  video.gif-slot{height:180px; width:100%; object-fit:cover; background:var(--card-2); display:block;}
  .training-video-wrap{position:relative; border-radius:16px; overflow:hidden;}
  .training-video-wrap .gif-slot{border-radius:0;}
  .training-caption{
    position:absolute; left:0; right:0; bottom:0; padding:14px 16px 14px;
    background:linear-gradient(180deg, rgba(11,14,21,0) 0%, rgba(11,14,21,.55) 40%, rgba(11,14,21,.92) 100%);
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
  }
  .training-caption-label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .training-caption-title{font-family:"DM Serif Display",Georgia,serif; font-weight:700; font-size:19px; color:#fff; margin-top:2px;}
  .training-caption-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .training-caption-chevron{color:var(--ink-soft); flex:none; padding-bottom:2px;}

  /* ---- step-by-step breakdown shown above the practice video ---- */
  .step-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); text-align:left;}
  .step-row:last-child{border-bottom:none;}
  .step-num{flex:none; width:22px; height:22px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .step-text{font-size:14px; font-weight:600; line-height:1.35;}
  .step-info{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.35;}

  /* ---- training ---- */
  .cmd-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .cmd-row:last-child{border-bottom:none;}
  .cmd-icon{flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .cmd-body{flex:1; min-width:0;}
  .cmd-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .cmd-name{font-size:14px; font-weight:600;}
  .cmd-pct{font-family:"DM Sans",system-ui,sans-serif; font-weight:600; font-size:13px; color:var(--ink-soft); flex:none;}
  .cmd-bar{width:100%; height:7px; border-radius:999px; background:var(--card-2); overflow:hidden; margin-top:7px;}
  .cmd-fill{height:100%; background:var(--grad-accent); border-radius:999px;}
  .cmd-btn{flex:none; font-size:12px; padding:7px 13px; width:auto; border-radius:999px; margin-left:2px;}

  .track-wrap{margin:22px 0 8px;}
  .track{position:relative; height:22px; border-radius:11px; background:var(--card-2); border:1px solid var(--line);}
  .zone{position:absolute; top:0; bottom:0; background:var(--accent-soft); border-left:2px solid var(--accent); border-right:2px solid var(--accent);}
  .marker{position:absolute; top:-5px; width:10px; height:32px; margin-left:-5px; background:var(--ink); border-radius:4px;}
  .round-dots{display:flex; gap:6px; justify-content:center; margin-top:16px;}
  .round-dots span{width:9px; height:9px; border-radius:50%; background:var(--card-2); border:1px solid var(--line);}
  .round-dots span.hit{background:var(--teal); border-color:var(--teal);}
  .round-dots span.miss{background:var(--bad); border-color:var(--bad);}

  /* ---- journal ---- */
  .j-entry{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .j-entry:last-child{border-bottom:none;}
  .j-time{flex:none; width:64px; color:var(--ink-faint); font-weight:700; font-size:11.5px; padding-top:1px;}
  .j-text{color:var(--ink);}
  .timeline{position:relative;}
  .timeline-item{position:relative; display:flex; gap:12px; padding-bottom:18px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-item:last-child .timeline-line{display:none;}
  .timeline-dot{flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:1; color:#fff;}
  .timeline-line{position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--line);}
  .timeline-body{flex:1; min-width:0; padding-top:2px;}
  .timeline-time{font-size:11px; color:var(--ink-faint); font-weight:700; letter-spacing:.03em;}
  .timeline-title{font-family:"DM Serif Display",Georgia,serif; font-weight:600; font-size:14.5px; margin-top:2px;}
  .timeline-sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .friction-card{display:flex; gap:12px; align-items:flex-start; padding:14px 0;}
  .friction-card + .friction-card{border-top:1px solid var(--line);}
  .friction-icon{flex:none; width:34px; height:34px; border-radius:10px; background:var(--grad-warn); box-shadow:var(--glow-warn); color:#241704; display:flex; align-items:center; justify-content:center;}
  .friction-body .friction-title{font-family:"DM Serif Display",Georgia,serif; font-weight:600; font-size:14.5px;}
  .friction-body .friction-desc{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}
  .home-env-card{display:flex; gap:14px; align-items:center; background:var(--card-2); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:12px;}
  .home-env-photo{flex:none; width:64px; height:64px; border-radius:12px; overflow:hidden;}
  .home-env-photo img{width:100%; height:100%; display:block; object-fit:cover;}
  .home-env-facts{flex:1; min-width:0;}
  .home-env-facts .fact-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .home-env-facts .fact-row svg{flex:none; color:var(--ink-faint);}
  .report-dog-photo{position:absolute; top:-6px; right:-6px; width:88px; height:88px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 3px var(--card), 0 0 0 5px rgba(133,142,255,.35);}
  .report-dog-photo img{width:100%; height:100%; object-fit:cover;}

  .alert-banner{margin-top:14px; padding:10px 12px; border-radius:14px; background:var(--warn-soft); color:var(--warn); font-size:13px; text-align:left; font-weight:600;}

  /* ---- activity ring ---- */
  .ring-wrap{position:relative; width:152px; height:152px; margin:20px auto 0;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-num{font-size:26px; font-weight:700; line-height:1; font-family:"DM Serif Display",Georgia,serif;}
  .ring-goal{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* ---- settings ---- */
  .setting-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;}
  .setting-copy .title{font-weight:600; font-size:14px;}
  .setting-copy .caveat{color:var(--ink-soft); font-size:12px; margin-top:3px; line-height:1.5;}
  .switch{appearance:none; -webkit-appearance:none; width:42px; height:24px; border-radius:999px; background:var(--card-2); border:1px solid var(--border-elevated); position:relative; cursor:pointer; flex-shrink:0; flex:none; margin:2px 0 0; padding:0;}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:999px; background:var(--ink-faint); transition:transform .15s, background .15s;}
  .switch:checked{background:linear-gradient(135deg,#9DA4FF,#6C74E8); border-color:transparent;}
  .switch:checked::after{transform:translateX(18px); background:#ffffff;}
  .lang-switch{display:flex; gap:4px; flex:none; background:var(--card-2); border:1px solid var(--border-elevated); border-radius:999px; padding:3px; margin-top:2px;}
  .lang-switch-btn{
    appearance:none; -webkit-appearance:none; border:none; background:transparent; cursor:pointer;
    color:var(--ink-soft); font-family:inherit; font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:999px; transition:background .15s, color .15s;
  }
  .lang-switch-btn.active{background:linear-gradient(135deg,#9DA4FF,#6C74E8); color:#ffffff;}

  .center{text-align:center;}
  .muted{color:var(--ink-soft); font-size:14px;}
  .big-num{font-family:"DM Serif Display",Georgia,serif; font-size:40px; font-weight:700;}

  .top-actions{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .top-actions #reset-btn, .top-actions .reset-confirm{flex:none; white-space:nowrap;}
  .reset-confirm{display:flex; align-items:center; gap:8px;}

  /* ---- bottom tab bar (floating glass) ---- */
  .tab-bar{position:fixed; left:0; right:0; bottom:12px; display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .tab-bar-inner{
    pointer-events:auto; width:100%; max-width:440px; margin:0 14px; min-height:76px;
    display:flex; align-items:center;
    background:rgba(255,253,246,.78);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(231,225,210,.9); border-radius:20px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 16px 32px rgba(16,27,70,.12);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); gap:2px;
  }
  .tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; border:none; padding:6px 2px; border-radius:14px; color:var(--ink-faint); font-size:10px; font-weight:700; font-family:"DM Sans",system-ui,sans-serif; transition:background 150ms ease, color 150ms ease;}
  .tab-btn .tab-icon{line-height:1; display:flex;}
  .tab-btn .tab-icon svg{width:20px; height:20px;}
  .tab-btn.active{color:var(--ink); background:var(--surface-3); box-shadow:0 0 20px rgba(133,142,255,.15);}
  .tab-btn.active .tab-icon svg{color:var(--accent);}
  .icon-svg{display:inline-block; vertical-align:middle;}

  /* ---- floating tip-of-the-day card (sits just above the tab bar) ---- */
  .tip-card{
    position:fixed; left:20px; right:20px; bottom:100px; max-width:400px; margin:0 auto; z-index:19;
    background:rgba(255,253,246,.7);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(231,225,210,.85); border-radius:16px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 12px 28px rgba(16,27,70,.12);
    animation:tipCardIn .25s ease;
  }

    if (!draft.arrivalDate){ realError = tr('adopt_error_arrival',"Enter the arrival date."); render(); return; }
    realError = "";
    realBusy = true;
    render();
    fetch(API_BASE + "/api/real-dogs", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({
        idempotencyKey: draft.idempotencyKey,
        name: draft.name.trim(),
        arrivalDate: draft.arrivalDate,
        birthDate: draft.birthDate || null,
        estimatedAge: draft.estimatedAge || null,
        breed: draft.breed || null,
        timeZone: deviceTimeZone(),
        sourceSimulationId: null
      })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      realBusy = false;
      if (!result.ok){
        realError = result.data.error || tr('adopt_error_generic',"Something went wrong. Try again.");
        render();
        return;
      }
      realDog = result.data.dog;
      if (realDogs.indexOf(realDog) === -1) realDogs.push(realDog);
      clearRealDraft();
      view = "realToday";
      render();
      loadRealTodayData();
    }).catch(function(){
      realBusy = false;
      realError = tr('adopt_error_network',"Couldn't reach the server. Check your connection and try again.");
      render();
    });
  }
  // Single entry point for every "adopted this dog?" CTA. Routes to the right
  // step instead of always restarting onboarding: an existing real dog goes
  // straight to its Today, an in-progress draft resumes where it left off.
  function goToRealAdoption(){
    if (realDog){ view = "realToday"; render(); loadRealTodayData(); return; }
    if (!authToken){ onboardStep = initialOnboardStep(); view = "onboarding"; render(); return; }
    function proceed(){
      if (realDog){ view = "realToday"; render(); loadRealTodayData(); return; }
      var draft = loadRealDraft();
      var hasDraftProgress = !!draft.name;
      realOnboardStep = 0;
      realError = "";
      view = hasDraftProgress ? "adoptForm" : "adoptIntro";
      render();
    }
    if (!realDogsLoaded){
      fetchRealDogs().then(proceed);
    } else {
      proceed();
    }
  }

  // ---------- Real routines + today's activity log: fetch/create/toggle ----------
  function fetchRoutines(dogId){
    return fetch(API_BASE + "/api/routines?dogId=" + encodeURIComponent(dogId), {
      headers: { "Authorization": "Bearer " + authToken }
    }).then(function(res){ return res.json(); }).then(function(data){
      realRoutines = data.routines || [];
    }).catch(function(){ realRoutines = []; });
  }
  function fetchActivityLogs(dogId, date){
    return fetch(API_BASE + "/api/activity-logs?dogId=" + encodeURIComponent(dogId) + "&date=" + encodeURIComponent(date), {
      headers: { "Authorization": "Bearer " + authToken }
    }).then(function(res){ return res.json(); }).then(function(data){
      var map = {};
      (data.logs || []).forEach(function(l){ map[l.routine_id] = l.status; });
      realLogsToday = map;
    }).catch(function(){ realLogsToday = {}; });
  }
  function loadRealTodayData(){
    if (!realDog) return;
    realRoutinesLoaded = false;
    Promise.all([fetchRoutines(realDog.id), fetchActivityLogs(realDog.id, todayISODate())]).then(function(){
      realRoutinesLoaded = true;
      render();
    });
  }
  function fetchTrainingSessions(dogId){
    return fetch(API_BASE + "/api/training-sessions?dogId=" + encodeURIComponent(dogId), {
      headers: { "Authorization": "Bearer " + authToken }
    }).then(function(res){ return res.json(); }).then(function(data){
      realTrainingSessions = data.sessions || [];
    }).catch(function(){ realTrainingSessions = []; });
  }
  function loadRealTrainingData(){
    if (!realDog) return;
    realTrainingSessionsLoaded = false;
    render();
    fetchTrainingSessions(realDog.id).then(function(){
      realTrainingSessionsLoaded = true;
      render();
    });
  }
  // Most recent session per lesson, most-recent-first — used to show "last
  // practiced: Easy" without re-deriving it from the full list every render.
  function latestSessionByLesson(){
    var map = {};
    realTrainingSessions.forEach(function(s){
      if (!map[s.lesson_id] || s.completed_at > map[s.lesson_id].completed_at) map[s.lesson_id] = s;
    });
    return map;
  }
  function submitTrainingSession(lessonId, difficulty){
    if (!realDog) return;
    realTrainingBusy = true;
    render();
    fetch(API_BASE + "/api/training-sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ dogId: realDog.id, lessonId: lessonId, difficulty: difficulty })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      realTrainingBusy = false;
      if (result.ok && result.data.session) realTrainingSessions.unshift(result.data.session);
      render();
    }).catch(function(){
      realTrainingBusy = false;
      render();
    });
  }
  function logActivity(routineId, status){
    var date = todayISODate();
    var prev = realLogsToday[routineId];
    realLogsToday[routineId] = status;
    render();
    fetch(API_BASE + "/api/activity-logs", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ routineId: routineId, scheduledLocalDate: date, status: status })
    }).then(function(res){ return res.json(); }).then(function(data){
      if (data.log) realLogsToday[routineId] = data.log.status;
      render();
    }).catch(function(){
      if (prev) realLogsToday[routineId] = prev; else delete realLogsToday[routineId];
      render();
    });
  }
  function unlogActivity(routineId){
    var date = todayISODate();
    var prev = realLogsToday[routineId];
    delete realLogsToday[routineId];
    render();
    fetch(API_BASE + "/api/activity-logs?routineId=" + encodeURIComponent(routineId) + "&date=" + encodeURIComponent(date), {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + authToken }
    }).catch(function(){
      if (prev) realLogsToday[routineId] = prev;
      render();
    });
  }
  function toggleRoutineDone(routine){
    var current = realLogsToday[routine.id];
    if (current === "completed") unlogActivity(routine.id);
    else logActivity(routine.id, "completed");
  }
  function realQuickAction(type){
    if (type === "learn"){
      view = "realLearn"; render();
      loadRealTrainingData();
      return;
    }
    var match = realRoutines.filter(function(r){ return r.active && r.type === type; })[0];
    if (match){ toggleRoutineDone(match); return; }
    var draft = loadRealRoutineDraft();
    draft.type = type;
    realRoutineError = "";
    realRoutineFormOpen = true;
    view = "realRoutines";
    render();
  }
  function loadRealRoutineDraft(){
    if (!realRoutineDraft) realRoutineDraft = { type:"meal", title:"", localTime:"08:00", recurrence:"daily" };
    return realRoutineDraft;
  }
  function submitNewRoutine(){
    var draft = loadRealRoutineDraft();
    if (!draft.title.trim()){ realRoutineError = tr('routine_error_title',"Enter a title."); render(); return; }
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(draft.localTime)){ realRoutineError = tr('routine_error_time',"Enter a valid time."); render(); return; }
    realRoutineError = "";
    realRoutineBusy = true;
    render();
    fetch(API_BASE + "/api/routines", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ dogId: realDog.id, type: draft.type, title: draft.title.trim(), localTime: draft.localTime, recurrence: draft.recurrence })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      realRoutineBusy = false;
      if (!result.ok){
        realRoutineError = result.data.error || tr('adopt_error_generic',"Something went wrong. Try again.");
        render();
        return;
      }
      realRoutines.push(result.data.routine);
      realRoutines.sort(function(a,b){ return a.local_time < b.local_time ? -1 : 1; });
      realRoutineDraft = null;
      realRoutineFormOpen = false;
      render();
    }).catch(function(){
      realRoutineBusy = false;
      realRoutineError = tr('adopt_error_network',"Couldn't reach the server. Check your connection and try again.");
      render();
    });
  }
  function toggleRoutineActive(routine){
    var newActive = !routine.active;
    routine.active = newActive ? 1 : 0;
    render();
    fetch(API_BASE + "/api/routines/" + encodeURIComponent(routine.id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ active: newActive })
    }).catch(function(){
      routine.active = newActive ? 0 : 1;
      render();
    });
  }
  // Display language. Lives outside the trial's own state blob (same
  // small-standalone-key pattern as AUTH_TOKEN_KEY above) because it needs to
  // be readable before a trial exists (splash/onboarding) and to survive a
  // "start a new trial" reset. It's mirrored onto state.lang once a trial
  // exists so save()/load() carry it along with everything else.
  var LANG_KEY = "dogtrial_lang";
  var uiLang = "en";
  var langChosen = false;
  try { var storedLang = localStorage.getItem(LANG_KEY); uiLang = storedLang || "en"; langChosen = !!storedLang; } catch (e) {}
  function setLang(lang){
    uiLang = lang;
    langChosen = true;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    if (state) { state.lang = lang; save(); }
  }
  // First screen of onboarding: "lang" only for someone who has never picked a
  // language (fresh install/browser) — an existing chosen language, or an
  // already-authenticated account, skips straight past it.
  function initialOnboardStep(){
    if (!langChosen) return 0;
    return authToken ? 2 : 1;
  }
  // Locale for Date#toLocaleDateString/toLocaleTimeString calls, so weekday/month
  // names (and time formatting) follow the display language, not just the UI strings.
  function appLocale(){
    return ((state && state.lang) || uiLang || "en") === "fr" ? "fr-FR" : "en-US";
  }

  function archiveCurrentTrial(outcome){
    if (!state) return;
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    var archive = loadArchive();
    archive.unshift({
      name: state.name, breedName: breed.name, housingLabel: housing.label,
      dogDaysReached: Math.round(state.dogDays), tripDaysReached: tripDay()+1,
      accidentsCount: state.accidentsCount||0, totalHoursAway: Math.round(state.totalHoursAway||0),
      outcome: outcome, endedAt: Date.now()
    });
    if (archive.length > 20) archive.length = 20;
    saveArchive(archive);
  }

    var days = Math.max(0, realDays);

    var optional = selectedExpensesCostSoFar(days);
    return Math.round(food + optional);

  function longestAwaySession(){
    var sessions = state.awaySessions || [];
    return sessions.reduce(function(max, s){ return Math.max(max, s.hours); }, 0);
  }
  function todayAloneHours(){
    var sessions = state.awaySessions || [];
    var today = new Date().toDateString();
    return sessions.reduce(function(sum, s){
      return new Date(s.ts).toDateString() === today ? sum + s.hours : sum;
    }, 0);
  }
  var INCIDENT_LABELS = { accident:"accident", chew:"chewed item", bark:"bark complaint", anxiety:"anxious moment", escape:"escape attempt", health:"health scare", depression:"withdrawn moment" };
  function incidentSummaryLine(){
    var tally = state.incidentTally || {};
    var parts = Object.keys(tally).filter(function(k){ return tally[k] > 0; }).map(function(k){
      var n = tally[k];
      var label = INCIDENT_LABELS[k] || k;
      return n + " " + label + (n===1?"":"s");
    });
    if (!parts.length) return "";
    return "This trial so far: " + parts.join(", ") + ".";

  function compatibilityScore(){
    var avgTraining = avgTrainingProgress();
    var score = 70
      + (state.houseTraining - 50) * 0.3
      + (avgTraining - 50) * 0.2
      - state.accidentsCount * 3
      - Math.max(0, state.ownerLoad - 50) * 0.4;
    return Math.max(0, Math.min(100, Math.round(score)));
  }
  function topChallenges(n){

    candidates.sort(function(a,b){ return b.score - a.score; });
    return candidates.slice(0, n);

  function totalIncidentsCount(){

  // Turns the same raw signals behind compatibilityScore() into a nuanced verdict —

  function adopterProfileHeadline(){

  // A behavioral read of the bond built up over the trial, for the 30-day report —

  }
  // Present-tense read of the same bond value, for the Health tab — where it's mid-trial rather

  // Not a score — a read on whether training sessions got easier or harder over the
  // trial, from the self-reported difficulty on each completed session.
  function trainingTrendNarrative(){
    var logEntries = state.trainingLog || [];

    var half = Math.ceil(logEntries.length/2);
    var firstHalf = logEntries.slice(0, half);
    var secondHalf = logEntries.slice(half);
    var avg = function(arr){
      return arr.reduce(function(s,e){ return s + (diffScore[e.difficulty]===undefined ? 0.5 : diffScore[e.difficulty]); }, 0) / arr.length;
    };
    var a1 = avg(firstHalf), a2 = avg(secondHalf);

  function maybeInterceptView(){
    if (!state) return;
    if (state.housingNeedsClarification){ view = "housingClarify"; return; }

      state.checkpointShownDay = 7;

  function tripDay(){
    return Math.floor((Date.now() - state.startedAt) / (24*HOUR));
  }
  // Same 24h-from-start clock as tripDay(), applied to an arbitrary timestamp —
  // so "today" always means "this trial day", not "this calendar date". Without
  // this, a trial started at 9pm would appear to reach day 2 at midnight (3h in)
  // instead of 24h in, because toDateString() flips at local midnight.
  function tripDayOf(ts){
    return Math.floor((ts - state.startedAt) / (24*HOUR));
  }

  // Inserts at the right chronological position rather than always at the front,
  // so a deferred consequence can be logged with the timestamp it actually happened at.
  function logAt(ts, text){
    var idx = 0;
    while (idx < state.journal.length && state.journal[idx].ts > ts) idx++;
    state.journal.splice(idx, 0, { ts: ts, text: text });
    if (state.journal.length > 60) state.journal.length = 60;
  }
  function log(text){
    logAt(Date.now(), text);
  }

  function applyHomeDecay(hours, stage){
    var fi = FEED_INTERVAL[stage], bi = BLADDER_INTERVAL[stage];
    var wi = WALK_INTERVAL_HOURS; // every breed needs ~2 walks/day; duration (not frequency) is what varies by breed
    var today = tripDay();
    if (state.dailyFlagsDay !== today){
      state.dailyFlagsDay = today;
      state.toiletMissedToday = false;
      state.mealMissedToday = false;
    }
    state.hunger = clamp(state.hunger - hours*(100/fi));
    state.bladder = clamp(state.bladder - hours*(100/bi));
    state.energy = clamp(state.energy - hours*(100/wi));
    // Feeds the incident engine's toiletOnTime/mealOnTime inputs directly from
    // the same hunger/bladder decay already driving the rest of the sim — no
    // separate daily-goal ledger to keep in sync.
    if (state.bladder <= 0) state.toiletMissedToday = true;
    if (state.hunger <= 0) state.mealMissedToday = true;

  }

  // Roughly once every few hours once the bond is established — never every tick,

    if (Math.random() < chance){
      var pick = POSITIVE_MOMENTS[Math.floor(Math.random()*POSITIVE_MOMENTS.length)];

      state.lastPositiveMomentAt = Date.now();
    }
  }

  // Real elapsed days, not simulated dog age — the 30-day clock keeps moving

  // ---------- Dog Moments: contextual, simulation-driven notifications ----------

  var DOG_MOMENTS = [
    { id:"explore_no_settle", category:"Exploration", color:"accent", icon:"compass", oneShot:true,

  function dogMomentContext(now){
    return {
      now: now,

  }

  function fireDogMoment(def, now){
    var moment = {
      id: def.id + "_" + now,

      iconName: def.icon,

      var def = DOG_MOMENTS[i];

      if (!canFireDogMoment(def, now)) continue;

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function captureAbsenceSnapshot(){
    var breed = byId(state.breedId);

      ageStage: stage === "senior" ? "adult" : stage,

  // Evaluated exactly once per absence (idempotencyKey = absenceId), only

  function maybeEvaluateAbsenceIncident(away, now, durationMinutes){
    if (!away.absenceId || !away.snapshot) return; // an absence started before this patch: nothing to evaluate
    if (state.lastEvaluatedAbsenceId === away.absenceId) return;
    state.lastEvaluatedAbsenceId = away.absenceId;
    var day = tripDay();
    if (state.domesticIncidentDay === day || activeMomentBubble){ save(); return; }

      var result = window.DogTrailAbsenceConsequences.evaluate(away.snapshot, durationMinutes, rules);

      state.domesticIncidentDay = day;
      fireIncident(result, now, day, away.snapshot.completion);
    }).catch(function(){ save(); });

  function fireIncident(result, now, day, completionSnapshot){

      color: "warn",
      iconName: "alert",

      assetPath: result.asset,

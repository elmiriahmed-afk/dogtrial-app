  // Bottom-sheet open/close: locks page scroll behind the sheet while it's up
  // and returns focus to the originating control on close, matching a real
  // modal dialog rather than just an absolutely-positioned card. render()
  // fully replaces #app's innerHTML every call, so a *raw element reference*
  // capturing "where focus was" would be a detached node by the time we need
  // it — a CSS selector re-queried fresh after the closing render() is the
  // only thing that survives that, and only works if the element it names
  // still exists post-close (true for a notif-row; not for the bubble the
  // sheet itself just cleared, hence the bell fallback there).
  var momentRestoreSelector = null;
  function openMomentSheet(restoreSelector){
    momentRestoreSelector = restoreSelector || null;
    momentBubbleExpanded = true;
    render();
    document.body.style.overflow = "hidden";
    var sheet = document.getElementById("moment-card");
    if (sheet) sheet.focus();
  }
  function closeMomentSheet(){
    momentBubbleExpanded = false;
    activeMomentBubble = null;
    render();
    document.body.style.overflow = "";
    var restoreTo = (momentRestoreSelector && document.querySelector(momentRestoreSelector)) || document.getElementById("brand-bell-btn");
    if (restoreTo) restoreTo.focus();
    momentRestoreSelector = null;
  }

  // Renders the current Dog Moment as either a small non-blocking bubble or,
  // once tapped, an expanded bottom-sheet card. Appended after the main view
  // markup on every render (except splash/onboarding) rather than replacing it.
  // Real breed x life-stage photos back the Incident category and the plain
  // (non-moment) daily sniffing welcome card; every other moment falls back
  // to the plain icon header.
  function sniffingPhotoFor(){
    if (!state) return null;
    var stage = stageOf(state.dogDays);
    if (stage === "senior") stage = "adult";
    return "media/moments/sniffing/" + state.breedId + "_" + stage + ".jpg";
  }
  function momentPhotoFor(m){
    if (!m || !state) return null;
    if (m.category === "Incident") return m.assetPath || null;
    return null;
  }

  function renderMomentOverlay(){
    var m = activeMomentBubble;
    if (!m) return "";
    if (!momentBubbleExpanded){
      return '' +
        '<div class="moment-bubble" id="moment-bubble">' +
          '<span class="moment-bubble-icon" style="background:var(--grad-'+m.color+'); box-shadow:var(--glow-'+m.color+');">'+icon(m.iconName,16)+'</span>' +

          '</button>' +
          '<button class="moment-bubble-close" id="moment-bubble-close" aria-label="Dismiss">'+icon("x",12)+'</button>' +
        '</div>';
    }
    var photoUrl = momentPhotoFor(m);
    var isIncident = m.category === "Incident";
    // Header lives outside the scroll container so the close button stays
    // visible no matter how far the content underneath scrolls; the sheet
    // itself is height-clamped (48–82dvh) per the bottom-sheet spec rather
    // than growing to fit its content.
    return '' +
      '<div class="moment-overlay-backdrop" id="moment-backdrop"></div>' +
      '<div class="moment-card" id="moment-card" role="dialog" aria-modal="true" aria-labelledby="moment-card-title" tabindex="-1">' +
        '<div class="moment-card-top">' +
          '<span class="moment-bubble-icon" style="background:var(--grad-'+m.color+'); box-shadow:var(--glow-'+m.color+');">'+icon(m.iconName,18)+'</span>' +

        '</div>' +
        '<div class="moment-card-scroll">' +
          (photoUrl ? '<img class="moment-card-photo" src="'+photoUrl+'" alt="'+(isIncident?esc(m.title):"")+'" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">' : '') +
          '<div class="moment-card-title" id="moment-card-title">'+esc(m.title)+'</div>' +
          (isIncident ? '<div class="moment-card-explain-label">WHY NOW?</div>' : '') +

    });
    // state.journal is already newest-first, but entries can be inserted out of
    // chronological order (see logAt) — grouping by run assumes the common case;
    // an out-of-order backdated entry just lands in the nearest matching group or starts a new one.
    // Grouped by trial day (tripDayOf, 24h-from-start), not calendar date, so this
    // stays consistent with the "Day N/30" counter shown everywhere else in the app.

    var groupsHTML = groups.map(function(g){
      var d = new Date(g.ts);
      var weekday = d.toLocaleDateString(appLocale(), { weekday:"long" });
      var monthDay = d.toLocaleDateString(appLocale(), { month:"long", day:"numeric" });
      var dayNum = Math.max(1, Math.min(30, g.dayIdx+1));
      var entries = g.entries.map(function(j){
        var isMilestone = j.text.indexOf("✓") === 0;
        return '<div class="j-entry"><div class="j-time">'+timeAgo(j.ts)+'</div>' +
          '<div class="j-text"'+(isMilestone ? ' style="color:var(--accent); font-weight:600;"' : '')+'>'+esc(j.text)+'</div></div>';
      }).join("");
      return '<div class="card">' +
        '<div class="section-title">'+tr('day_n_label','Day {day}').replace('{day}', dayNum)+' · '+weekday+', '+monthDay+'</div>' +
        entries +
      '</div>';
    }).join("");

    return '' +
      '<div class="card">' +
        '<div class="top-actions"><h2 style="font-size:19px">'+tr('milestones_title','Milestones')+'</h2><button class="btn-ghost" id="back-home">'+tr('btn_back','Back')+'</button></div>' +
        '<p class="muted">'+esc(state.name)+'\'s 30-day rehearsal, day by day. Highlighted lines are completed actions.</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="stat-grid">' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--purple-soft); color:var(--purple);">'+icon('calendar',18)+'</div><div class="stat-value">'+Math.min(30, Math.max(0,day))+'/30</div><div class="stat-label">'+tr('milestones_days_in','Days in')+'</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--accent-soft); color:var(--accent);">'+icon('paw',18)+'</div><div class="stat-value">'+state.walksCompleted+'</div><div class="stat-label">'+tr('tab_walks','Walks')+'</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--teal-soft); color:var(--teal);">'+icon('cap',18)+'</div><div class="stat-value">'+avgTraining+'%</div><div class="stat-label">'+tr('milestones_avg_training','Avg. training')+'</div></div>' +
          '<div class="stat-tile"><div class="stat-icon" style="background:var(--warn-soft); color:var(--warn);">'+icon('wallet',18)+'</div><div class="stat-value">€'+costSoFar(breed, realDaysElapsed)+'</div><div class="stat-label">'+tr('costs_spent_so_far','Spent so far')+'</div></div>' +
        '</div>' +
      '</div>' +
      (groupsHTML || '<div class="card"><div class="muted">'+tr('milestones_nothing_logged','Nothing logged yet.')+'</div></div>');
  }

  function attachHandlers(){

    }

    if (view === "onboarding"){
      function onboardAdvance(){
        setTimeout(function(){
          onboardStep = Math.min(onboardStep + 1, ONBOARD_STEPS.length - 1);
          render();
        }, 180);
      }
      var onboardLangEnBtn = document.getElementById("onboard-lang-en");
      if (onboardLangEnBtn) onboardLangEnBtn.addEventListener("click", function(){
        setLang("en"); onboardAdvance();
      });
      var onboardLangFrBtn = document.getElementById("onboard-lang-fr");
      if (onboardLangFrBtn) onboardLangFrBtn.addEventListener("click", function(){
        setLang("fr"); onboardAdvance();
      });
      var authEmailInput = document.getElementById("auth-email");
      var authPasswordInput = document.getElementById("auth-password");
      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (authEmailInput){
        authEmailInput.addEventListener("input", function(){
          authEmailValue = authEmailInput.value;
          if (authEmailError){ authEmailError = ""; render(); }
        });
      }
      if (authPasswordInput){
        authPasswordInput.addEventListener("input", function(){
          authPasswordValue = authPasswordInput.value;
          if (authPasswordError){ authPasswordError = ""; render(); }
        });
      }
      var authEyeBtn = document.getElementById("auth-eye");
      if (authEyeBtn) authEyeBtn.addEventListener("click", function(){
        authShowPassword = !authShowPassword;
        render();
        var reFocus = document.getElementById("auth-password");
        if (reFocus){ reFocus.focus(); try { reFocus.setSelectionRange(reFocus.value.length, reFocus.value.length); } catch(e){} }
      });
      var authSubmitBtn = document.getElementById("auth-submit");
      if (authSubmitBtn) authSubmitBtn.addEventListener("click", function(){
        var email = (authEmailValue || "").trim();
        var password = authPasswordValue || "";
        var validEmail = email.length > 0 && EMAIL_RE.test(email);
        var validPassword = password.length >= 8;
        authEmailError = validEmail ? "" : tr('auth_error_email_invalid', "Enter a valid email address.");
        authPasswordError = validPassword ? "" : tr('auth_error_password_short', "Password must be at least 8 characters.");
        if (!validEmail || !validPassword){
          authError = "";
          render();
          return;
        }
        authError = "";
        authBusy = true;
        render();
        var endpoint = API_BASE + (authMode === "signup" ? "/api/signup" : "/api/login");
        fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        }).then(function(res){
          return res.json().then(function(data){ return { ok: res.ok, data: data }; });
        }).then(function(result){
          authBusy = false;
          if (!result.ok){
            authError = result.data.error || "Something went wrong. Try again.";
            render();
            return;
          }
          authToken = result.data.token;
          try { localStorage.setItem(AUTH_TOKEN_KEY, authToken); } catch(e){}
          authEmailValue = ""; authPasswordValue = "";
          onboardStep = Math.min(onboardStep + 1, ONBOARD_STEPS.length - 1);
          render();
        }).catch(function(){
          authBusy = false;
          authError = "Network error. Check your connection and try again.";
          render();
        });
      });
      var authToggleBtn = document.getElementById("auth-toggle");
      if (authToggleBtn) authToggleBtn.addEventListener("click", function(){
        authMode = authMode === "signup" ? "login" : "signup";
        authError = ""; authEmailError = ""; authPasswordError = ""; authPasswordValue = "";
        render();
      });
      var backBtn = document.getElementById("onboard-back");
      if (backBtn) backBtn.addEventListener("click", function(){
        onboardStep = Math.max(onboardStep - 1, 0);
        render();
      });
      var nameInput = document.getElementById("dogname");
      var nextNameBtn = document.getElementById("onboard-next-name");
      function commitName(){
        var name = (nameInput.value || "").trim();
        if (!name) return;
        pendingName = name;
        onboardStep = Math.min(onboardStep + 1, ONBOARD_STEPS.length - 1);
        render();
      }
      var nameTag = document.getElementById("name-tag");
      var nameCount = document.getElementById("name-count");
      if (nameInput){
        nameInput.focus();
        var syncNextBtn = function(){
          var v = (nameInput.value || "").trim();
          if (nextNameBtn) nextNameBtn.disabled = !v;
          if (nameTag) nameTag.textContent = v || "?";
          if (nameCount) nameCount.textContent = nameInput.value.length + " / 20";
          root.querySelectorAll("[data-name-suggest]").forEach(function(chip){
            chip.classList.toggle("active", chip.getAttribute("data-name-suggest") === v);
          });
        };
        syncNextBtn();
        nameInput.addEventListener("input", syncNextBtn);
        nameInput.addEventListener("keydown", function(e){
          if (e.key === "Enter") commitName();
        });
      }
      if (nextNameBtn) nextNameBtn.addEventListener("click", commitName);
      root.querySelectorAll("[data-name-suggest]").forEach(function(chip){
        chip.addEventListener("click", function(){
          if (!nameInput) return;
          nameInput.value = chip.getAttribute("data-name-suggest");
          nameInput.dispatchEvent(new Event("input", { bubbles:true }));
          nameInput.focus();
        });
      });
      root.querySelectorAll("[data-breed]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingBreed = el.getAttribute("data-breed");
          breedInfoId = null;
          render();
          onboardAdvance();
        });
      });
      root.querySelectorAll("[data-breed-info]").forEach(function(el){
        el.addEventListener("click", function(){
          breedInfoId = el.getAttribute("data-breed-info");

        render();
      });

        el.addEventListener("click", function(){
          breedSizeFilter = el.getAttribute("data-breed-filter");
          render();
        });
      });
      var breedSearchInput = document.getElementById("breed-search");
      if (breedSearchInput){
        breedSearchInput.addEventListener("input", function(){
          breedQuery = breedSearchInput.value;
          render();
          var reFocus = document.getElementById("breed-search");
          if (reFocus){ reFocus.focus(); try { reFocus.setSelectionRange(reFocus.value.length, reFocus.value.length); } catch(e){} }
        });
      }
      root.querySelectorAll("[data-housing]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingHousing = el.getAttribute("data-housing");
          render();
          onboardAdvance();
        });

      root.querySelectorAll("[data-start-stage]").forEach(function(el){
        el.addEventListener("click", function(){

          render();
          onboardAdvance();

      root.querySelectorAll("[data-sex]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingSex = el.getAttribute("data-sex");
          render();
          onboardAdvance();
        });
      });
      root.querySelectorAll("[data-life]").forEach(function(el){
        el.addEventListener("click", function(){
          pendingLife = el.getAttribute("data-life");
          render();
          onboardAdvance();
        });
      });
      var startBtn = document.getElementById("start-btn");
      if (startBtn) startBtn.addEventListener("click", function(){
        var name = pendingName || "The dog";
        var startStage = START_STAGES.filter(function(s){ return s.id === pendingStartStage; })[0] || START_STAGES[0];
        state = newDog(name, pendingBreed, pendingHousing, startStage.startDogDays, pendingSex);
        state.typicalHoursAway = lifeById(pendingLife).hoursAway;
        save();
        if (authToken){
          fetch(API_BASE + "/api/onboarding", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
            body: JSON.stringify({
              breedId: pendingBreed,
              housingId: pendingHousing,

              sex: pendingSex,

            })
          }).catch(function(){});
        }
        view = "home";
        render();
      });
    }

    if (view === "home" || view === "walksDetail" || view === "costsDetail" || view === "profileWellbeing" || view === "profileHealth" || view === "profileSettings" || view === "journeyDays" || view === "journeyMilestones" || view === "journeyReport" || view === "reminders"){
      root.querySelectorAll("[data-tab]").forEach(function(el){
        el.addEventListener("click", function(){
          activeTab = el.getAttribute("data-tab");
          render();
        });
      });
      root.querySelectorAll("[data-expense]").forEach(function(el){
        el.addEventListener("click", function(){
          var id = el.getAttribute("data-expense");
          state.selectedExpenses = state.selectedExpenses || [];
          var idx = state.selectedExpenses.indexOf(id);
          if (idx === -1) state.selectedExpenses.push(id); else state.selectedExpenses.splice(idx, 1);
          save();
          render();
        });
      });
      root.querySelectorAll("[data-stat]").forEach(function(el){

          if (stat === "feed") view = "healthFeedInfo";

          else if (stat === "bladder") view = "healthBladderInfo";
          else if (stat === "repro") view = "healthReproInfo";
          render();
        });
      });
      var nextBtn = document.getElementById("next-action-btn");
      if (nextBtn) nextBtn.addEventListener("click", function(){
        var action = nextBtn.getAttribute("data-action");
        if (action === "feed"){
          var fb = document.getElementById("feed-btn");
          if (fb) fb.click();
        } else if (action === "walk"){
          if (state.settings.stepWalks && typeof DeviceMotionEvent !== "undefined") startStepsWalk();
          else if (state.settings.gpsWalks && "geolocation" in navigator) startGpsWalk();
          else doManualWalk();
        } else if (action === "play"){
          view = "safeActivities"; render();
        }
      });
      var mcGoBtn = document.getElementById("microchoice-go");
      if (mcGoBtn) mcGoBtn.addEventListener("click", onLateBathroomGoOut);
      var mcIgnoreBtn = document.getElementById("microchoice-ignore");

      var feedBtn = document.getElementById("feed-btn");
      if (feedBtn) feedBtn.addEventListener("click", function(){

        view = "feedQuiz"; render();
      });
      var walkBtn = document.getElementById("walk-btn");
      if (walkBtn) walkBtn.addEventListener("click", function(){
        if (state.settings.stepWalks && typeof DeviceMotionEvent !== "undefined"){

      var playBtn = document.getElementById("play-btn");

      root.querySelectorAll("[data-today-tile]").forEach(function(el){

        render();

      root.querySelectorAll("[data-train]").forEach(function(el){
        el.addEventListener("click", function(){
          var cooldownLeft = trainCooldownHours(state.dogDays)*HOUR - (Date.now() - state.lastTrainedAt);
          if (cooldownLeft > 0) return;
          if (trainingBlockReason()) return;
          var skillId = el.getAttribute("data-train");
          var stage = stageOf(state.dogDays);
          practiceCtx = {
            skillId: skillId,

            startedAt: Date.now()
          };

  // ---------- walks ----------
  var walkCtx = null;
  var lastWalkSummary = null;

  // Screen Wake Lock: without it, iOS/Android auto-locks the screen mid-walk and
  // both the devicemotion listener (steps) and the GPS watch effectively freeze,
  // so the walk silently stops counting. Re-requested on visibilitychange because
  // the OS releases the lock the moment the page is backgrounded any other way
  // (switching apps, manually pressing the power button), and a fresh request is
  // needed once the user comes back while still mid-walk.
  var wakeLock = null;
  function requestWakeLock(){
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function(lock){
      wakeLock = lock;
      lock.addEventListener("release", function(){ wakeLock = null; });
    }).catch(function(){ wakeLock = null; });
  }
  function releaseWakeLock(){
    if (wakeLock){
      wakeLock.release().catch(function(){});
      wakeLock = null;
    }
  }
  // Fallback for when the screen locks anyway (no Wake Lock support, or the user
  // pressed the power button) — devicemotion/GPS both go silent while hidden, so
  // on resume we estimate the gap instead of just losing it. Steps use an average
  // walking cadence; GPS distance reuses the same 80 m/min pace the walk target
  // is already computed from, so the estimate matches the app's own assumption
  // rather than a second, inconsistent one.
  var AVG_WALK_CADENCE = 100; // steps/min, a typical relaxed walking pace
  var MAX_ESTIMATED_GAP_MIN = 45; // beyond this, assume the walk was abandoned, don't extrapolate
  function onWalkBackgrounded(){
    // A walk paused on purpose shouldn't have the lock-gap estimate credit it
    // with steps/distance it never took — leave hiddenAt unset so the
    // foreground handler below has nothing to extrapolate from.
    if (walkCtx && walkCtx.paused) return;
    if (walkCtx && (walkCtx.mode === "steps" || walkCtx.mode === "gps")) walkCtx.hiddenAt = Date.now();
  }
  function onWalkForegrounded(){
    if (!walkCtx) return;
    if (!wakeLock) requestWakeLock();
    if (walkCtx.hiddenAt && (walkCtx.mode === "steps" || walkCtx.mode === "gps")){
      var gapMin = Math.min(MAX_ESTIMATED_GAP_MIN, (Date.now() - walkCtx.hiddenAt)/60000);
      walkCtx.hiddenAt = null;
      if (gapMin > 0.15){
        if (walkCtx.mode === "steps"){
          var estSteps = Math.round(gapMin*AVG_WALK_CADENCE);
          walkCtx.steps += estSteps;
          walkCtx.estimatedSteps = (walkCtx.estimatedSteps||0) + estSteps;
          walkCtx.activeSeconds += Math.round(gapMin*60);
          walkCtx.lastStepTime = Date.now();
        } else {
          var estDist = gapMin*80;
          walkCtx.distance += estDist;
          walkCtx.estimatedDistance = (walkCtx.estimatedDistance||0) + estDist;
        }
        render();
      }
    }
  }
  // document.visibilitychange is the only signal on the web/PWA build, but inside
  // the native Capacitor WebView it does NOT reliably fire when the screen locks
  // (WebKit/WebView often keep reporting "visible" since the app itself isn't
  // switched away, only the physical display is off) — so on native we rely on
  // Capacitor's own App plugin lifecycle event instead, which mirrors the real
  // OS-level background/foreground transition, screen lock included.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") return onWalkBackgrounded();
    if (document.visibilityState === "visible") onWalkForegrounded();
  });
  (function(){
    try {
      var CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      if (!CapApp) return;
      CapApp.addListener("appStateChange", function(state){
        if (state && state.isActive) onWalkForegrounded();
        else onWalkBackgrounded();
      });
    } catch (e) {}
  })();

  // Registered once (not inside attachHandlers, which reruns every render)

  document.addEventListener("keydown", function(e){

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d*Math.PI/180; };
    var dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function applyWalkOutcome(fraction, note, verified, minutesOverride){
    fraction = Math.max(0.15, Math.min(1, fraction));
    var breed = byId(state.breedId);
    var day = tripDay();
    if (state.walkMinutesDay !== day){ state.walkMinutesDay = day; state.walkMinutesToday = 0; }
    state.walkMinutesToday = (state.walkMinutesToday||0) + (minutesOverride !== undefined ? minutesOverride : Math.round(fraction*breed.walkMinutes));
    state.lastWalkVerified = !!verified;
    state.bladder = 100;
    // A verified walk session (GPS/steps completed, or logged after a
    // tracking error) counts as one of the day's ~2 walks regardless of how
    // it compares to the breed's target duration — duration affects bond/
    // houseTraining gains and the "cut short" note, not how soon the next
    // walk is needed. Only an explicit skip ("couldn't walk today", not
    // verified) leaves energy on the fraction-scaled partial restore.
    state.energy = clamp(state.energy + (verified ? 1 : fraction)*(100-state.energy));
    state.bond = clamp(state.bond + fraction*3);
    state.houseTraining = clamp(state.houseTraining + fraction*2);
    state.walksCompleted = (state.walksCompleted||0) + 1;
    bumpOwnerLoad(3);
    log(note);
    save();
  }

    var breed = byId(state.breedId);
    walkCtx = { mode:"gps", watchId:null, distance:0, lastPos:null, target: Math.round(breed.walkMinutes*80) };
    view = "walkGps"; render();
    requestWakeLock();
    walkCtx.watchId = navigator.geolocation.watchPosition(onWalkPos, onWalkErr, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }
  // Ending the walk asks for confirmation rather than applying the outcome straight away —
  // a person reviews what was measured before it's logged, per the "no GPS gotchas" rule.
  function requestGpsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    if (walkCtx.watchId != null) { navigator.geolocation.clearWatch(walkCtx.watchId); walkCtx.watchId = null; }
    releaseWakeLock();
    view = "walkConfirm"; render();
  }
  function onWalkPos(pos){
    if (!walkCtx) return;
    var c = pos.coords;
    if (walkCtx.lastPos){
      var d = haversine(walkCtx.lastPos.latitude, walkCtx.lastPos.longitude, c.latitude, c.longitude);
      if (d > 2 && d < 100) walkCtx.distance += d;
    }
    walkCtx.lastPos = c;
    if (view === "walkGps"){
      var pct = Math.min(100, Math.round(walkCtx.distance/walkCtx.target*100));
      var bar = document.getElementById("walk-bar");
      var label = document.getElementById("walk-dist");
      if (bar) bar.style.width = pct + "%";
      if (label) label.textContent = Math.round(walkCtx.distance) + " m / " + walkCtx.target + " m";
    }
  }
  function onWalkErr(){
    finishGpsWalk(true, false);
  }
  function finishGpsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    var dist = Math.round(walkCtx.distance);
    var fraction = walkCtx.distance / walkCtx.target;
    if (walkCtx.watchId != null) navigator.geolocation.clearWatch(walkCtx.watchId);
    releaseWakeLock();
    var lockNote = walkCtx.estimatedDistance ? " (~" + Math.round(walkCtx.estimatedDistance) + "m estimated while your screen was locked)" : "";
    var note;
    if (errored) { note = "Walked " + state.name + " (GPS signal lost — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — GPS confirmed " + dist + "m." + lockNote;
    else note = "Cut the walk short with " + state.name + " — only " + dist + "m confirmed." + lockNote;
    applyWalkOutcome(fraction, note, !errored && !couldntWalk);
    lastWalkSummary = { mode:"gps", distance:dist, target:walkCtx.target, goalReached: fraction >= 0.9, couldntWalk: couldntWalk };
    walkCtx = null;
    view = "walkSummary"; render();
  }

  function startStepsWalk(){
    var breed = byId(state.breedId);
    walkCtx = { mode:"steps", steps:0, filtered:9.8, lastStepTime:0, activeSeconds:0, goalMinutes: breed.walkMinutes, lastTickAt: Date.now(), paused:false };
    view = "walkSteps"; render();
    requestWakeLock();
    function attach(){
      window.addEventListener("devicemotion", onStepMotion);
    }
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
      DeviceMotionEvent.requestPermission().then(function(resp){
        if (resp === "granted") attach();
        else finishStepsWalk(true, false);
      }).catch(function(){ finishStepsWalk(true, false); });
    } else if (typeof DeviceMotionEvent !== "undefined"){
      attach();
    } else {
      finishStepsWalk(true, false);
    }
  }
  function requestStepsWalkConfirm(){
    if (!walkCtx) { view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    stopLiveTimer();
    releaseWakeLock();
    view = "walkConfirm"; render();
  }
  function togglePauseStepsWalk(){
    if (!walkCtx) return;
    walkCtx.paused = !walkCtx.paused;
    walkCtx.lastTickAt = Date.now();
    render();
  }
  function onStepMotion(e){
    if (!walkCtx || walkCtx.mode !== "steps" || walkCtx.paused) return;
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x == null) return;
    var mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    walkCtx.filtered = walkCtx.filtered*0.9 + mag*0.1;
    var delta = mag - walkCtx.filtered;
    var now = Date.now();
    if (delta > 1.2 && (now - walkCtx.lastStepTime) > 300){
      walkCtx.steps++;
      walkCtx.lastStepTime = now;
      var countEl = document.getElementById("walk-steps-count");
      if (countEl) countEl.textContent = walkCtx.steps;
    }
  }
  function finishStepsWalk(errored, couldntWalk){
    if (!walkCtx){ view = "home"; render(); return; }
    window.removeEventListener("devicemotion", onStepMotion);
    releaseWakeLock();
    var steps = walkCtx.steps;
    var minutesWalked = Math.round(walkCtx.activeSeconds/60);
    var fraction = Math.max(0, Math.min(1, walkCtx.activeSeconds/(walkCtx.goalMinutes*60)));
    var lockNote = walkCtx.estimatedSteps ? " (" + walkCtx.estimatedSteps + " steps estimated while your screen was locked)" : "";
    var note;
    if (errored) { note = "Walked " + state.name + " (motion access unavailable — logged manually)."; fraction = 1; }
    else if (couldntWalk) { note = "Couldn't walk " + state.name + " today — plans changed."; fraction = 0.15; }
    else if (fraction >= 0.9) note = "Walked " + state.name + " — " + minutesWalked + " of " + walkCtx.goalMinutes + " min, " + steps + " steps." + lockNote;
    else note = "Cut the walk short with " + state.name + " — only " + minutesWalked + " of " + walkCtx.goalMinutes + " min." + lockNote;
    applyWalkOutcome(fraction, note, !errored && !couldntWalk, minutesWalked);
    lastWalkSummary = { mode:"steps", minutesWalked:minutesWalked, goalMinutes:walkCtx.goalMinutes, steps:steps, activeSeconds:walkCtx.activeSeconds, goalReached: fraction >= 0.9, couldntWalk: couldntWalk };
    walkCtx = null;
    stopLiveTimer();
    view = "walkSummary"; render();
  }

  // ---------- at-work live clock ----------
  var atWorkInterval = null;
  function checkAwayAlert(){
    if (!state.away || state.away.awayAlerted) return;
    var stage = stageOf(state.dogDays);
    var breed = byId(state.breedId);
    var housing = housingById(state.housingId);
    var tolerance = computeTolerance(breed, stage, housing);
    var elapsed = (Date.now() - state.away.leaveStart)/HOUR;
    if (elapsed <= tolerance) return;
    state.away.awayAlerted = true;
    log(state.name + " is becoming restless — past the alone-time " + breed.name + " can comfortably handle right now.");
    save();
    var alertEl = document.getElementById("atwork-alert");
    if (alertEl) alertEl.innerHTML = anxietyAlertHtml();
    if (state.settings.notifications && ("Notification" in window) && Notification.permission === "granted"){
      try { new Notification("The 30-Day Dog", { body: state.name + "'s anxiety is climbing. " + housingRiskNote(housing), tag: "anxiety-alert" }); } catch(e){}
    }
  }

  function startAtWorkClock(){
    stopLiveTimer();
    checkAwayAlert();
    atWorkInterval = setInterval(function(){
      if (view !== "atWork" || !state.away) { stopLiveTimer(); return; }
      var away = state.away;
      var remaining = away.declaredHours*HOUR - (Date.now() - away.leaveStart);
      var clockEl = document.getElementById("atwork-clock");
      var labelEl = document.getElementById("atwork-label");
      if (clockEl) clockEl.textContent = fmtClock(Math.abs(remaining));
      if (labelEl) labelEl.textContent = remaining > 0 ? "Due home in" : "Overdue by";
      checkAwayAlert();
    }, 1000);
  }
  function stopLiveTimer(){
    if (atWorkInterval) clearInterval(atWorkInterval);
    atWorkInterval = null;
  }
  function startStepsClock(){
    stopLiveTimer();
    atWorkInterval = setInterval(function(){
      if (view !== "walkSteps" || !walkCtx){ stopLiveTimer(); return; }
      // Wall-clock delta rather than a flat ++ so throttled/coalesced ticks (a
      // background tab, brief lock the wake lock didn't catch) still add the
      // real elapsed time on the next tick instead of quietly losing it.
      var now = Date.now();
      var deltaSec = Math.round((now - (walkCtx.lastTickAt||now))/1000);
      walkCtx.lastTickAt = now;
      // Paused: the walker asked us to stop counting, so neither steps (see
      // onStepMotion's own guard) nor active time should accrue until resumed.
      var moving = !walkCtx.paused && (now - walkCtx.lastStepTime) < 90000; // real walks include stops (sniffing, curbs, the dog's business) well over 20s; without this the ring stalls during a normal walk
      if (moving) walkCtx.activeSeconds += Math.max(1, deltaSec);
      var goalSec = walkCtx.goalMinutes*60;
      var pct = Math.min(100, Math.round(walkCtx.activeSeconds/goalSec*100));
      var numEl = document.getElementById("ring-num");
      if (numEl) numEl.textContent = pad2(Math.floor(walkCtx.activeSeconds/60)) + ":" + pad2(walkCtx.activeSeconds%60);
      var remainEl = document.getElementById("walk-remain");
      if (remainEl){
        var remainSec = Math.max(0, goalSec - walkCtx.activeSeconds);
        remainEl.textContent = pad2(Math.floor(remainSec/60)) + ":" + pad2(remainSec%60);
      }
      var circle = document.getElementById("ring-progress");
      if (circle){
        var r = 66, c = 2*Math.PI*r;
        circle.style.strokeDashoffset = (c - pct/100*c);
      }
      var motionEl = document.getElementById("walk-motion-label");
      if (motionEl) motionEl.textContent = walkCtx.paused
        ? tr('walk_paused_label',"Paused")
        : (moving ? tr('walk_moving_label',"Walking — tracking your steps") : tr('walk_still_label',"Standing still — progress paused"));
    }, 1000);
  }

        '<div class="aa-row"><span class="aa-icon-chip">'+icon(iconName)+'</span><span class="aa-grow"></span><span class="aa-arrow">›</span></div>' +
        '<b>'+esc(title)+'</b><span class="aa-small">'+esc(sub)+'</span>' +
      '</button>';
  }
  function aaBackButton(targetView, label){
    return '<button class="aa-btn-back" data-go="'+targetView+'">'+icon("arrowLeft", 16)+' '+esc(label)+'</button>';
  }
  function aaHeader(){
    return '' +
      '<header class="aa-header">' +
        '<span class="aa-logo">dogtrial</span>' +
        '<div class="aa-row" style="gap:8px;">' +
          '<button class="aa-header-btn aa-accent" data-go="afterAdoptTraining">'+aaTr("tile_training_title").split(" /")[0]+' →</button>' +
          '<button class="aa-header-icon-btn" data-go="afterAdoptProfile" aria-label="'+aaTr("nav_profile")+'">'+icon("paw")+'</button>' +
        '</div>' +
      '</header>';
  }
  function aaNav(currentView){
    var items = [
      ["afterAdoptHome", "home", aaTr("nav_home")],
      ["afterAdoptJournal", "notebook", aaTr("nav_journal")],
      ["afterAdoptProfile", "user", aaTr("nav_profile")]
    ];
    var html = items.map(function(item){
      var v = item[0], iconName = item[1], label = item[2];
      var current = (currentView === v) ? ' aria-current="page"' : '';
      return '<button data-go="'+v+'"'+current+'><span>'+icon(iconName)+'</span>'+esc(label)+'</button>';
    }).join("");
    return '<nav class="aa-nav" aria-label="Navigation principale">'+html+'</nav>';
  }
  function aaFrame(bodyHtml, currentView){
    return '<div class="aa-root">' + aaHeader() + bodyHtml +
      '<footer class="aa-footer">Module « La vie ensemble » — non relié à la navigation</footer>' +
      aaNav(currentView) + '</div>';
  }

        '<label class="aa-hero-upload">' +
          icon("camera", 15) + '<span>'+aaTr("hero_upload_label")+'</span>' +
          '<input type="file" accept="image/*" id="aa-hero-photo-input" aria-label="'+aaTr("hero_upload_label")+'">' +
        '</label>' +
        '<div>' +
          '<span class="aa-eyebrow">'+aaTr("home_eyebrow")+'</span>' +

          '<h2>'+aaTr("routine_card_title")+'<br>'+aaTr("routine_card_title2")+'</h2>' +

          '<button class="aa-btn-primary" data-go="afterAdoptRoutine">'+aaTr("routine_cta")+'</button>' +
        '</section>' +
        '<h2>'+aaTr("section_daily")+'</h2>' +
        '<div class="aa-grid">' +
          aaTileCard("afterAdoptWalk", "paw", aaTr("tile_walk_title"), aaTr("tile_walk_sub")) +

    return aaFrame(body, "afterAdoptHome");
  }

  var AA_LESSONS = [
    {id: "attention", title: "Créer le contact", sub: "Attention et complicité"},
    {id: "assis", title: "Découvrir « assis »", sub: "Les premiers repères"},
    {id: "rappel", title: "Revenir vers vous", sub: "Le rappel au quotidien"}
  ];

  function renderAfterAdoptTraining(){
    var n = esc(afterAdoptState.name);
    var lessonsHtml = AA_LESSONS.map(function(l){
      var visited = (afterAdoptState.lessons || []).indexOf(l.id) !== -1;
      return '' +
        '<button class="aa-card aa-row" data-go="afterAdoptLesson-'+l.id+'">' +
          '<span class="aa-icon-chip">'+icon("cap")+'</span>' +
          '<span class="aa-grow"><b>'+esc(l.title)+'</b><span class="aa-small">'+esc(l.sub)+(visited ? aaTr("lesson_visited_suffix") : "")+'</span></span>' +
          '<span class="aa-arrow">›</span>' +
        '</button>';
    }).join("");
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("training_title")+'</h1>' +
        '<p>Des séances courtes pour accompagner votre quotidien avec '+n+'.</p>' +
        '<section class="aa-card aa-soft">' +
          '<span class="aa-eyebrow">'+aaTr("training_eyebrow")+'</span>' +
          '<h2>'+aaTr("training_card_title")+'</h2>' +

  function renderAfterAdoptLesson(lessonId){
    var lesson = AA_LESSONS.filter(function(l){ return l.id === lessonId; })[0];
    if (!lesson) { view = "afterAdoptTraining"; return renderAfterAdoptTraining(); }
    var visited = (afterAdoptState.lessons || []).indexOf(lessonId) !== -1;
    var videoUrl = AA_CONNECTORS.getLessonVideoUrl(lessonId); // always null today
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptTraining", aaTr("lesson_back")) +
        '<h1>'+esc(lesson.title)+'</h1>' +
        '<section class="aa-card aa-soft" style="text-align:center; padding:32px 18px;">' +
          '<span class="aa-icon-chip" style="margin:0 auto 10px;">'+icon("cap")+'</span>' +
          '<h2>'+aaTr("lesson_video_title")+'</h2>' +
          '<p>'+(videoUrl ? esc(videoUrl) : aaTr("lesson_video_placeholder"))+'</p>' +
        '</section>' +
        '<section class="aa-card"><b>'+aaTr("lesson_practice_title")+'</b><p>'+aaTr("lesson_practice_body")+'</p></section>' +
        '<button class="aa-btn-primary" data-lesson="'+esc(lessonId)+'">'+(visited ? aaTr("lesson_done") : aaTr("lesson_mark_done"))+'</button>' +
      '</div>';

  var AA_ARRIVAL_TIPS = [
    {title: "Un coin tranquille", body: "Préparez un espace où il peut se reposer sans être dérangé."},
    {title: "Des repères réguliers", body: "Organisez les sorties et les moments de repos selon votre quotidien."},
    {title: "Des rencontres progressives", body: "Laissez-lui le temps de découvrir les personnes et les lieux."}
  ];

  function renderAfterAdoptArrival(){
    var tipsHtml = AA_ARRIVAL_TIPS.map(function(t){
      return '<div class="aa-card"><b>'+esc(t.title)+'</b><p>'+esc(t.body)+'</p></div>';
    }).join("");
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("arrival_title")+'</h1>' +
        '<p>'+aaTr("arrival_subtitle")+'</p>' +
        tipsHtml +
        '<button class="aa-btn-primary" data-go="afterAdoptRoutine">'+aaTr("arrival_cta")+'</button>' +
      '</div>';
    return aaFrame(body, "afterAdoptHome");
  }

  var AA_ROUTINE_TASKS = ["Préparer son repas", "Partager une sortie", "Prévoir un moment calme"];

  function renderAfterAdoptRoutine(){
    var tasksHtml = AA_ROUTINE_TASKS.map(function(t, i){
      return '' +
        '<div class="aa-task-row">' +
          '<label for="aa-task-'+i+'" class="aa-grow">'+esc(t)+'</label>' +
          '<input id="aa-task-'+i+'" type="checkbox" data-task="'+i+'" '+(afterAdoptState.tasks[i] ? "checked" : "")+'>' +
        '</div>';
    }).join("");
    var doneCount = afterAdoptState.tasks.filter(Boolean).length;
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("routine_title")+'</h1>' +
        '<p>'+aaTr("routine_subtitle")+'</p>' +
        '<section class="aa-card">'+tasksHtml+'</section>' +
        '<p>'+doneCount+aaTr("routine_progress_suffix")+'</p>' +
        '<button class="aa-btn-secondary" data-action="aa-reset-routine">'+aaTr("routine_reset")+'</button>' +
      '</div>';

  }

  function renderAfterAdoptWalk(){
    var walking = !!afterAdoptWalkStartedAt;
    var historyHtml = afterAdoptState.walks.length
      ? afterAdoptState.walks.map(function(w){
          return '<div class="aa-card">'+esc(w.date)+'<b class="aa-small">'+w.minutes+aaTr("walk_minutes_suffix")+'</b></div>';
        }).join("")
      : '<p>'+aaTr("walk_history_empty")+'</p>';
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("walk_title")+'</h1>' +
        '<section class="aa-card aa-soft">' +
          '<span class="aa-eyebrow">'+aaTr("walk_eyebrow")+'</span>' +
          '<h2 id="aa-walk-clock">'+(walking ? aaElapsedLabel() : aaTr("walk_ready"))+'</h2>' +
          '<p>'+aaTr("walk_notice")+'</p>' +
          '<button class="aa-btn-primary" data-action="'+(walking ? "aa-stop-walk" : "aa-start-walk")+'">'+(walking ? aaTr("walk_stop") : aaTr("walk_start"))+'</button>' +
        '</section>' +
        '<h2>'+aaTr("walk_history_title")+'</h2>' +
        historyHtml +
      '</div>';
    return aaFrame(body, "afterAdoptHome");
  }

  function renderAfterAdoptJournal(){
    var entriesHtml = afterAdoptState.notes.length
      ? afterAdoptState.notes.map(function(x){
          return '<article class="aa-card"><span class="aa-small">'+esc(x.date)+'</span><p style="white-space:pre-wrap">'+esc(x.text)+'</p></article>';
        }).join("")
      : '<p>'+aaTr("journal_empty")+'</p>';
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("journal_title")+'</h1>' +
        '<p>'+aaTr("journal_subtitle")+'</p>' +
        '<form id="aa-form-note">' +
          '<label for="aa-observation">'+aaTr("journal_label")+'</label>' +
          '<textarea id="aa-observation" name="text" required maxlength="1200" placeholder="'+aaTr("journal_placeholder")+'"></textarea>' +
          '<button class="aa-btn-primary" type="submit">'+aaTr("journal_submit")+'</button>' +
        '</form>' +
        '<h2>'+aaTr("journal_history_title")+'</h2>' +
        entriesHtml +
      '</div>';
    return aaFrame(body, "afterAdoptJournal");
  }

  function renderAfterAdoptBudget(){
    var total = afterAdoptState.expenses.reduce(function(s, x){ return s + x.amount; }, 0);
    var historyHtml = afterAdoptState.expenses.length
      ? afterAdoptState.expenses.map(function(x){
          return '<div class="aa-card aa-row"><span class="aa-grow">'+esc(x.label)+'</span><b>'+esc(Number(x.amount).toLocaleString("fr-FR", {style:"currency", currency:"EUR"}))+'</b></div>';
        }).join("")
      : '<p>'+aaTr("budget_empty")+'</p>';
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("budget_title")+'</h1>' +
        '<section class="aa-card aa-soft"><span class="aa-eyebrow">'+aaTr("budget_eyebrow")+'</span><h2>'+esc(total.toLocaleString("fr-FR", {style:"currency", currency:"EUR"}))+'</h2></section>' +
        '<form id="aa-form-expense">' +
          '<label for="aa-expense-label">'+aaTr("budget_label_item")+'</label>' +
          '<input id="aa-expense-label" name="label" required maxlength="100" placeholder="'+aaTr("budget_placeholder_item")+'">' +
          '<label for="aa-expense-amount">'+aaTr("budget_label_amount")+'</label>' +
          '<input id="aa-expense-amount" name="amount" type="number" min="0.01" max="100000" step="0.01" required>' +
          '<button class="aa-btn-primary" type="submit">'+aaTr("budget_submit")+'</button>' +
        '</form>' +
        '<h2>'+aaTr("budget_history_title")+'</h2>' +
        historyHtml +
      '</div>';
    return aaFrame(body, "afterAdoptHome");
  }

  function renderAfterAdoptCare(){
    var n = esc(afterAdoptState.name);
    var upcomingHtml = afterAdoptState.care.length
      ? afterAdoptState.care.map(function(x){
          return '<div class="aa-card"><b>'+esc(x.label)+'</b><span class="aa-small">'+esc(x.date.split("-").reverse().join("/"))+'</span></div>';
        }).join("")
      : '<p>'+aaTr("care_empty")+'</p>';
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("care_title")+'</h1>' +
        '<p>'+aaTr("care_subtitle_prefix")+n+aaTr("care_subtitle_suffix")+'</p>' +
        '<form id="aa-form-care">' +
          '<label for="aa-care-label">'+aaTr("care_label_item")+'</label>' +
          '<input id="aa-care-label" name="label" required maxlength="100" placeholder="'+aaTr("care_placeholder_item")+'">' +
          '<label for="aa-care-date">'+aaTr("care_label_date")+'</label>' +
          '<input id="aa-care-date" name="date" type="date" required>' +
          '<button class="aa-btn-primary" type="submit">'+aaTr("care_submit")+'</button>' +
        '</form>' +
        '<p class="aa-notice">'+aaTr("care_notice")+'</p>' +
        '<h2>'+aaTr("care_upcoming_title")+'</h2>' +
        upcomingHtml +
      '</div>';
    return aaFrame(body, "afterAdoptHome");
  }

  function renderAfterAdoptProfile(){
    var n = esc(afterAdoptState.name);
    var breedOptions = AA_BREEDS.map(function(b){
      return '<option value="'+b.id+'"'+(b.id === afterAdoptState.breedId ? " selected" : "")+'>'+esc(b.name)+'</option>';
    }).join("");
    var body = '' +
      '<div class="aa-content">' +
        aaBackButton("afterAdoptHome", aaTr("back_today")) +
        '<h1>'+aaTr("profile_title")+'</h1>' +
        '<form id="aa-form-profile">' +
          '<label for="aa-dog-name">'+aaTr("profile_label_name")+'</label>' +
          '<input id="aa-dog-name" name="name" required maxlength="35" value="'+n+'">' +
          '<label for="aa-dog-breed">'+aaTr("profile_label_breed")+'</label>' +
          '<select id="aa-dog-breed" name="breedId">'+breedOptions+'</select>' +
          '<span class="aa-notice" style="display:block; margin:-8px 0 14px;">'+aaTr("profile_breed_note")+'</span>' +
          '<button class="aa-btn-primary" type="submit">'+aaTr("profile_submit")+'</button>' +
        '</form>' +
        '<section class="aa-card aa-warm" style="margin-top:22px;"><b>'+aaTr("profile_demo_title")+'</b><p>'+aaTr("profile_demo_body")+'</p></section>' +
      '</div>';
    return aaFrame(body, "afterAdoptProfile");
  }

  setInterval(function(){
    if (view.indexOf("afterAdopt") !== 0) return;
    var clockEl = document.getElementById("aa-walk-clock");
    if (afterAdoptWalkStartedAt && clockEl) clockEl.textContent = aaElapsedLabel();
  }, 1000);

  document.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if (!btn) return;
    // Only ever react to elements this dormant module itself rendered
    // (its own "afterAdopt*" / "aa-*" data attributes) — never to the
    // real app's buttons, regardless of the current `view`.
    var isOwnButton = (btn.dataset.go && btn.dataset.go.indexOf("afterAdopt") === 0) ||
      btn.dataset.lesson || (btn.dataset.action && btn.dataset.action.indexOf("aa-") === 0);
    if (!isOwnButton) return;

    if (btn.dataset.lesson){
      afterAdoptState.lessons = afterAdoptState.lessons || [];
      if (afterAdoptState.lessons.indexOf(btn.dataset.lesson) === -1) afterAdoptState.lessons.push(btn.dataset.lesson);
      aaSave(); render(); aaNotify(aaTr("toast_lesson_done"));
      return;
    }
    if (btn.dataset.go){
      view = btn.dataset.go; render(); window.scrollTo(0, 0);
      return;
    }
    if (btn.dataset.action === "aa-start-walk"){
      AA_CONNECTORS.startGpsWalk();
      afterAdoptWalkStartedAt = Date.now(); render();
      return;
    }
    if (btn.dataset.action === "aa-stop-walk" && afterAdoptWalkStartedAt){
      var minutes = Math.round((Date.now() - afterAdoptWalkStartedAt) / 6000) / 10;
      afterAdoptState.walks.unshift({date: new Date().toLocaleDateString("fr-FR"), minutes: minutes});
      afterAdoptWalkStartedAt = null;
      aaSave(); render(); aaNotify(aaTr("toast_walk_saved"));
      return;
    }
    if (btn.dataset.action === "aa-reset-routine"){
      afterAdoptState.tasks = [false, false, false];
      aaSave(); render();
      return;
    }
  });

  document.addEventListener("change", function(e){
    if (view.indexOf("afterAdopt") !== 0) return;
    if (e.target.dataset.task !== undefined){
      afterAdoptState.tasks[Number(e.target.dataset.task)] = e.target.checked;
      aaSave(); render();
      return;
    }
    if (e.target.id === "aa-hero-photo-input"){
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024){
        aaNotify(aaTr("toast_photo_too_large"));
        e.target.value = "";
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        afterAdoptState.heroPhoto = reader.result;
        aaSave(); render(); aaNotify(aaTr("toast_photo_saved"));
      };
      reader.readAsDataURL(file);
    }
  });

  document.addEventListener("submit", function(e){
    if (view.indexOf("afterAdopt") !== 0) return;
    e.preventDefault();
    var form = e.target;
    var data = new FormData(form);

    if (form.id === "aa-form-profile"){
      var name = String(data.get("name") || "").trim();
      if (!name) return;
      afterAdoptState.name = name;
      var breedId = String(data.get("breedId") || "").trim();
      if (breedId) afterAdoptState.breedId = breedId;
    }
    if (form.id === "aa-form-note"){
      var text = String(data.get("text") || "").trim();
      if (!text) return;
      afterAdoptState.notes.unshift({text: text, date: new Date().toLocaleDateString("fr-FR")});
    }
    if (form.id === "aa-form-expense"){
      var label = String(data.get("label") || "").trim();
      var amount = Number(data.get("amount"));
      if (!label || !isFinite(amount) || amount <= 0) return;
      afterAdoptState.expenses.unshift({label: label, amount: amount});
    }
    if (form.id === "aa-form-care"){
      var careLabel = String(data.get("label") || "").trim();
      if (!careLabel) return;
      afterAdoptState.care.push({label: careLabel, date: data.get("date")});
      afterAdoptState.care.sort(function(a, b){ return a.date.localeCompare(b.date); });
      // Future: AA_CONNECTORS.scheduleReminder(careLabel, data.get("date"));
    }

    aaSave(); render(); aaNotify(aaTr("toast_saved"));
  });

  document.addEventListener("DOMContentLoaded", init);
})();
</script>

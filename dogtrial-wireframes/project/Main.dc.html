<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aujourd'hui</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#0B0E15;}
  *{box-sizing:border-box;}
  .pf{font-family:'Poppins',system-ui,sans-serif;}
  .inf{font-family:'Inter',system-ui,sans-serif;}
</style>
</helmet>

<div class="inf" style="width:390px;height:844px;background:#0B0E15;color:#F4F5FA;position:relative;overflow:hidden;">

  <div style="position:absolute;top:0;left:0;right:0;bottom:66px;overflow-y:auto;padding:22px 18px 20px;">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
      <div class="pf" style="width:48px;height:48px;border-radius:999px;background:#191F2D;border:2px solid #858EFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#9DA4FF;flex-shrink:0;">R</div>
      <div>
        <div class="pf" style="font-weight:700;font-size:17px;line-height:1.2;">Rex</div>
        <div style="font-size:12.5px;color:#A5ADBF;margin-top:2px;">Jour 4 ensemble</div>
      </div>
    </div>

    <sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}">
      <div style="background:linear-gradient(135deg,#9DA4FF,#6C74E8);border-radius:16px;padding:18px 20px;margin-bottom:24px;color:#0B0E15;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:7px;">Prochaine routine</div>
        <div class="pf" style="font-weight:700;font-size:19px;margin-bottom:4px;">{{nextTitle}}</div>
        <div style="font-size:13px;opacity:.75;margin-bottom:16px;">{{nextTime}} · dans environ 45 min</div>
        <button onClick="{{nextToggle}}" style="background:#0B0E15;color:#F4F5FA;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:600;">Marquer comme fait</button>
      </div>
    </sc-if>
    <sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
      <div style="background:#121722;border:1px solid #242B3A;border-radius:16px;padding:20px;margin-bottom:24px;text-align:center;">
        <div style="font-size:26px;margin-bottom:6px;">🎉</div>
        <div class="pf" style="font-weight:700;font-size:15px;">Toutes les routines du jour sont faites</div>
      </div>
    </sc-if>

    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#697287;margin-bottom:11px;">Toutes les routines</div>

    <sc-for list="{{routines}}" as="r" hint-placeholder-count="4">
      <div onClick="{{r.toggle}}" style="display:flex;align-items:center;gap:12px;background:#121722;border:1px solid #242B3A;border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;">
        <div style="width:23px;height:23px;border-radius:7px;border:2px solid {{r.checkBorder}};background:{{r.checkBg}};display:flex;align-items:center;justify-content:center;font-size:13px;color:#0B0E15;flex-shrink:0;font-weight:700;">{{r.checkMark}}</div>
        <div style="flex-grow:1;min-width:0;">
          <div style="font-weight:600;font-size:14px;">{{r.title}}</div>
          <div style="font-size:12px;color:#A5ADBF;margin-top:1px;">{{r.time}}</div>
        </div>
        <div style="font-size:11px;font-weight:600;padding:4px 11px;border-radius:100px;background:{{r.pillBg}};color:{{r.pillColor}};white-space:nowrap;">{{r.statusLabel}}</div>
      </div>
    </sc-for>

    <a href="Routines.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #2D3850;border-radius:12px;padding:14px;color:#A5ADBF;font-size:13.5px;font-weight:600;margin-top:6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter ou gérer les routines
    </a>

  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:66px;background:#121722;border-top:1px solid #242B3A;display:flex;align-items:stretch;">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9DA4FF;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span style="font-size:10px;font-weight:600;">Aujourd'hui</span>
    </a>
    <a href="Routines.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#697287;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
      <span style="font-size:10px;font-weight:500;">Routines</span>
    </a>
    <a href="Entrainement.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#697287;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.5 2.5 3 6 3s6-1.5 6-3v-5.5"/></svg>
      <span style="font-size:10px;font-weight:500;">Éducation</span>
    </a>
    <a href="Sante.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#697287;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <span style="font-size:10px;font-weight:500;">Santé</span>
    </a>
    <a href="Premium.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#697287;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
      <span style="font-size:10px;font-weight:500;">Plus</span>
    </a>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { done: { r1:true, r2:false, r3:false, r4:false } };
  }
  toggle(id){
    var d = Object.assign({}, this.state.done);
    d[id] = !d[id];
    this.setState({ done: d });
  }
  renderVals(){
    var self = this;
    var base = [
      { id:'r1', title:'Repas du matin', time:'8h00' },
      { id:'r2', title:'Sortie', time:'12h30' },
      { id:'r3', title:'Repas du soir', time:'19h00' },
      { id:'r4', title:'Séance de jeu', time:'20h30' }
    ];
    var routines = base.map(function(r){
      var isDone = !!self.state.done[r.id];
      return {
        id: r.id,
        title: r.title,
        time: r.time,
        done: isDone,
        statusLabel: isDone ? 'Fait' : 'À faire',
        checkMark: isDone ? '✓' : '',
        checkBg: isDone ? '#52D6A3' : 'transparent',
        checkBorder: isDone ? '#52D6A3' : '#2D3850',
        pillBg: isDone ? 'rgba(82,214,163,.14)' : 'rgba(133,142,255,.14)',
        pillColor: isDone ? '#52D6A3' : '#9DA4FF',
        toggle: function(){ self.toggle(r.id); }
      };
    });
    var next = routines.filter(function(r){ return !r.done; })[0];
    return {
      routines: routines,
      hasNext: !!next,
      allDone: !next,
      nextTitle: next ? next.title : '',
      nextTime: next ? next.time : '',
      nextToggle: next ? next.toggle : function(){}
    };
  }
}
</script>
</body>
</html>
